# Shared nginx config for the static SPA images.
#
# ★ WHY THIS FILE EXISTS AT ALL. Four Dockerfiles carried byte-identical copies of this
# server block, written as a `RUN printf 'server {\n\ ...'` with every line escaped twice.
# The same bug therefore existed in four places, and fixing it in one would have been
# indistinguishable from fixing it everywhere. It is a config file; it should be a file.
#
# ★ THE BUG THIS FIXES. `try_files $uri $uri/ /index.html` is the standard SPA fallback,
# and applied to EVERY path it means a missing asset returns 200 with an HTML body:
#
#     GET /definitely-not-a-real-asset.js  ->  200 text/html      (measured, live)
#
# That is not cosmetic. A broken deploy looks healthy to a browser and to any uptime check
# that only reads the status code; a bad `import` receives an HTML page and fails with the
# classic `Unexpected token '<'` far from its cause; and caches and crawlers happily store
# the wrong body under the asset's URL.
#
# The fallback is only correct for NAVIGATIONS — a History-API route like /substrate has no
# extension and must serve the shell. Anything that looks like a file must 404 when absent.
#
# ★ ORDERING IS LOad-BEARING. nginx evaluates `=` exact, then `^~` prefix, then regexes in
# order, then plain prefixes. `/assets/` uses `^~` deliberately: without it the regex below
# would win for /assets/app.js and strip the immutable caching this block exists to apply.
#
# ★ add_header DOES NOT INHERIT. If a location defines any add_header of its own, it
# discards every add_header from the enclosing scope — so Strict-Transport-Security has to
# be repeated in each block rather than declared once on the server. Setting it once at the
# top would silently leave the asset and index.html responses without it.
# ★ AND /health HAD TO BE AN EXACT LOCATION, or it is not a health check.
#
# `/health` has no extension, so it fell through to the navigation block below and was
# served the SPA shell: `200 text/html`, measured live on both dashboard and microsite. A
# health check that returns 200 with an HTML body regardless of whether the app works is
# not reporting health — and `tools/railway-redeploy.mjs --verify-url` parses `j.build`
# from JSON, so it could never confirm ANY of these services. Without --verify-url that
# tool exits 0 after printing its own disclaimer that nothing has been confirmed, which is
# how "deployed" and "verified" came apart for every static image in the fleet.
#
# __BUILD_SHA__ is substituted at image build time from the GIT_SHA build-arg that
# build-ghcr.yml already passes to every image (only the relay consumed it before). That is
# what makes a redeploy VERIFIABLE the same way the relay's is: fetch /health, compare the
# sha to the one you shipped.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Exact match, so it wins over the regex and prefix blocks below.
  location = /health {
    default_type application/json;
    add_header Cache-Control "no-store";
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 200 '{"status":"ok","build":"__BUILD_SHA__"}';
  }

  # Hashed build output. Long-lived and immutable; missing means missing.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # Anything that looks like a file: serve it or 404. Never the SPA shell.
  location ~* \.(?:js|mjs|cjs|css|map|json|xml|txt|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|wasm|pdf|zip)$ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # The shell itself must never be cached, or a deploy does not reach anyone.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Navigations only, by elimination: extensionless History-API routes.
  location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}
