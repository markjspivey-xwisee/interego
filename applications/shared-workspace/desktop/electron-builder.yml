# Packaging for the workspace desktop shell.
#
# ★ UNSIGNED ON EVERY PLATFORM, AND THAT IS STATED RATHER THAN LEFT TO BE DISCOVERED.
# `signAndEditExecutable: false`, `mac.identity: null` and `forceCodeSigning: false` below are
# deliberate: there is no code-signing certificate for this project, and notarisation (macOS)
# needs an Apple Developer account nobody here holds. Windows SmartScreen will warn on first run
# of the .exe and macOS Gatekeeper will refuse to open the .app, and BOTH warnings are CORRECT —
# the binaries genuinely are not signed by anybody either OS recognises. Signing and
# notarisation are out of scope; see README.md.
#
# ★ AND ONLY THE WINDOWS TARGETS HAVE EVER BEEN BUILT. See the `mac:` block: that configuration
# is untested, on purpose stated rather than quietly implied by its presence in this file.
#
# ★ WHAT IS PACKED, AND WHY IT IS ONLY THE BUILT OUTPUT.
# `src/` is not shipped. The three entry points are bundled by esbuild (`npm run build`) into
# `dist/`, and `@interego/workspace-client` is bundled INTO them rather than resolved at runtime
# — which is why `files` names no node_modules for it. `ethers` is the exception: it is left
# external to the main-process bundle so the packaged app resolves the real, unmodified library
# for secp256k1 signing rather than a rewritten copy of it.

appId: com.interego.workspace
productName: Interego Workspace
copyright: MIT

# ★ PACKAGING NEVER PUBLISHES, AND THIS WAS A RED MASTER BEFORE IT WAS A COMMENT.
#
# electron-builder decides on its own to UPLOAD when it thinks it is in CI. `package.json` names
# a `repository`, so it infers a GitHub publisher; the moment a release actually existed on that
# repo, every packaging run started ending with:
#
#   • artifacts will be published if draft release exists  reason=CI detected
#   ⨯ GitHub Personal Access Token is not set, neither programmatically, nor using env "GH_TOKEN"
#
# Note what that means for a gate: the job PASSED on the pull request and FAILED on master, from
# the same commit, because between the two the `desktop-0.1.0` release came into being. The
# packaging workflow's question is "does this build" and nothing more — publishing is a
# deliberate act performed by hand with `gh release create`, against artifacts somebody has
# actually launched. `--publish never` on all three `package*` scripts is what keeps those two
# things separate, and it is on the scripts rather than only in the workflow so that a packaging
# run on ANY CI machine behaves the way a local one does.

# ★ PINNED BECAUSE THIS IS AN npm WORKSPACE. electron-builder derives the runtime version by
# looking for `electron` in the package's OWN node_modules; in a workspace it is hoisted to the
# repo root, so it finds nothing and refuses with "Cannot compute electron version from
# installed node modules" — the devDependency range `^33.0.0` is not a version it will guess
# from. This is the version actually installed at the root; `npm run package` fails loudly if
# they diverge rather than packaging against a runtime nobody tested.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# Built by `npm run build` before this runs — see the `package` script.
files:
  - dist/**/*
  # ★ THE LIVE DRIVERS ARE DEV TOOLS AND ARE NOT SHIPPED. `tools/drive-*.ts` bundles into `dist/`
  # so that `__dirname/../index.html` resolves to the real shipping page — that is the whole point
  # of them, they drive the app as it is built. But a tool whose job is to read a private key out
  # of a named file has no business inside an installer handed to somebody, so it is excluded here
  # rather than built somewhere the app it drives cannot be found.
  - '!dist/drive-*.js'
  - index.html
  - package.json
  - node_modules/ethers/**/*
  - node_modules/@noble/**/*
  - node_modules/@adraffy/**/*
  - node_modules/aes-js/**/*
  - node_modules/tslib/**/*
  - node_modules/ws/**/*

# electron-builder rebuilds native deps by default. There are none here — `safeStorage` is
# Electron's own, `ethers` is pure JS — so the step is skipped rather than left to fail on a
# machine without a C++ toolchain.
npmRebuild: false
buildDependenciesFromSource: false

win:
  # Portable ZIP plus an NSIS installer. The ZIP is the one to hand somebody who just wants to
  # run it: no installer, no registry, unzip and double-click.
  target:
    - target: zip
      arch: [x64]
    - target: nsis
      arch: [x64]
  # No certificate exists, so signing is not attempted. Left to default, electron-builder emits
  # a confusing "cannot find certificate" warning that reads like a misconfiguration.
  signAndEditExecutable: false

# ★ macOS: CONFIGURED, AND NEVER BUILT OR RUN BY ANYONE HERE.
#
# This section was written on Windows and there is no macOS machine in this project. A `.dmg`
# cannot be produced off a Mac at all — electron-builder's dmg target shells out to macOS-only
# tooling — and even a `--mac zip` produced by cross-packing has never been unzipped, launched,
# or had its `safeStorage` path exercised on a real Mac. Treat everything below as an untested
# configuration, because that is what it is. The one thing that IS known is what will happen on
# first launch: the app is unsigned and unnotarised, so Gatekeeper will refuse to open it and
# say the developer cannot be verified. That warning is CORRECT — see README.md.
mac:
  target:
    # zip first: it is the one a cross-build could conceivably emit, and the one a user can
    # unzip and right-click-Open past Gatekeeper without an installer in the way.
    - target: zip
      arch: [x64, arm64]
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  # `null` is electron-builder's explicit "do not sign", distinct from omitting the key — which
  # makes it hunt the keychain for an identity, find none, and fail the build on a machine that
  # has Xcode installed. There is no certificate for this project; saying so is not a TODO.
  identity: null
  # Notarisation needs an Apple Developer account nobody here holds. Out of scope, stated.
  notarize: false
  # Electron 20+ refuses to launch an unsigned .app without an entitlements-bearing hardened
  # runtime OR ad-hoc signing. Ad-hoc is what an unsigned build gets; hardenedRuntime would
  # require entitlements this app has not been tested against, so it stays off deliberately
  # rather than being switched on because it sounds safer.
  hardenedRuntime: false

# ★ Linux: AppImage + deb, x64. Buildable here; see README.md for what actually happened.
linux:
  target:
    # AppImage is the portable one — download, chmod +x, run, no package manager, no root.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  # Named so the two Linux artifacts do not collide in `release/` with each other or with the
  # Windows ZIP, which shares the ${productName}-${version} stem.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # ★ REQUIRED BY `deb`, AND ITS ABSENCE IS A HARD BUILD FAILURE RATHER THAN A WARNING.
  # Debian packages must name a maintainer; electron-builder derives one from the package's
  # `author` field and refuses the build when that field carries no email — which is what it
  # did here on the first attempt, alongside a demand for `homepage` (now in package.json).
  # The address is the project's existing published contact, not a new one invented for this.
  maintainer: Mark Spivey <security@interego.dev>
  # The app is a plain Electron shell with no privileged helper; the sandbox setuid helper is
  # the usual source of "SUID sandbox helper is not configured correctly" on distros with
  # unprivileged user namespaces restricted. Left at electron-builder's default rather than
  # disabled, because disabling the sandbox to silence a warning weakens the renderer boundary
  # this app relies on to keep the wallet key out of the page.

forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Per-user install, so no elevation prompt — the app writes only to its own userData
  # directory, where the OS-encrypted wallet key lives.
  artifactName: ${productName}-${version}-setup.${ext}

deb:
  # Electron's own runtime dependencies. Without them the package installs and the binary dies
  # at startup with a bare "error while loading shared libraries", which reads like a corrupt
  # download rather than a missing dependency.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    # ★ NOT boilerplate. `safeStorage` — which is where the wallet key lives — is backed by
    # libsecret on Linux. Omit it and the app starts, looks healthy, and cannot persist or
    # read back a key, which surfaces as "sign in again every launch" rather than as an error.
    - libsecret-1-0
