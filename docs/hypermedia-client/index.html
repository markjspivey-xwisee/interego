  const target = c.template || c.target || "(none)";
  let html = `<div class="crumbs">${esc(shortRel(c.rel))}</div>
    <h2 class="detail-title">${esc(c.title)}</h2>
    <div class="meta">${esc(c.description)}</div>
    <div class="meta"><span class="badge ${methodClass(c.method)}">${esc(c.method)}</span>
      <span class="badge ${transport}">${transport}</span>
      ${c.mediaType ? " · " + esc(c.mediaType) : ""}<br>
      <code class="code-sm">${esc(c.rel)}</code><br>
      target: ${iriSpan(c.target, target)}
    </div>`;
  if (c.unsafe) html += `<div class="warn">Unsafe operation. The default is a dry run that shows the exact request. Confirm before anything is sent.</div>`;
  if (c.warning) html += `<div class="warn">${esc(c.warning)}</div>`;

    <div class="actions">
      ${c.unsafe ? `<button type="submit" class="secondary" data-mode="dry">Dry run</button>
        <label class="confirm"><input type="checkbox" id="confirmUnsafe"> I confirm this write</label>
        <button type="submit" class="danger" data-mode="live" disabled id="liveBtn">Invoke</button>`

function readForm() {

function showResult(html) {

// A form invokes only the control it was built for, and only while it is the

async function runInvoke(forceDry, formControl, linkProblems) {
  const desc = state.descriptor;
  const control = state.selected;
  if (!desc || !control) return;
  if (state.formFor !== control || (formControl && formControl !== control)) {
    setStatus("Nothing was sent: the form on screen is not the selected control's.");
    return;
  }
  const checked = validateFields(control, readForm());
  const errors = (linkProblems || []).concat(checked.errors);
  if (errors.length) {
    showResult(`<div class="warn">Validation failed:<ul>${errors.map(e => "<li>" + esc(e) + "</li>").join("")}</ul></div>`);
    return;
  }

    const msg = String(err && err.message || err);
    showResult(`<div class="warn">${esc("The request could not be built, so nothing was sent: " + msg)}</div>`);
    setStatus("Invoke failed: " + msg);
    return;
  }
  const dry = forceDry || (control.unsafe && !(document.getElementById("confirmUnsafe") && document.getElementById("confirmUnsafe").checked));

    method: plan.method, transport: plan.transport, url: plan.url, headers: plan.headers,
    body: plan.body, notes: plan.notes, mcp: plan.mcp, dryRun: dry
  }, null, 2))}</pre></details>`;
  if (dry) {
    showResult(html + `<div class="warn">Dry run — nothing was sent.</div>`);
    return;
  }
  if (plan.transport === "unknown" && plan.url) {
    showResult(html + `<div class="warn">${esc("This page sends requests over https only; nothing was sent to " + plan.url)}</div>`);
    return;
  }
  if (plan.transport !== "http" || !plan.url) {
    showResult(html + `<div class="warn">No plain-HTTP transport. Use the Interego relay MCP <code>invoke_affordance</code> / <code>act</code> call shown above.</div>`);
    return;
  }
  // The host the form named next to its buttons is the host the request goes to, or nothing is sent.
  const shown = destinationHost(control);
  let host = null;
  try { host = new URL(plan.url).host; } catch {}
  if (shown && host !== shown) {
    showResult(html + `<div class="warn">${esc("The address goes to " + (host || plan.url) + ", not to " + shown + ", the host this form names; nothing was sent.")}</div>`);
    return;
  }
  setStatus("Invoking " + shortRel(control.rel) + " …");
  try {
    const init = { method: plan.method, headers: plan.headers };
    if (!SAFE.has(plan.method) && plan.bodyText != null) init.body = plan.bodyText;
    const res = await fetch(viaProxy(plan.url), init);
    const text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch {}
    state.lastResponse = { status: res.status, contentType: res.headers.get("content-type") || "", text, parsed, url: plan.url };
    html += `<h3 class="resp-title">Response HTTP ${esc(res.status)} · ${esc(state.lastResponse.contentType)}</h3>` + renderBody(state.lastResponse.contentType, text, parsed);
    showResult(html);
    setStatus("HTTP " + res.status + " from " + plan.url);
    document.title = "Hypermedia Client — " + desc.title;
    document.documentElement.dataset.ready = "1";
  } catch (err) {
    const msg = String(err && err.message || err);
    const hint = /Failed to fetch|NetworkError|CORS/i.test(msg) ? " The browser refused this request. The host may not allow cross-origin calls; a CORS proxy you run yourself can go in the proxy field." : "";

}
async function loadDescriptorUrl(url, push = true) {
  setStatus("Fetching authority document…");
  document.documentElement.dataset.ready = "0";
  const fetched = await fetchAuthority(url);
  if (fetched.kind === "turtle") throw new Error("Descriptor arrived as Turtle, which this page does not parse. Ask the host for ?format=jsonld, or use hmc.py, which reads Turtle when rdflib is installed.");
  const descriptor = parseDescriptor(fetched.text, fetched.contentType, stripFrag(url), fetched.finalUrl);
  if (push && state.descriptor) state.history.push(state.descriptor.url);
  state.descriptor = descriptor;
  state.selected = null;
  state.lastResponse = null;
  document.getElementById("url").value = descriptor.url;
  document.getElementById("backBtn").disabled = state.history.length === 0;
  document.title = "Hypermedia Client — " + descriptor.title;
  renderDetail();
  renderList();
  setStatus(`Loaded ${descriptor.controls.length} controls from ${descriptor.title} (${fetched.kind}).`);
  document.documentElement.dataset.ready = state.selected ? "0" : "list";
  return descriptor;
}
// Selects a control and fills its form with an ?invoke= link's values. Returns
// what the form could not take: a name no input has. A field named twice is a
// list for a list field, and its last value for any other field.
function selectRel(rel, values) {
  const control = findControl(state.descriptor, rel);
  if (!control) return [];
  state.selected = control;
  renderDetail();
  renderList();
  const problems = [];
  if (values) {
    const inputs = [...document.querySelectorAll("#invokeForm [data-field]")];
    for (const [name, given] of Object.entries(values)) {
      const el = inputs.find(e => e.dataset.field === name);
      const field = control.fields.find(f => f.name === name);
      if (!el || !field) { problems.push("no input field is named '" + name + "'"); continue; }
      const list = asList(given);
      if (el.multiple) { for (const o of el.options) o.selected = list.includes(o.value); }
      else if (field.multi) el.value = list.join("\n");
      else el.value = list[list.length - 1];
    }
  }

}
// The page does not run inside another page's frame: a page that framed it

function framed() {
  try { return window.top !== window.self; } catch { return true; }
}
function refuseFramed() {
  for (const id of ["url", "loadBtn", "backBtn", "proxy"]) document.getElementById(id).disabled = true;
  setStatus("This page does not run inside another page. Open it in a tab of its own.");
}
function start() {
  document.getElementById("loadBtn").addEventListener("click", async () => {
    const url = document.getElementById("url").value.trim();
    if (!url) return;
    try { await loadDescriptorUrl(url); } catch (err) {
      setStatus(String(err.message || err));
      document.getElementById("list").innerHTML = `<div class="warn">${esc(err.message || err)}</div>`;
    }
  });
  document.getElementById("url").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") document.getElementById("loadBtn").click();
  });
  document.getElementById("backBtn").addEventListener("click", async () => {
    const prev = state.history.pop();
    document.getElementById("backBtn").disabled = state.history.length === 0;
    if (prev) {
      try { await loadDescriptorUrl(prev, false); } catch (err) { setStatus(String(err.message || err)); }
    }
  });
  document.body.addEventListener("click", async (ev) => {
    const card = ev.target.closest(".card");
    if (card && card.dataset.rel) { selectRel(card.dataset.rel); return; }
    const iriEl = ev.target.closest("[data-iri]");
    if (iriEl && iriEl.dataset.iri) {
      const iri = iriEl.dataset.iri;
      if (!/^https:\/\//.test(iri)) return;
      try { await loadDescriptorUrl(iri); } catch (err) { setStatus("Follow failed: " + (err.message || err)); }
    }
  });

async function boot() {

  }
  if (params.get("url") || params.get("autoload") === "1") {
    try {
      await loadDescriptorUrl(document.getElementById("url").value);
      if (params.get("invoke")) {
        // A field named twice in the link is a list of values.
        const fields = Object.create(null);
        const put = (name, v) => { fields[name] = own(fields, name) ? asList(fields[name]).concat([v]) : v; };
        if (params.get("query")) put("query", params.get("query"));
        for (const [k, v] of params.entries()) if (k.startsWith("field.")) put(k.slice(6), v);

if (framed()) refuseFramed(); else start();
