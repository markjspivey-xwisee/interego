<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hypermedia Client</title>
  <style>
    :root {
      --ink: #1b1814;
      --muted: #5c564c;
      --paper: #f3eee4;
      --panel: #fffdf8;
      --rule: #d7cfc0;
      --safe: #1f5b3b;
      --safe-bg: #e5f0e8;
      --unsafe: #8a3510;
      --unsafe-bg: #f6e6dc;
      --accent: #243f6b;
      --accent-2: #c46a1b;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
      --sans: "Avenir Next", "Segoe UI", Helvetica, sans-serif;
      --serif: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
    body { display: flex; flex-direction: column; }
    header {
      padding: 16px 22px 14px;
      border-bottom: 1px solid var(--rule);
      background: linear-gradient(#fffaf1, var(--paper));
    }
    header h1 { font: 600 22px/1.15 var(--serif); margin: 0 0 4px; letter-spacing: -0.02em; }
    header p { margin: 0 0 12px; color: var(--muted); max-width: 72em; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type="text"], input[type="search"], input[type="number"], textarea, select {
      font: 13px var(--mono); border: 1px solid var(--rule); background: var(--panel);
      color: var(--ink); border-radius: 6px; padding: 8px 10px;
    }
    #url { flex: 1 1 420px; }
    #proxy { flex: 0 1 260px; }
    button, .btn {
      font: 600 13px var(--sans); border: 1px solid var(--ink); background: var(--ink);
      color: #fffaf1; border-radius: 6px; padding: 8px 12px; cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); }
    button.danger { background: var(--unsafe); border-color: var(--unsafe); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 38%) 1fr; }
    aside, section { min-height: 0; overflow: auto; }
    aside { border-right: 1px solid var(--rule); padding: 12px 14px 28px; }
    section { padding: 12px 18px 32px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .meta strong { color: var(--ink); font-weight: 650; }
    .group h2 { font: 650 13px var(--sans); text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 8px; }
    .card {
      background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
      padding: 9px 10px; margin: 0 0 8px; cursor: pointer;
    }
    .card:hover { border-color: #b7ad9c; }
    .card.active { outline: 2px solid var(--accent); }
    .card .row { display: flex; gap: 8px; align-items: baseline; }
    .badge { font: 700 10px var(--mono); padding: 2px 6px; border-radius: 999px; letter-spacing: .04em; }
    .badge.get { background: var(--safe-bg); color: var(--safe); }
    .badge.post, .badge.put, .badge.patch, .badge.delete { background: var(--unsafe-bg); color: var(--unsafe); }
    .badge.http { background: #e7eef8; color: var(--accent); }
    .badge.mcp { background: #f3e7d4; color: #7a4a10; }
    .card h3 { margin: 4px 0 2px; font: 650 14px/1.3 var(--serif); }
    .card code { font: 11px var(--mono); color: var(--muted); word-break: break-all; }
    .field { margin: 0 0 12px; }
    .field label { display: block; font-weight: 650; margin-bottom: 4px; }
    .field .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .field textarea { width: 100%; min-height: 88px; }
    .field input, .field select { width: 100%; }
    .req { color: var(--unsafe); }
    pre, .out { font: 12.5px/1.45 var(--mono); background: #1c1916; color: #f4efe6;
      padding: 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    table.sparql { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
    table.sparql th, table.sparql td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
    table.sparql th { background: #efe8db; }
    a { color: var(--accent); }
    .iri { color: #9ad0ff; text-decoration: underline; cursor: pointer; }
    .status { font: 12px var(--mono); color: var(--muted); margin-top: 8px; }
    .warn { background: var(--unsafe-bg); color: var(--unsafe); padding: 8px 10px; border-radius: 6px; margin: 0 0 12px; }
    .ok { background: var(--safe-bg); color: var(--safe); padding: 8px 10px; border-radius: 6px; margin: 0 0 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; align-items: center; }
    .see { font-size: 12px; }
    .see button { font: 12px var(--mono); background: transparent; color: var(--accent);
      border: 0; padding: 0 6px 0 0; text-decoration: underline; }
    md-block h1, md-block h2, md-block h3 { font-family: var(--serif); }
    .crumbs { font: 12px var(--mono); color: var(--muted); margin: 0 0 8px; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Hypermedia Client</h1>
    <p>A generic follower of Interego, HyperMarkdown, and Hydra descriptors. Paste any authority URL — controls, forms, and live <code>hydra:target</code> values come from the document, not from a hard-coded catalog.</p>
    <div class="bar">
      <input id="url" type="url" spellcheck="false" placeholder="https://example.org/descriptor">
      <button id="loadBtn" type="button">Load</button>
      <button id="backBtn" class="secondary" type="button" disabled>Back</button>
      <input id="proxy" type="text" spellcheck="false" placeholder="CORS proxy (optional)">
    </div>
    <div id="status" class="status">Idle.</div>
  </header>
  <main>
    <aside>
      <div id="meta" class="meta"></div>
      <div id="list"><div class="empty">Load a descriptor to see its controls.</div></div>
    </aside>
    <section>
      <div id="detail"><div class="empty">Select a control.</div></div>
    </section>
  </main>
  <script>

const HYDRA = "http://www.w3.org/ns/hydra/core#";
const SHACL = "http://www.w3.org/ns/shacl#";
const IEP = "https://markjspivey-xwisee.github.io/interego/ns/iep#";
const IEH = "https://markjspivey-xwisee.github.io/interego/ns/harness#";
const HMD = "https://relay.interego.xwisee.com/ns/maintainer/hmd#";
const DCT = "http://purl.org/dc/terms/";
const RDFS = "http://www.w3.org/2000/01/rdf-schema#";
const RDF = "http://www.w3.org/1999/02/22-rdf-syntax-ns#";
const DCAT = "http://www.w3.org/ns/dcat#";
const XSD = "http://www.w3.org/2001/XMLSchema#";
const P = {
  type: RDF + "type", action: IEP + "action", affordance: IEP + "affordance",
  readOnly: IEP + "readOnlyHint", idempotent: IEP + "idempotentHint",
  destructive: IEP + "destructiveHint", method: HYDRA + "method",
  target: HYDRA + "target", expects: HYDRA + "expects", returns: HYDRA + "returns",
  returnsCT: HYDRA + "returnsContentType", title: HYDRA + "title",
  desc: HYDRA + "description", template: HYDRA + "template",
  mapping: HYDRA + "mapping", variable: HYDRA + "variable",
  property: HYDRA + "property", required: HYDRA + "required",
  search: HYDRA + "search", supOp: HYDRA + "supportedOperation",
  supClass: HYDRA + "supportedClass", media: DCAT + "mediaType",
  label: RDFS + "label", comment: RDFS + "comment", seeAlso: RDFS + "seeAlso",
  dcTitle: DCT + "title", dcDesc: DCT + "description", rel: HMD + "rel",
  control: HMD + "control", hmdTarget: HMD + "target",
  shProp: SHACL + "property", shPath: SHACL + "path", shName: SHACL + "name",
  shDt: SHACL + "datatype", shMin: SHACL + "minCount", shMax: SHACL + "maxCount",
  shPat: SHACL + "pattern", shDef: SHACL + "defaultValue",
  shMaxLen: SHACL + "maxLength", shMinLen: SHACL + "minLength",
  shDesc: SHACL + "description", shIn: SHACL + "in",
  shMinI: SHACL + "minInclusive", shMaxI: SHACL + "maxInclusive",
  shNode: SHACL + "node", shNodeKind: SHACL + "nodeKind",
  first: RDF + "first", rest: RDF + "rest", nil: RDF + "nil"
};
const PREFIXES0 = { hydra: HYDRA, sh: SHACL, iep: IEP, ieh: IEH, hmd: HMD, dct: DCT, rdfs: RDFS, rdf: RDF, dcat: DCAT, xsd: XSD, schema: "https://schema.org/" };
const TERMS0 = {
  action: P.action, affordance: P.affordance, affordances: P.affordance,
  method: P.method, target: P.target, expects: P.expects, returns: P.returns,
  mediaType: P.returnsCT, title: P.title, description: P.desc, rel: P.rel,
  control: P.control, template: P.template, mapping: P.mapping, variable: P.variable,
  property: P.property, required: P.required, search: P.search,
  supportedOperation: P.supOp, supportedClass: P.supClass,
  readOnlyHint: P.readOnly, idempotentHint: P.idempotent,
  destructiveHint: P.destructive, label: P.label, comment: P.comment, seeAlso: P.seeAlso
};
const SAFE = new Set(["GET", "HEAD", "OPTIONS"]);

function asList(v) { return v == null ? [] : (Array.isArray(v) ? v : [v]); }
function rawId(v) {
  if (v && typeof v === "object") {
    if (v["@id"] != null) return v["@id"];
    if (v["@value"] != null) return v["@value"];
  }
  return v;
}
function literals(v) { return asList(v).map(rawId).filter(x => x != null); }
function literal(v) { const xs = literals(v); return xs.length ? xs[0] : null; }
function localName(iri) {
  if (!iri) return "";
  const t = String(iri).replace(/\/$/, "");
  if (t.includes("#")) return t.split("#").pop();
  if (t.includes(":") && !t.startsWith("http")) return t.split(":").pop();
  return t.split("/").pop();
}
function shortRel(iri) { return localName(iri) || iri || ""; }
function truthy(v) {
  if (v == null) return null;
  if (typeof v === "boolean") return v;
  const t = String(v).toLowerCase();
  if (["true", "1", "yes"].includes(t)) return true;
  if (["false", "0", "no"].includes(t)) return false;
  return null;
}
function inty(v) { if (v == null || v === "") return null; const n = Number(v); return Number.isFinite(n) ? n : null; }

class Ctx {
  constructor() { this.prefixes = { ...PREFIXES0 }; this.terms = { ...TERMS0 }; }
  absorb(ctx) {
    for (const item of asList(ctx)) {
      if (!item || typeof item !== "object") continue;
      for (const [key, val] of Object.entries(item)) {
        if (key.startsWith("@")) continue;
        const iri = typeof val === "string" ? val : (val && val["@id"]);
        if (!iri) continue;
        const exp = this.expand(iri);
        this.terms[key] = exp;
        if (exp.endsWith("#") || exp.endsWith("/")) this.prefixes[key] = exp;
      }
    }
  }
  expand(value) {
    if (value == null) return "";
    const text = String(value);
    if (/^(_:|http:\/\/|https:\/\/|urn:|@)/.test(text)) return text;
    if (text.includes(":") && !text.startsWith("{")) {
      const [prefix, local] = text.split(":", 2);
      if (this.prefixes[prefix] && !local.startsWith("//")) return this.prefixes[prefix] + local;
    }
    return this.terms[text] || this.prefixes[text] || text;
  }
  expandKey(key) {
    if (key.startsWith("@") || key.startsWith("http://") || key.startsWith("https://")) return key;
    return this.terms[key] || this.expand(key);
  }
}

class NodeIndex {
  constructor(document, base) {
    this.ctx = new Ctx();
    this.base = base;
    this.nodes = new Map();
    this.order = [];
    this.root = null;
    this._ingest(document);
  }
  _ingest(document) {
    if (Array.isArray(document)) {
      for (const item of document) if (item && typeof item === "object") { this.ctx.absorb(item["@context"]); this._add(item); }
      return;
    }
    if (!document || typeof document !== "object") return;
    this.ctx.absorb(document["@context"]);
    const extras = Object.fromEntries(Object.entries(document).filter(([k]) => k !== "@context" && k !== "@graph"));
    if (Object.keys(extras).length) {
      const root = { ...extras };
      if (!root["@id"]) root["@id"] = this.base;
      this.root = this._add(root);
    }
    if (Array.isArray(document["@graph"])) {
      for (const item of document["@graph"]) {
        if (item && typeof item === "object") {
          const node = this._add(item);
          if (!this.root) this.root = node;
        }
      }
    } else if (!this.root) {
      this.root = this._add(Object.keys(extras).length ? document : { "@id": this.base });
    }
    for (const node of [...this.order]) this._harvest(node);
  }
  _add(node) {
    let id = node["@id"];
    if (!id) {
      id = literal(this.get(node, P.action)) || node.action || `_:n${this.order.length}`;
      node = { ...node, "@id": id };
    }
    if (!this.nodes.has(id)) {
      this.nodes.set(id, node);
      this.order.push(node);
      return node;
    }
    const existing = this.nodes.get(id);
    for (const [k, v] of Object.entries(node)) if (!(k in existing)) existing[k] = v;
    return existing;
  }
  _harvest(node) {
    for (const [key, val] of Object.entries(node)) {
      const pred = this.ctx.expandKey(key);
      const lname = localName(pred);
      if (![P.affordance, P.control, P.supOp, P.supClass].includes(pred) &&
          !["affordance", "affordances", "control", "supportedOperation", "supportedClass"].includes(lname)) continue;
      for (const item of asList(val)) {
        if (item && typeof item === "object" && (item["@id"] || item.action || item.method || item["@type"])) {
          this._harvest(this._add(item));
        }
      }
    }
  }
  get(node, predicate) {
    if (!node) return null;
    if (predicate in node) return node[predicate];
    for (const [key, val] of Object.entries(node)) {
      if (!key.startsWith("@") && this.ctx.expandKey(key) === predicate) return val;
    }
    const want = localName(predicate);
    for (const [key, val] of Object.entries(node)) {
      if (key.startsWith("@") || key.startsWith("http://") || key.startsWith("https://") || key.includes(":")) continue;
      if (key === want) return val;
    }
    return null;
  }
  node(ident) {
    const iri = rawId(ident);
    if (iri == null) return null;
    if (this.nodes.has(String(iri))) return this.nodes.get(String(iri));
    if (ident && typeof ident === "object" && Object.keys(ident).some(k => k !== "@id")) return ident;
    return null;
  }
  typesOf(node) { return literals(this.get(node, P.type) || (node && node["@type"])).map(x => this.ctx.expand(x)); }
  rdfList(head) {
    const out = []; const seen = new Set();
    let current = rawId(head);
    while (current && current !== P.nil && !seen.has(String(current))) {
      seen.add(String(current));
      const node = this.node(current);
      if (!node) { out.push(current); break; }
      const first = this.get(node, P.first);
      if (first != null) out.push(...(literals(first).length ? literals(first) : [rawId(first)]));
      current = literal(this.get(node, P.rest));
    }
    return out;
  }
}

function fieldName(name, path, variable) {
  if (variable) return variable;
  const raw = name || localName(path) || "value";
  const m = raw.match(/^(?:rest-param-.+-)?(.+)$/);
  return m ? m[1] : raw;
}

function schemaTypes(prop) {
  return asList(prop && prop.type).map(t => String(t)).filter(t => t && t !== "null");
}
function schemaJsonKind(types) {
  const structured = types.filter(t => t === "object" || t === "array");
  const others = types.filter(t => t !== "object" && t !== "array");
  if (!structured.length || others.length) return null;
  if (structured.includes("object") && structured.includes("array")) return "json";
  return structured[0];
}
function schemaDatatype(types) {
  const typeMap = { string: XSD + "string", integer: XSD + "integer", number: XSD + "decimal", boolean: XSD + "boolean" };
  return types.length === 1 ? (typeMap[types[0]] || null) : null;
}
function shaclJsonKind(index, node, datatype, maxCount) {
  const dt = datatype || "";
  if (dt === RDF + "JSON" || dt.endsWith("#JSON")) return "json";
  if (dt) return null;
  const nested = index.get(node, P.shNode);
  const nodeKind = String(literal(index.get(node, P.shNodeKind)) || "");
  const blank = nodeKind === SHACL + "BlankNode" || nodeKind.endsWith("#BlankNode");
  if (nested != null || blank) return (maxCount || 0) > 1 ? "array" : "object";
  return null;
}

function shapeFields(index, shapeRef) {
  const fields = [];
  if (shapeRef && typeof shapeRef === "object" && shapeRef.properties && !(P.shProp in shapeRef)) {
    const required = new Set(asList(shapeRef.required || []));
    for (const [name, prop0] of Object.entries(shapeRef.properties || {})) {
      const prop = (prop0 && typeof prop0 === "object") ? prop0 : {};
      const types = schemaTypes(prop);
      const jsonKind = schemaJsonKind(types);
      fields.push({
        name, path: name, datatype: jsonKind ? null : (schemaDatatype(types) || XSD + "string"),
        jsonKind, minCount: required.has(name) ? 1 : 0, maxCount: 1, pattern: prop.pattern || null,
        defaultValue: prop.default, maxLength: inty(prop.maxLength), minLength: inty(prop.minLength),
        description: prop.description || "", enum: asList(prop.enum || []),
        minInclusive: prop.minimum, maxInclusive: prop.maximum, required: required.has(name), rawBody: false
      });
    }
    return fields;
  }
  const shape = index.node(shapeRef);
  if (!shape) return fields;
  const props = index.get(shape, P.shProp);
  if (!props) {
    if (index.get(shape, P.shDt) || index.get(shape, P.shMinLen) || index.get(shape, P.shMaxLen)) {
      const label = String(literal(index.get(shape, P.label)) || "");
      const name = /query|sparql/i.test(label) ? "query" : "body";
      fields.push({
        name, path: shape["@id"] || null, datatype: String(literal(index.get(shape, P.shDt)) || XSD + "string"),
        minCount: 1, maxCount: 1, required: true, rawBody: true, pattern: null, defaultValue: null,
        minLength: inty(literal(index.get(shape, P.shMinLen))), maxLength: inty(literal(index.get(shape, P.shMaxLen))),
        description: String(literal(index.get(shape, P.comment)) || literal(index.get(shape, P.shDesc)) || ""),
        enum: []
      });
    }
    return fields;
  }
  for (const pref of asList(props)) {
    const node = index.node(pref) || (pref && typeof pref === "object" ? pref : null);
    if (!node) continue;
    const path = String(literal(index.get(node, P.shPath)) || "");
    const name = literal(index.get(node, P.shName));
    let enumVals = [];
    const enumRaw = index.get(node, P.shIn);
    if (enumRaw != null) {
      const head = literal(enumRaw);
      enumVals = (typeof head === "string" && (head.startsWith("_:") || index.node(head))) ? index.rdfList(head) : literals(enumRaw);
    }
    const minCount = inty(literal(index.get(node, P.shMin)));
    const maxCount = inty(literal(index.get(node, P.shMax)));
    const datatype = String(literal(index.get(node, P.shDt)) || "") || null;
    fields.push({
      name: fieldName(name ? String(name) : null, path, null), path: path || null,
      datatype, jsonKind: shaclJsonKind(index, node, datatype, maxCount),
      minCount, maxCount,
      pattern: String(literal(index.get(node, P.shPat)) || "") || null,
      defaultValue: literal(index.get(node, P.shDef)),
      maxLength: inty(literal(index.get(node, P.shMaxLen))), minLength: inty(literal(index.get(node, P.shMinLen))),
      description: String(literal(index.get(node, P.shDesc)) || literal(index.get(node, P.comment)) || literal(index.get(node, P.desc)) || "") || "",

function templateOf(index, node) {
  const readT = (tmpl) => {
    if (!tmpl) return [null, []];
    const template = literal(index.get(tmpl, P.template));
    const mappings = [];
    for (const item of asList(index.get(tmpl, P.mapping))) {
      const mn = index.node(item) || (item && typeof item === "object" ? item : null);
      if (!mn) continue;
      mappings.push({
        variable: literal(index.get(mn, P.variable)),
        property: literal(index.get(mn, P.property)),
        required: truthy(literal(index.get(mn, P.required)))

    return [template ? String(template) : null, mappings];
  };

  if (typeof direct === "string" && direct.includes("{")) {
    const [, mappings] = readT(node);
    return [direct, mappings];

  for (const [key, val] of Object.entries(node)) {
    if (key.startsWith("@")) continue;
    const pred = index.ctx.expandKey(key);
    if (![P.template, P.search].includes(pred) && !localName(pred).toLowerCase().includes("template")) continue;
    for (const item of asList(val)) {
      const [template, mappings] = readT(index.node(item) || (item && typeof item === "object" ? item : null));
      if (template) return [template, mappings];
    }
  }
  return [direct ? String(direct) : null, []];
}

function mergeMappings(fields, mappings) {
  for (const mapping of mappings) {
    const variable = mapping.variable;
    if (!variable) continue;
    let match = fields.find(f => f.path === mapping.property) || fields.find(f => f.name === variable) ||
      fields.find(f => f.path && localName(f.path) === variable);
    if (match) {
      match.variable = variable; match.name = variable;
      if (mapping.required) { match.required = true; if (!match.minCount) match.minCount = 1; }
    } else {
      fields.push({ name: variable, path: mapping.property || null, variable, required: !!mapping.required,
        minCount: mapping.required ? 1 : 0, maxCount: 1, datatype: null, description: "", enum: [], rawBody: false });
    }
  }
  return fields;
}

function looksLikeOp(index, node) {
  const types = new Set(index.typesOf(node));
  if ([HYDRA + "IriTemplate", HYDRA + "IriTemplateMapping", SHACL + "NodeShape", SHACL + "PropertyShape"].some(t => types.has(t))) return false;

    block = block.replace(/https?:\/\/[^\s<]+/g, (url) => `<span class="iri" data-iri="${url}">${url}</span>`);
    block = block.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    block = block.replace(/^(?:- |\* )(.+)$/gm, "<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>");
    block = block.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>");
    html += "<p>" + block + "</p>";
  });
  return html;
}
function renderBody(contentType, text, parsed) {
  const ct = (contentType || "").toLowerCase();
  if (parsed && parsed.head && parsed.results && Array.isArray(parsed.results.bindings)) {
    const vars = parsed.head.vars || Object.keys(parsed.results.bindings[0] || {});
    let html = `<div class="ok">SPARQL result: ${parsed.results.bindings.length} row(s)</div><table class="sparql"><thead><tr>`;
    html += vars.map(v => "<th>" + esc(v) + "</th>").join("") + "</tr></thead><tbody>";
    for (const row of parsed.results.bindings) {
      html += "<tr>" + vars.map(v => {
        const cell = row[v];
        const val = cell ? (cell.value || "") : "";
        return "<td>" + (String(val).startsWith("http") ? `<span class="iri" data-iri="${esc(val)}">${esc(val)}</span>` : esc(val)) + "</td>";
      }).join("") + "</tr>";
    }
    return html + "</tbody></table>";
  }
  if (parsed && (ct.includes("json") || typeof parsed === "object")) {
    return "<pre>" + linkify(JSON.stringify(parsed, null, 2)) + "</pre>";
  }
  if (ct.includes("html")) {
    return `<div class="ok">HTML response. <span class="iri" data-iri="${esc(state.lastResponse && state.lastResponse.url)}">${esc(state.lastResponse && state.lastResponse.url)}</span></div><iframe sandbox srcdoc="${esc(text).slice(0, 20000)}" style="width:100%;min-height:280px;border:1px solid var(--rule);border-radius:8px;background:#fff"></iframe>`;
  }
  if (ct.includes("markdown") || /^\s*# /m.test(text || "")) return `<div class="md">${renderMarkdown(text)}</div>`;
  return "<pre>" + linkify(text || "") + "</pre>";
}
function renderList() {
  const desc = state.descriptor;
  const meta = document.getElementById("meta");
  const list = document.getElementById("list");
  if (!desc) { meta.innerHTML = ""; list.innerHTML = `<div class="empty">Load a descriptor to see its controls.</div>`; return; }
  meta.innerHTML = `<strong>${esc(desc.title)}</strong><br>${esc(desc.url)}<br>types: ${esc((desc.types || []).map(localName).join(", "))}<br>${esc((desc.controls || []).length)} controls · ${esc((desc.contentType || "").split(";")[0])}` +
    (desc.seeAlso && desc.seeAlso.length ? `<div class="see">seeAlso: ${desc.seeAlso.map(u => `<button type="button" data-iri="${esc(u)}">${esc(localName(u) || u)}</button>`).join(" ")}</div>` : "") +
    (desc.description ? `<div style="margin-top:6px">${esc(desc.description)}</div>` : "");
  const safe = desc.controls.filter(c => !c.unsafe);
  const unsafe = desc.controls.filter(c => c.unsafe);
  const card = (c) => {
    const transport = classifyTransport(c, desc.url);
    const active = state.selected && state.selected.rel === c.rel ? " active" : "";
    return `<article class="card${active}" data-rel="${esc(c.rel)}">
      <div class="row"><span class="badge ${esc(c.method.toLowerCase())}">${esc(c.method)}</span>
      <span class="badge ${transport}">${transport}</span></div>
      <h3>${esc(c.title)}</h3>
      <code>${esc(shortRel(c.rel))}</code>
    </article>`;
  };
  list.innerHTML = `<div class="group"><h2>Safe reads (${safe.length})</h2>${safe.map(card).join("") || '<div class="empty">(none)</div>'}</div>
    <div class="group"><h2>Unsafe writes (${unsafe.length})</h2>${unsafe.map(card).join("") || '<div class="empty">(none)</div>'}</div>`;
}
function fieldDefaultText(field) {
  if (field.defaultValue == null) return "";
  return typeof field.defaultValue === "object" ? JSON.stringify(field.defaultValue) : String(field.defaultValue);
}
function fieldControl(field) {
  const req = field.required || (field.minCount || 0) >= 1;
  const val = esc(fieldDefaultText(field));
  let input;
  if (field.enum && field.enum.length && !field.jsonKind) {
    input = `<select name="${esc(field.name)}"><option value=""></option>${field.enum.map(v => `<option ${String(v) === String(field.defaultValue) ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  } else if (field.rawBody || field.jsonKind || (field.maxLength && field.maxLength > 200) || /content|query|sparql|turtle|body/i.test(field.name + (field.description || ""))) {
    input = `<textarea name="${esc(field.name)}" ${req ? "required" : ""}>${val}</textarea>`;
  } else {
    const type = (field.datatype || "").endsWith("#integer") ? "number" : "text";
    input = `<input name="${esc(field.name)}" type="${type}" value="${val}" ${req ? "required" : ""} ${field.pattern ? `pattern="${esc(field.pattern)}"` : ""}>`;
  }
  return `<div class="field"><label>${esc(field.name)} ${req ? '<span class="req">*</span>' : ""}</label>${input}
    <div class="hint">${esc([field.jsonKind ? ("JSON " + field.jsonKind) : (field.datatype && localName(field.datatype)), field.pattern, field.description].filter(Boolean).join(" · "))}</div></div>`;
}
function renderDetail() {
  const el = document.getElementById("detail");
  const desc = state.descriptor;
  const c = state.selected;
  if (!c || !desc) { el.innerHTML = `<div class="empty">Select a control.</div>`; return; }
  const transport = classifyTransport(c, desc.url);
  const target = c.template || c.target || "(none)";
  let html = `<div class="crumbs">${esc(shortRel(c.rel))}</div>
    <h2 style="font-family:var(--serif);margin:0 0 8px">${esc(c.title)}</h2>
    <div class="meta">${esc(c.description)}</div>
    <div class="meta"><span class="badge ${esc(c.method.toLowerCase())}">${esc(c.method)}</span>
      <span class="badge ${transport}">${transport}</span>
      ${c.mediaType ? " · " + esc(c.mediaType) : ""}<br>
      <code style="font-size:12px">${esc(c.rel)}</code><br>
      target: <span class="iri" data-iri="${esc(/^https?:/.test(String(c.target||"")) ? c.target : "")}">${esc(target)}</span>
    </div>`;
  if (c.unsafe) html += `<div class="warn">Unsafe operation. The default is a dry run that shows the exact request. Confirm before anything is sent.</div>`;
  html += `<form id="invokeForm">${c.fields.map(fieldControl).join("") || '<div class="empty">No input fields.</div>'}
    <div class="actions">
      ${c.unsafe ? `<button type="submit" class="secondary" data-mode="dry">Dry run</button>
        <label style="font-size:13px"><input type="checkbox" id="confirmUnsafe"> I confirm this write</label>
        <button type="submit" class="danger" data-mode="live" disabled id="liveBtn">Invoke</button>`
        : `<button type="submit" data-mode="live">Invoke</button><button type="submit" class="secondary" data-mode="dry">Dry run</button>`}
    </div>
  </form>
  <div id="result"></div>`;
  el.innerHTML = html;
  const form = document.getElementById("invokeForm");
  const box = document.getElementById("confirmUnsafe");
  const liveBtn = document.getElementById("liveBtn");
  if (box && liveBtn) box.addEventListener("change", () => { liveBtn.disabled = !box.checked; });
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const mode = ev.submitter && ev.submitter.dataset.mode ? ev.submitter.dataset.mode : "dry";
    runInvoke(mode === "dry");
  });
}
function readForm() {
  const form = document.getElementById("invokeForm");
  const supplied = {};
  if (!form) return supplied;
  for (const el of form.querySelectorAll("input, textarea, select")) {
    if (!el.name || el.type === "checkbox") continue;
    supplied[el.name] = el.value;
  }
  return supplied;
}
function showResult(html) {
  const box = document.getElementById("result");
  if (box) box.innerHTML = html;
}
async function runInvoke(forceDry) {
  const desc = state.descriptor;
  const control = state.selected;
  if (!desc || !control) return;
  const { values, errors } = validateFields(control, readForm());
  if (errors.length) {
    showResult(`<div class="warn">Validation failed:<ul>${errors.map(e => "<li>" + esc(e) + "</li>").join("")}</ul></div>`);
    return;
  }
  const plan = resolvePlan(control, values, desc.url);
  const dry = forceDry || (control.unsafe && !(document.getElementById("confirmUnsafe") && document.getElementById("confirmUnsafe").checked));
  let html = `<details ${dry ? "open" : ""}><summary style="cursor:pointer;font-weight:650;margin:8px 0">Request (${esc(plan.method)} ${esc(plan.transport)})</summary><pre>${linkify(JSON.stringify({
    method: plan.method, transport: plan.transport, url: plan.url, headers: plan.headers,
    body: plan.body, notes: plan.notes, mcp: plan.mcp, dryRun: dry
  }, null, 2))}</pre></details>`;
  if (dry) {
    showResult(html + `<div class="warn">Dry run — nothing was sent.</div>`);
    return;
  }
  if (plan.transport !== "http" || !plan.url) {
    showResult(html + `<div class="warn">No plain-HTTP transport. Use the Interego relay MCP <code>invoke_affordance</code> / <code>act</code> call shown above.</div>`);
    return;
  }
  setStatus("Invoking " + shortRel(control.rel) + " …");
  try {
    const init = { method: plan.method, headers: plan.headers };
    if (!SAFE.has(plan.method) && plan.bodyText != null) init.body = plan.bodyText;
    const res = await fetch(viaProxy(plan.url), init);
    const text = await res.text();
    let parsed = null;
    try { parsed = JSON.parse(text); } catch {}
    state.lastResponse = { status: res.status, contentType: res.headers.get("content-type") || "", text, parsed, url: plan.url };
    html += `<h3 style="font-family:var(--serif)">Response HTTP ${res.status} · ${esc(state.lastResponse.contentType)}</h3>` + renderBody(state.lastResponse.contentType, text, parsed);
    showResult(html);
    setStatus("HTTP " + res.status + " from " + plan.url);
    document.title = "Hypermedia Client — " + desc.title;
    document.documentElement.dataset.ready = "1";
  } catch (err) {
    const msg = String(err && err.message || err);
    const hint = /Failed to fetch|NetworkError|CORS/i.test(msg) ? " Browser CORS blocked this host. Run <code>python3 proxy.py</code> and set the proxy field to <code>/proxy</code>." : "";
    showResult(html + `<div class="warn">${esc(msg)}${hint}</div>`);
    setStatus("Invoke failed: " + msg);
  }
}
async function loadDescriptorUrl(url, push = true) {
  setStatus("Fetching authority document…");
  document.documentElement.dataset.ready = "0";
  const fetched = await fetchAuthority(url);
  if (fetched.kind === "turtle") throw new Error(proxyBase()
    ? "Descriptor arrived as Turtle. The proxy could not convert it — install rdflib next to proxy.py, or ask the host for ?format=jsonld."
    : "Descriptor arrived as Turtle. Ask for ?format=jsonld, or set the proxy field so proxy.py can convert it.");
  const descriptor = parseDescriptor(fetched.text, fetched.contentType, stripFrag(url));
  if (push && state.descriptor) state.history.push(state.descriptor.url);
  state.descriptor = descriptor;
  state.selected = null;
  state.lastResponse = null;
  document.getElementById("url").value = descriptor.url;
  document.getElementById("backBtn").disabled = state.history.length === 0;
  document.title = "Hypermedia Client — " + descriptor.title;
  renderList();
  renderDetail();
  setStatus(`Loaded ${descriptor.controls.length} controls from ${descriptor.title} (${fetched.kind}).`);
  document.documentElement.dataset.ready = state.selected ? "0" : "list";
  return descriptor;
}
function selectRel(rel, values) {
  const control = findControl(state.descriptor, rel);
  if (!control) return;
  state.selected = control;
  renderList();
  renderDetail();
  if (values) {
    const form = document.getElementById("invokeForm");
    if (form) {
      for (const [k, v] of Object.entries(values)) {
        const el = form.querySelector(`[name="${CSS.escape(k)}"]`);
        if (el) el.value = v;
      }
    }
  }
}
document.getElementById("loadBtn").addEventListener("click", async () => {
  const url = document.getElementById("url").value.trim();
  if (!url) return;
  try { await loadDescriptorUrl(url); } catch (err) {
    setStatus(String(err.message || err));
    document.getElementById("list").innerHTML = `<div class="warn">${esc(err.message || err)}</div>`;
  }
});
document.getElementById("url").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") document.getElementById("loadBtn").click();
});
document.getElementById("backBtn").addEventListener("click", async () => {
  const prev = state.history.pop();
  document.getElementById("backBtn").disabled = state.history.length === 0;
  if (prev) {
    try { await loadDescriptorUrl(prev, false); } catch (err) { setStatus(String(err.message || err)); }
  }
});
document.body.addEventListener("click", async (ev) => {
  const card = ev.target.closest(".card");
  if (card && card.dataset.rel) { selectRel(card.dataset.rel); return; }
  const iriEl = ev.target.closest("[data-iri]");
  if (iriEl && iriEl.dataset.iri) {
    const iri = iriEl.dataset.iri;
    if (!/^https?:\/\//.test(iri)) return;
    try { await loadDescriptorUrl(iri); } catch (err) { setStatus("Follow failed: " + (err.message || err)); }
  }
});
if (location.origin.startsWith("http") && !document.getElementById("proxy").value) {
  document.getElementById("proxy").placeholder = "/proxy  (used automatically only if you type it)";
}
(async function boot() {
  const params = new URLSearchParams(location.search);
  if (!document.getElementById("url").value) {
    document.getElementById("url").value = params.get("url") || "https://relay.interego.xwisee.com/ns/u-pk-33d42e6b33dc/i2idlx-catalog";
  }
  if (params.get("proxy")) document.getElementById("proxy").value = params.get("proxy");
  if (params.get("url") || params.get("autoload") === "1") {
    try {
      await loadDescriptorUrl(document.getElementById("url").value);
      if (params.get("invoke")) {
        const fields = {};
        if (params.get("query")) fields.query = params.get("query");
        for (const [k, v] of params.entries()) if (k.startsWith("field.")) fields[k.slice(6)] = v;
        selectRel(params.get("invoke"), fields);
        await runInvoke(params.get("dry") === "1");
        document.documentElement.dataset.ready = "done";
      } else {
        document.documentElement.dataset.ready = "list";
      }
    } catch (err) {
      setStatus(String(err.message || err));
      document.documentElement.dataset.ready = "error";
    }
  }
})();
