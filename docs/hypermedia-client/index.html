  boot();
}
// The parameters a link that invokes may carry, besides field.<name>.
const LINK_PARAMS = new Set(["url", "invoke", "dry", "query", "autoload"]);
async function boot() {
  const params = new URLSearchParams(location.search);
  // A link that names two descriptors, or two controls, means neither: nothing
  // is loaded or sent, rather than the first being taken.
  if (params.getAll("url").length > 1) {
    setStatus("This link names more than one descriptor to load; nothing was loaded.");
    document.documentElement.dataset.ready = "error";
    return;
  }
  if (!document.getElementById("url").value) {
    document.getElementById("url").value = params.get("url") || "https://relay.interego.xwisee.com/ns/u-pk-33d42e6b33dc/i2idlx-catalog";
  }
  if (params.get("url") || params.get("autoload") === "1") {
    try {
      // A link's address is loaded as the link gives it, not as the address
      // field holds it: the field drops line breaks and spaces at its ends.
      await loadDescriptorUrl(params.get("url") || document.getElementById("url").value);
      if (params.get("invoke")) {
        const invokes = params.getAll("invoke");
        // A parameter the page does not read, such as "Field.scope", would leave a
        // value the link means unsent, so a link that carries one sends nothing,
        // as hmc.py refuses an option it does not know.
        const unread = [...new Set(params.keys())].filter(k => !LINK_PARAMS.has(k) && !k.startsWith("field."));
        const matches = invokes.length === 1 && !unread.length ? matchControls(state.descriptor, invokes[0]) : [];
        if (unread.length) setStatus("This link carries a parameter this page does not read (" + unread.join(", ") + "); nothing was sent.");
        else if (invokes.length > 1) setStatus("This link names more than one control to invoke; nothing was sent.");
        else if (matches.length > 1) setStatus("More than one control matches " + invokes[0] + " (" + matches.map(c => c.rel).join(", ") + "); nothing was sent.");
        else {
          // A field named twice in the link is a list of values.
          const fields = Object.create(null);
          const put = (name, v) => { fields[name] = own(fields, name) ? asList(fields[name]).concat([v]) : v; };
          for (const q of params.getAll("query")) if (q) put("query", q);
          for (const [k, v] of params.entries()) if (k.startsWith("field.")) put(k.slice(6), v);
          selectRel(invokes[0], fields);
          // A dry run asked for anywhere in the link is a dry run.
          await runInvoke(params.getAll("dry").includes("1"), null);
        }
        document.documentElement.dataset.ready = "done";
      } else {
        document.documentElement.dataset.ready = "list";
      }
    } catch (err) {
      setStatus(String(err.message || err));
      document.documentElement.dataset.ready = "error";
    }
  }
}
if (framed()) refuseFramed(); else start();
