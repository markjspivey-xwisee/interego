name: Restore the pinned DUL ontology
description: Recover the published DUL bytes used by the Foxxi build and verify them against this checkout's manifest.
inputs:
  root:
    description: The I2IDL-X directory containing the pin manifest.
    required: true
runs:
  using: composite
  steps:
    - name: Restore DUL from the verified Foxxi seed
      shell: bash
      env:
        I2IDLX_PIN_ROOT: ${{ inputs.root }}
        GHCR_READ_TOKEN: ${{ github.token }}
        # Verified by the Foxxi build in run 44577506202, job 135767354755.
        DUL_SEED_IMAGE: ghcr.io/markjspivey-xwisee/interego-foxxi-bridge@sha256:f23f9495f960829e90c6ff2ab3513ead01c29c8ab6ba167df479fe5b49e67bdd
      run: |
        set -euo pipefail
        pin="$(node -e 'const m = require(process.argv[1]); process.stdout.write(m.sources.find(p => p.key === "dul").sha256)' \
          "$(realpath "$I2IDLX_PIN_ROOT/evidence/upper/manifest.json")")"
        # The seed holds this DUL snapshot. A new pin uses ordinary source preparation.
        if [ "$pin" != "e5f6429596d2c7014730bad85aaaa9c39530235f27f596cd0e7ce85e6bbcba66" ]; then
          echo "No archived DUL bytes for this pin"
          exit 0
        fi
        cache="$I2IDLX_PIN_ROOT/.cache/upper"
        mkdir -p "$cache"
        if [ -f "$cache/dul.source" ] && printf '%s  %s\n' "$pin" "$cache/dul.source" | sha256sum -c -; then
          exit 0
        fi

        work="$(mktemp -d)"
        container=""
        cleanup() {
          if [ -n "$container" ]; then docker rm "$container" >/dev/null; fi
          rm -rf -- "$work"
        }
        trap cleanup EXIT
        export DOCKER_CONFIG="$work/docker"
        mkdir -p "$DOCKER_CONFIG"
        printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        unset GHCR_READ_TOKEN
        docker pull --platform linux/amd64 "$DUL_SEED_IMAGE"
        # docker create and cp access the filesystem without starting the image.
        container="$(docker create --platform linux/amd64 "$DUL_SEED_IMAGE" /unused)"
        docker cp "$container:/dul.source" "$work/dul.source"
        printf '%s  %s\n' "$pin" "$work/dul.source" | sha256sum -c -
        mv "$work/dul.source" "$cache/dul.source"
