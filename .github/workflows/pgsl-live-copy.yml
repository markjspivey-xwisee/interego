name: PGSL private live copy fixture
on:
  push:
    branches: ['recovery/pgsl-live-copy-*']
    paths:
      - 'tools/pgsl-live-copy.ts'
      - 'tools/pgsl-live-copy.railway.mjs'
      - 'tests/pgsl-live-copy.fixture.mjs'
      - '.github/workflows/pgsl-live-copy.yml'
  pull_request:
    paths:
      - 'tools/pgsl-live-copy.ts'
      - 'tools/pgsl-live-copy.railway.mjs'
      - 'tests/pgsl-live-copy.fixture.mjs'
      - '.github/workflows/pgsl-live-copy.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-copy-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres_source:
        image: postgres:16
        env:
          POSTGRES_USER: copy_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_target:
        image: postgres:16
        env:
          POSTGRES_USER: copy_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGSL_COPY_FIXTURE_URL: postgresql://copy_fixture:fixture_only@127.0.0.1:5432/postgres
      PGSL_COPY_FIXTURE_TARGET_URL: postgresql://copy_fixture:fixture_only@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Check the self-contained Railway artifact
        run: bun build tools/pgsl-live-copy.railway.mjs --target bun --external 'pg@8' --outdir "$RUNNER_TEMP/copy-build"
      - name: Prove fenced copying and independent raw-byte validation
        run: bun tests/pgsl-live-copy.fixture.mjs
