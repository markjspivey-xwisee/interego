name: Interego browser wallet

on:
  pull_request:
    paths:
      - applications/browser-wallet/**
      - .github/workflows/browser-wallet.yml
  push:
    branches: [master]
    paths:
      - applications/browser-wallet/**
      - .github/workflows/browser-wallet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run wallet unit tests
        run: npm --prefix applications/browser-wallet test
      - name: Check extension package
        run: npm --prefix applications/browser-wallet run check
