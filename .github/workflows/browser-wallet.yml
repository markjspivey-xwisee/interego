name: Interego browser wallet

on:
  pull_request:
    paths:
      - applications/browser-wallet/**
      - .github/workflows/browser-wallet.yml
  push:
    branches: [master]
    paths:
      - applications/browser-wallet/**
      - .github/workflows/browser-wallet.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run wallet unit tests
        run: npm --prefix applications/browser-wallet test
      - name: Check extension package
        run: npm --prefix applications/browser-wallet run check
