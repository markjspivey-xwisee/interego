name: Identity Server Tests

# ★ THE IDENTITY SERVER'S TESTS GATED NOTHING PRE-MERGE.
#
# `deploy/identity` is the WebID / DID / SIWE / passkey server. Its `npm test` script ran in
# exactly one workflow — `e2e-passkey.yml` — whose trigger block is `workflow_dispatch:` and
# nothing else. No push trigger, no pull_request trigger, so a change to WebFinger discovery
# or userid derivation merged without those tests ever running; the last two recorded runs
# were months old and both FAILED. `deploy/identity` is also matched by no vitest `include`
# glob, so the whole-tree run does not reach it either.
#
# The Playwright half of e2e-passkey.yml stays dispatch-only on purpose: it drives the LIVE
# deployment, so it cannot run before the code it tests is deployed. The UNIT half has no
# such dependency and belongs on every PR. That split is why this is a separate file rather
# than a trigger added to that one.

on:
  push:
    branches: [master]
    paths:
      - 'deploy/identity/**'
      - 'docs/client-sign.html'
      - 'tools/passkey-signing-browser.mjs'
      - 'integrations/application-runtime/**'
      - 'deploy/mcp-relay/client-authorization.ts'
      - 'deploy/mcp-relay/client-interactions.ts'
      - 'deploy/mcp-relay/client-interaction-http.ts'
      - 'deploy/mcp-relay/client-registration.ts'
      - 'deploy/mcp-relay/resource-compositions.ts'
      - 'deploy/mcp-relay/cors-allowlist.ts'
      - 'tests/browser-signing-handoff*.test.ts'
      - 'tests/fixtures/client-interaction-fixture.ts'
      - 'examples/application-simulation/**'
      - 'packages/**'
      - 'tsconfig.check.json'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/identity-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'deploy/identity/**'
      - 'docs/client-sign.html'
      - 'tools/passkey-signing-browser.mjs'
      - 'integrations/application-runtime/**'
      - 'deploy/mcp-relay/client-authorization.ts'
      - 'deploy/mcp-relay/client-interactions.ts'
      - 'deploy/mcp-relay/client-interaction-http.ts'
      - 'deploy/mcp-relay/client-registration.ts'
      - 'deploy/mcp-relay/resource-compositions.ts'
      - 'deploy/mcp-relay/cors-allowlist.ts'
      - 'tests/browser-signing-handoff*.test.ts'
      - 'tests/fixtures/client-interaction-fixture.ts'
      - 'examples/application-simulation/**'
      - 'packages/**'
      - 'tsconfig.check.json'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/identity-tests.yml'

permissions:
  contents: read

jobs:
  identity-unit:
    name: "Identity unit tests (WebFinger, userid derivation, target resolution)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install workspace deps
        run: npm ci --no-audit --no-fund
      - name: Run identity unit tests
        run: npm test --workspace @interego/identity

  passkey-browser:
    name: "Passkey login and single-prompt receipt signing (Chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build workspace packages for the runtime and typecheck gate
        run: npm run build
      - run: node --import tsx tools/passkey-signing-browser.mjs
      - name: Verify one native passkey assertion without prior login
        env:
          INTEREGO_TEST_CHROMIUM: '1'
        run: npx vitest run tests/browser-signing-handoff.chromium.test.ts
