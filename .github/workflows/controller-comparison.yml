name: Controller comparison public audit

on:
  pull_request:
    paths:
      - 'benchmarks/controller-procedure-comparison/**'
      - '.github/workflows/controller-comparison.yml'
  push:
    branches: [master]
    paths:
      - 'benchmarks/controller-procedure-comparison/**'
      - '.github/workflows/controller-comparison.yml'

permissions:
  contents: read

# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Validate public accounting and disclosure regressions
        run: node --test benchmarks/controller-procedure-comparison/public-release.test.mjs
