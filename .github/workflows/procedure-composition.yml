name: Optional evidence-review composition
on:
  pull_request:
    paths:
      - 'integrations/procedure-composition/**'
      - 'integrations/procedure-runner/**'
      - 'integrations/affordance-surface/differential-kernel.ts'
      - 'deploy/mcp-relay/hmd-app-logic.ts'
      - 'examples/procedures/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/procedure-composition.yml'
  push:
    branches: [master]
    paths:
      - 'integrations/procedure-composition/**'
      - 'integrations/procedure-runner/**'
      - 'integrations/affordance-surface/differential-kernel.ts'
      - 'deploy/mcp-relay/hmd-app-logic.ts'
      - 'examples/procedures/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/procedure-composition.yml'
permissions:
  contents: read
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  two-domains:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: node --import tsx --test integrations/procedure-composition/*.test.mjs integrations/procedure-runner/*.test.mjs
      - run: node --import tsx integrations/procedure-composition/demo.mjs composition-proof
