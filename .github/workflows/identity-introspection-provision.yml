name: Identity introspection secret rollout
# Closes identity's POST /tokens/verify to everyone but its two callers
# (tools/identity-introspection-provision.mjs). One stage per dispatch, in this order:
#   callers  - one new value, generated in this runner, on relay and css-gate
#   identity - the same value on identity (ALLOW_OPEN_INTROSPECTION is kept as the rollback)
#   finalize - removes ALLOW_OPEN_INTROSPECTION from identity
# Each applied stage deploys the services it changed, or that hold the change but do not run it
# yet, with the image they already run, and waits for SUCCESS and for the service's own health
# field to show the change. Unticked `apply` is a dry run. No value is printed. Do not dispatch
# while Auto-deploy master or Deploy to Railway is running (the tool refuses). Dispatch only, from
# master. See deploy/identity/AUTH-ARCHITECTURE.md.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'callers (relay + css-gate) | identity | finalize (removes ALLOW_OPEN_INTROSPECTION)'
        type: choice
        options:
          - callers
          - identity
          - finalize
        required: true
      apply:
        description: 'Write and deploy (unticked = dry run: names, set/unset, equal yes/no)'
        type: boolean
        default: false
permissions:
  contents: read
  # Read-only, to refuse while an auto-deploy or Deploy to Railway run is in progress.
  actions: read
# Its own group, deliberately not railway-deploy-<service>: a newer pending run in a concurrency
# group cancels the older pending one, so joining that group could cancel a queued deploy leg.
concurrency:
  group: identity-introspection-provision
  cancel-in-progress: false
jobs:
  provision:
    if: github.repository == 'markjspivey-xwisee/interego' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # callers at worst: two deploys of 12 minutes, each with up to 3 minutes of health checks.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Verify the provisioning helper
        run: node --test tests/identity-introspection-provision.test.mjs
      - name: Run the stage (values never printed)
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          STAGE: ${{ inputs.stage }}
          APPLY: ${{ inputs.apply }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/identity-introspection-provision.mjs
