name: ESLint

# ★ THE WORKFLOW THAT DID NOT EXIST, WHICH IS WHY THE LINTER'S DEATH WENT UNNOTICED.
#
# `npm run lint` was `eslint packages/*/src/ tests/` from the initial commit onward, and
# the repo has never contained an eslint config in any format. Under `eslint@^9` a missing
# flat config is a hard error, so the script exited 2 having examined zero files. Nothing
# in .github/workflows called it, so nobody saw. Fourteen other workflows existed; the one
# for the linter did not.
#
# This runs `tools/lint-gate.mjs`, which additionally asserts that eslint EXAMINED files —
# an eslint run that lints nothing exits 0, and that is the failure mode that hid here.
#
# Unfiltered by `paths:` on purpose. The gate's file-count floor is a claim about its lint
# SURFACE — `TARGETS` in lint-gate.mjs, which is the zero-error surface and not the whole
# tree. A path filter would let a change to eslint.config.js's `ignores` (or a directory
# rename) collapse that coverage in a commit the workflow was configured to skip.
#
# ★ THE SENTENCE HERE USED TO SAY `deploy/`, `applications/`, `tools/` and `mcp-server/` "are
# linted by nothing", and by the time anyone read it `tools/` had joined TARGETS and the other
# three had not. Both halves have now been closed rather than described: `tools/` is on the
# zero-error surface, and every other source root in the tree is on the UN-LINTED FRONTIER —
# scanned on every run with its error and file counts pinned per root and ratcheted both ways.
# The frontier is 2,505 errors across seven roots, which nothing observed until the gate's
# root census was asked. It is not the end state; it is the end of the gap being invisible.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  eslint:
    # The name is the only thing a reader sees on a PR's check list, so it must not state a
    # number that has stopped being true. It said "47 files pinned" long after the baseline
    # was taken to `{}` — advertising 47 accepted failures on a gate that now accepts none,
    # which reads as "this check tolerates errors" and invites the next person to add a pin
    # rather than fix the error. The count is deliberately gone rather than updated: a
    # literal here has to be re-edited every time the baseline moves, and it silently
    # decays between those edits. lint-gate.mjs prints the live counts in its own output.
    name: "Flat-config lint + ratcheted baseline (zero-error, empty baseline) + un-linted frontier ceiling"
    runs-on: ubuntu-latest
    steps:
      # ★ `fetch-depth: 0` IS LOAD-BEARING FOR THE CHANGELOG GATE BELOW. The default is a
      # depth-1 clone, under which every commit hash CHANGELOG.md cites fails to resolve and
      # the undocumented backlog is uncountable — so the gate would report the worst possible
      # result for a reason that has nothing to do with the changelog, and the obvious "fix"
      # would be to raise its pin. That gate refuses a shallow clone outright rather than
      # degrading, so this line is what keeps it able to run at all.
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Install
        run: npm ci
      # Fails on: any error in a file not on the baseline; any pinned file whose count
      # grows; any pinned file whose count IMPROVES without the pin moving; on eslint
      # examining fewer files than the floor, which is what a silently-disabled config
      # looks like from the outside; on that floor drifting far BELOW the real count, which
      # is the same decay in the direction nobody notices; on an un-linted frontier root
      # growing, improving without banking the gain, or falling out of the scan; and on a
      # top-level source root existing that is in none of those three lists at all.
      - name: Lint gate
        run: node tools/lint-gate.mjs
      # ★ THE CONFORMANCE RUNNER WAS CALLED BY NOTHING. It gates Candidate Recommendation
      # per STATUS.md and is what spec/STABILITY.md points a second implementation at, yet
      # no workflow, no npm script and no test invoked it — so it printed
      # "Interego L1+L2+L3 (Core + Federation + Advanced)" over five fixtures in one of the
      # ten categories its own README enumerates, for as long as it has existed, with
      # nothing able to notice. It lives in THIS job rather than behind a `paths:` filter
      # for the same reason the header above gives: a filter would let exactly the commits
      # that break it skip the check.
      - name: Conformance runner (claims no level it did not exercise)
        run: node spec/conformance/runner.mjs
      # ★ A LINK GATE'S SUBJECT IS THE TARGET, NOT THE LINKING DOCUMENT. This checks that
      # every relative link and every named workflow in the top-level documents resolves on
      # disk. It ran in ontology-lint.yml, whose `paths:` covered 18 of the 82 targets — so
      # deleting a linked document (docs/ARCHITECTURAL-FOUNDATIONS.md, spec/STABILITY.md,
      # demos/README.md, tests/p2p.test.ts, …) matched no trigger and merged with the gate
      # that forbids it never executing. Measured: delete that file and the linter reports
      # both breaks; no workflow would have run it. Unfiltered here for the same reason the
      # header gives for the lint gate itself.
      - name: Docs claims resolve (relative links + named workflows)
        run: node tools/docs-claim-lint.mjs
      # ★ CHANGELOG.md's preamble asserted "Commit hashes link back to the git history" over
      # 78 citations, NONE of which resolve — the history they were written against is not
      # the one this repository has. That is a false sentence at HEAD in the second paragraph
      # of the file, and it survived because nothing ever tried to follow a citation. The
      # gate pins the 78 as unrepairable pre-rewrite history and fails on a 79th, and it
      # measures the undocumented backlog from git against a ceiling — the figure that lived
      # in a pull request body, said 235, and had silently become 431.
      - name: Changelog claims (citations resolve; backlog inside its ceiling)
        run: node tools/changelog-lint.mjs
