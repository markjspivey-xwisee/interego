name: Foxxi /ns release tags

# Tag the commit that releases a version of the Foxxi /ns documents.
#
# A released version of a Foxxi ontology, shapes graph, mapping set or context never changes
# (applications/foxxi-content-intelligence/ns-releases/). Its header cites the source files it
# was generated from (prov:wasDerivedFrom), and those files keep changing on master, so a citation
# of master would turn false at the next commit. Each version cites its sources at its release
# tag, `foxxi-ns-<version>`, instead (src/ns/catalog.ts, sourceAt). This job makes that tag on
# the commit that brings the version onto master, whose tree generated it: the
# every-released-version-stays-resolvable test fails while a document differs from its archived
# version, so the archive and the source agree at that commit.
#
# A tag is made once and never moved, on the commit that brought its version to master even when
# this job runs later. tools/release-ns.ts refuses to release anything more under a version whose
# tag exists, so one version is one release.

on:
  push:
    branches: [master]
    paths:
      - 'applications/foxxi-content-intelligence/ns-releases/**'

permissions:
  contents: write

concurrency:
  group: foxxi-ns-release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Tag each newly released version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag versions that have no release tag yet
        env:
          SUMS: applications/foxxi-content-intelligence/ns-releases/SHA256SUMS
        run: |
          set -euo pipefail
          # Every archived file is <path>/<version>.<extension>; the version is YYYY.MM.PATCH.
          versions=$(awk '{print $2}' "$SUMS" | sed -E 's#.*/([0-9]{4}\.[0-9]{1,2}\.[0-9]+)\.[a-z.]+$#\1#' | sort -u)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for v in $versions; do
            tag="foxxi-ns-$v"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag exists — left as it is"
              continue
            fi
            # The commit that brought the version to master: the first on master's first-parent line
            # whose SHA256SUMS lists a file of it. That is this push for a new version, and an earlier
            # commit for one released before this workflow ran (2026.10.0 reached master without it).
            sha=$(git log --first-parent --reverse --format=%H "$GITHUB_SHA" -- "$SUMS" | while read -r c; do
              if git show "$c:$SUMS" 2>/dev/null | awk '{print $2}' | grep -qF "/$v."; then echo "$c"; break; fi
            done)
            sha=${sha:-$GITHUB_SHA}
            git tag -a "$tag" -m "Foxxi /ns release $v" "$sha"
            git push origin "refs/tags/$tag"
            echo "::notice::tagged $sha as $tag"
          done
