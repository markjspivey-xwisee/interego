name: Interego workflow plugin
on:
  pull_request:
    branches: [master]
    paths: ['integrations/agent-plugin/**', '.github/workflows/agent-plugin.yml']
  push:
    branches: [master]
    paths: ['integrations/agent-plugin/**', '.github/workflows/agent-plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - run: node --test integrations/agent-plugin/build.test.mjs
      - run: node integrations/agent-plugin/build.mjs --out "$RUNNER_TEMP/interego-plugin"
