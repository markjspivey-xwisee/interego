name: Local health context adapter

on:
  pull_request:
    paths:
      - 'applications/health-workbench/**'
      - '.github/workflows/health-workbench-local-context.yml'
  push:
    branches: [master]
    paths:
      - 'applications/health-workbench/**'
      - '.github/workflows/health-workbench-local-context.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  selected-context-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test context preparation and fictional response verification without a live pod
        run: node --test applications/health-workbench/test/local-context.test.mjs applications/health-workbench/test/fictional-local-check.test.mjs applications/health-workbench/test/import-manifest.test.mjs
