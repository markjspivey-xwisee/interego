name: Desktop Packaging

# ★ THE DESKTOP APP WAS BUILT BY NOTHING, AND IT HAD BEEN BROKEN FOR FOUR COMMITS.
#
# `applications/shared-workspace/desktop` is an Electron shell packaged by electron-builder.
# Before this file, no workflow ran `npm run build` or any `package*` script for it — the only
# CI that touched the directory at all was `bridge-typecheck.yml` via `tools/typecheck-gate.mjs`,
# and that gate compiles the program described by `tsconfig.check.json`, not the program
# described by the DESKTOP's own tsconfig. Those are different programs with different resolvers,
# so the one that packages the app was checked by nobody.
#
# Measured: at #289 (`16e1d98`), `RelayClient` moved into the `@interego/core/relay` subpath
# export. The desktop tsconfig still said `"moduleResolution": "node"`, which predates `exports`
# and cannot see a subpath — so `WorkspaceClient extends RelayClient` collapsed and 48 type
# errors appeared. `npm run build` exited non-zero, `npm run package` could not reach
# electron-builder, and the app could not be built AT ALL for four merges without one gate going
# red. That is what this file exists to make impossible.
#
# ★ AND IT PACKAGES ON ALL THREE PLATFORMS BECAUSE TWO OF THEM CANNOT BE CHECKED ANY OTHER WAY.
# The maintainer's machine is Windows. The Windows targets build there; macOS cannot be built off
# a Mac at all (electron-builder's dmg target shells out to macOS-only tooling) and the Linux
# AppImage target fails on Windows for a missing `mksquashfs`. Both were configured-and-never-
# built. A hosted runner per platform is the only honest way to turn "configured" into "builds",
# so that is what this does.
#
# ★ AND IT NOW PROVES THEY LAUNCH. Building was never evidence of launching, and two of the three
# platforms had never been started by anyone — a binary nobody has run must not be handed to
# anyone. After packaging, each leg starts its OWN packaged artifact headlessly (Linux under a
# virtual display via `xvfb-run`, macOS and Windows directly) through `tools/ci-launch-smoke.ts`,
# which sets INTEREGO_DESKTOP_SMOKE=1 so `src/main.ts` boots the real window, waits for
# `did-finish-load`, and prints a marker the launcher reads. A build that does not open a window
# now fails here instead of shipping.
#
# ★ WHAT THIS STILL DOES NOT PROVE. It says nothing about signing: every artifact here is
# unsigned, so SmartScreen warns on Windows and Gatekeeper refuses on macOS, both correctly. See
# the desktop README and electron-builder.yml — signing and notarisation need certificates nobody
# on this project holds and are deliberately out of scope. The launch check also does not sign in:
# it never touches the relay or the OS secret store (`selftest.js` is the substrate check and
# needs both), so it proves the shell opens, not that a round trip to the fleet works.
#
# No job-level `if:` reads `matrix.` anywhere below. That is the defect
# `tests/workflow-header-matches-triggers.test.ts` exists to catch, and the per-platform
# difference is carried by the matrix `script` value instead of by a condition.

on:
  push:
    branches: [master]
    paths:
      - 'applications/shared-workspace/desktop/**'
      - 'applications/shared-workspace/discord/**'
      - 'packages/workspace-client/**'
      - 'packages/core/**'
      # The shell's own tests live in the root suite rather than beside it, so without these two
      # lines a change to the harness alone would not run the harness.
      - 'tests/workspace-desktop-renderer.test.ts'
      - 'tests/workspace-desktop-modelprovider.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-package.yml'
  pull_request:
    branches: [master]
    paths:
      - 'applications/shared-workspace/desktop/**'
      - 'applications/shared-workspace/discord/**'
      - 'packages/workspace-client/**'
      - 'packages/core/**'
      # The shell's own tests live in the root suite rather than beside it, so without these two
      # lines a change to the harness alone would not run the harness.
      - 'tests/workspace-desktop-renderer.test.ts'
      - 'tests/workspace-desktop-modelprovider.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ★ THE SHELL'S OWN TESTS HAD NO WORKFLOW, WHICH IS THE DEFECT #309 FOUND ONE DIRECTORY OVER.
  #
  # `tests/workspace-desktop-renderer.test.ts` drives the real bundled renderer in a real document
  # against the shipping `index.html`, and it has caught a real defect on first run every time it
  # has been extended. Nothing in CI ran it. There is no workflow anywhere that runs the ROOT
  # `tests/` suite — `shared-workspace-tests.yml` is scoped to the Discord bot, `relay-tests.yml` to
  # the relay, and `bridge-typecheck.yml` compiles the program without executing it — so every
  # renderer case in this repository was a local-only gate, exactly like the bot's 145 were before
  # #309 gave them a home.
  #
  # This is deliberately the two DESKTOP files and not the whole suite: this workflow's triggers are
  # already the paths those files cover, and a job that quietly became the repository's general test
  # runner would be one nobody chose. The rest of the suite is still local-only, and that remains a
  # real gap rather than one this file pretends to have closed.
  tests:
    name: "The desktop shell's own tests (real renderer, real document)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install workspace deps
        run: npm ci --no-audit --no-fund
      - name: Build the substrate packages the renderer bundles
        # The harness bundles `src/renderer.ts` itself, but esbuild follows the package `exports` to
        # reach `@interego/workspace-client` — so its `dist/` must exist or the bundle fails to
        # resolve. The suite tests BUILT OUTPUT; this is the build.
        run: npm run build
      - name: Run them
        run: npx vitest run tests/workspace-desktop-renderer.test.ts tests/workspace-desktop-modelprovider.test.ts --no-cache

  package:
    name: "Package the desktop shell (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Every platform reports for itself. One failing does not hide the other two, which is the
      # whole point when two of the three have never been built.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
          - os: macos-latest
            script: 'package:mac'
          - os: ubuntu-latest
            script: 'package:linux'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install workspace deps
        run: npm ci --no-audit --no-fund
      - name: Build the substrate packages the shell bundles
        # `@interego/workspace-client` is bundled INTO the Electron entry points by esbuild, so
        # its `dist/` must exist before the shell is packaged.
        run: npm run build
      - name: Package
        # electron-builder pins `electronVersion` in the config because this is an npm workspace
        # and the runtime is hoisted to the repo root, where it will not look.
        run: npm run ${{ matrix.script }} --workspace @interego/workspace-desktop
      - name: What was produced
        # The artifact list IS the result. A green job with an empty `release/` would be a build
        # that succeeded at nothing.
        run: ls -l applications/shared-workspace/desktop/release
        shell: bash
      - name: Prepare a headless display and Electron's runtime libraries (Linux)
        # Step-level `if:` reads `runner.os`, not `matrix.` — a job-level `if:` reading the matrix
        # is the defect `tests/workflow-header-matches-triggers.test.ts` catches; this is neither.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1
          # Electron links libasound even headless; the package name changed at 24.04 (t64), so try
          # both and do not fail the leg if neither is missing.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          # Electron's sandbox needs a SUID helper OR unprivileged user namespaces. ubuntu-24.04
          # restricts the latter by default (AppArmor), which makes the SHIPPING sandbox refuse to
          # start. Relax the RUNNER, not the app, so the smoke test exercises the artifact exactly
          # as it ships — sandbox and all — rather than launching it in a weaker configuration.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Launch the packaged app headlessly and assert it reaches a window
        # ONE launcher for all three platforms — the per-OS binary path and the xvfb wrapper are
        # the only differences, carried here in bash rather than by a matrix condition. The
        # launcher decides pass/fail on the app's printed marker, never on the exit code, because
        # an Electron helper can outlive `app.exit()` and hold the pipe open; see the launcher.
        shell: bash
        run: |
          set -euo pipefail
          rel=applications/shared-workspace/desktop/release
          launcher=applications/shared-workspace/desktop/tools/ci-launch-smoke.ts
          case "$RUNNER_OS" in
            Linux)
              bin=$(ls "$rel"/*.AppImage | head -n1)
              chmod +x "$bin"
              xvfb-run --auto-servernum npx tsx "$launcher" "$bin" --appimage-extract-and-run
              ;;
            macOS)
              app=$(ls -d "$rel"/mac*/*.app | head -n1)
              npx tsx "$launcher" "$app/Contents/MacOS/$(basename "$app" .app)"
              ;;
            Windows)
              bin=$(ls "$rel"/win-unpacked/*.exe | head -n1)
              npx tsx "$launcher" "$bin"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # Unpacked trees are the build's scratch space, not a deliverable, and on Windows the
          # pair of them is ~500 MB.
          path: |
            applications/shared-workspace/desktop/release/*.exe
            applications/shared-workspace/desktop/release/*.zip
            applications/shared-workspace/desktop/release/*.dmg
            applications/shared-workspace/desktop/release/*.AppImage
            applications/shared-workspace/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
