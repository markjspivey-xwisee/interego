name: Cancel unintended verifier auto-deploy
on:
  push:
    branches: [incident/cancel-verifier-auto-deploy-20261022]
    paths: [.github/workflows/cancel-verifier-auto-deploy-20261022.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the observed master auto-deploy and verify terminal state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/markjspivey-xwisee/interego';
          const path='/actions/runs/39812349605';
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28'};
          const request=async(p,method='GET')=>{
            const r=await fetch(base+p,{method,headers,signal:AbortSignal.timeout(10000)});
            if(!r.ok)throw Error(method+' '+p+' HTTP '+r.status);
            return r.status===202||r.status===204?null:r.json();
          };
          const before=await request(path);
          if(before.name!=='Auto-deploy master'||before.head_branch!=='master'||!before.head_sha.startsWith('eb83c8ca'))throw Error('Run identity does not match the explicitly authorized cancellation');
          console.log(JSON.stringify({kind:'before',run:before.id,name:before.name,sha:before.head_sha,status:before.status,conclusion:before.conclusion}));
          if(before.status!=='completed')await request(path+'/cancel','POST');
          const until=Date.now()+90000;
          let last=before;
          while(Date.now()<until){
            last=await request(path);
            if(last.status==='completed'){
              console.log(JSON.stringify({kind:'cancel-readback',run:last.id,status:last.status,conclusion:last.conclusion,sha:last.head_sha}));
              if(last.conclusion!=='cancelled')throw Error('Run reached terminal '+last.conclusion+' rather than cancelled');
              process.exit(0);
            }
            await new Promise(r=>setTimeout(r,2000));
          }
          throw Error('Cancellation did not reach terminal state within ninety seconds');
          NODE
