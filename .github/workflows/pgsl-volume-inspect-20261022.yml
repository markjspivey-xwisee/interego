name: Read raw recovery volume metadata
on:
  push:
    branches:
      - incident/pgsl-volume-inspect-20261022
    paths:
      - .github/workflows/pgsl-volume-inspect-20261022.yml
permissions: {}
concurrency:
  group: pgsl-volume-inspect-20261022
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact instance deletion flags and pending work
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const project='b88ceabb-7461-4949-81d7-3d29132e7806',environment='449996a2-3533-462f-98c6-4ab4c05dd777';
          const targets=['4471d983-aa9a-46d0-882b-13f5537d8f68','39097cdd-1093-420a-bc39-572aa2668bbd','54013c9e-2954-4332-a4e9-e6dd2b0efca1'];
          const token=process.env.RAILWAY_PROJECT_TOKEN;if(!token)throw Error('missing existing project secret');
          const say=x=>console.log(JSON.stringify(x));
          async function query(document,variables={}){
           if(!document.trim().startsWith('query')&&!document.trim().startsWith('{'))throw Error('query-only audit');
           for(let attempt=1;;attempt++){
            try{
             const response=await fetch('https://backboard.railway.com/graphql/v2',{method:'POST',headers:{'Content-Type':'application/json','Project-Access-Token':token},body:JSON.stringify({query:document,variables}),signal:AbortSignal.timeout(20000)});
             if(!response.ok)throw Error('HTTP '+response.status);
             const body=await response.json();if(body.errors?.length)throw Error(body.errors.map(error=>error.message).join('; ').slice(0,500));
             return body.data;
            }catch(error){if(attempt>=3)throw error;await new Promise(resolve=>setTimeout(resolve,1000*attempt));}
           }
          }
          const scope=await query('{projectToken{projectId environmentId}}');
          if(scope.projectToken?.projectId!==project||scope.projectToken?.environmentId!==environment)throw Error('wrong scope');
          const schema=await query('{__type(name:"VolumeInstance"){fields{name description type{kind name ofType{kind name ofType{kind name}}}}}}');
          say({phase:'instance-field-definitions',fields:schema.__type.fields.filter(field=>['currentSizeMB','sizeMB','state','deletedAt','isPendingDeletion'].includes(field.name))});
          const data=await query('query($id:String!){environment(id:$id){id name volumeInstances(first:25){edges{node{id serviceId mountPath environmentId currentSizeMB sizeMB state deletedAt isPendingDeletion volume{id name}}}}}}',{id:environment});
          const all=data.environment.volumeInstances.edges.map(edge=>edge.node);
          say({phase:'environment-volume-instances',environment:data.environment.id,total:all.length,targets:all.filter(instance=>targets.includes(instance.volume?.id)),targetPresence:Object.fromEntries(targets.map(id=>[id,all.some(instance=>instance.volume?.id===id)]))});
          const pending=await query('query($id:String!){environmentPendingWork(environmentId:$id){id status}}',{id:environment});
          say({phase:'pending-work',data:pending.environmentPendingWork});
          say({phase:'complete',readOnly:true,mutationsExecuted:0});
          
          NODE
