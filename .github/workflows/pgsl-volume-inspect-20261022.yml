name: Read backend runtime health
on:
  push:
    branches:
      - incident/pgsl-volume-inspect-20261022
    paths:
      - .github/workflows/pgsl-volume-inspect-20261022.yml
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public health responses without credentials or writes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const checks=[
           {service:'relay-custom',url:'https://relay.interego.xwisee.com/health'},
           {service:'relay-railway',url:'https://relay-production-53b7.up.railway.app/health'},
           {service:'foxxi-custom',url:'https://foxxi-bridge.interego.xwisee.com/health'}
          ];
          let failed=false;
          await Promise.all(checks.map(async check=>{
           try{
            const response=await fetch(check.url,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
            let body;try{body=await response.json();}catch{body={};}
            const build=typeof body.build==='string'?body.build:null;
            const status=typeof body.status==='string'?body.status:null;
            const record={phase:'health',...check,http:response.status,ok:response.ok,build,status,bodyKeys:Object.keys(body).slice(0,25),checkedAt:new Date().toISOString()};
            if(check.service.startsWith('relay')&&build!=='4d41980040f08123bf787523938596d304a77e35'){record.expectedBuildMatched=false;failed=true;}else if(check.service.startsWith('relay'))record.expectedBuildMatched=true;
            if(!response.ok)failed=true;
            console.log(JSON.stringify(record));
           }catch(error){failed=true;console.log(JSON.stringify({phase:'health',...check,ok:false,error:error.message,checkedAt:new Date().toISOString()}));}
          }));
          console.log(JSON.stringify({phase:'complete',readOnly:true,healthy:!failed,checks:checks.length}));
          process.exitCode=failed?1:0;
          
          NODE
