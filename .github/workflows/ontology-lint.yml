name: Ontology Lint

# Guards against drift between TS code emitting cg:/cgh:/pgsl:/ie:/align:/
# hyprcat:/hypragent: terms and the docs/ns/*.ttl ontology files that
# define them. Every owned-namespace reference in TS must have a matching
# term declaration in its corresponding .ttl file. Catches regressions like
# inventing cg:hasDistribution inline without declaring it as an OWL
# property — exactly the kind of first-principles drift the sweep fixed.

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'deploy/identity/**'
      - 'deploy/mcp-relay/**'
      - 'mcp-server/**'
      - 'docs/ns/**'
      - 'docs/applications/**'
      # One glob rather than four named files: this job now runs four tools/ linters, and
      # naming them individually is how `tools/security-txt-expiry-check.mjs` came to be
      # wired into nothing at all.
      - 'tools/**'
      # The grounding count is stated in prose in spec/LAYERS.md and is now verified by
      # tools/derivation-lint.mjs. Without this entry a commit that only edits the number
      # never runs the gate that checks it — which is how it reached 41/41 against 97.
      - 'spec/LAYERS.md'
      # This job runs tools/docs-drift-lint.mjs and tools/docs-claim-lint.mjs over the
      # top-level documents. A markdown-only commit that breaks a link would otherwise skip
      # the job that exists to check markdown.
      - 'README.md'
      - 'STATUS.md'
      - 'CLAUDE.md'
      - 'RELEASING.md'
      - 'SECURITY.md'
      # ★★ THE WHOLE DIRECTORY, because SCAN_PATHS says 'applications' — not three named files.
      #
      # This listed `applications/foxxi-content-intelligence/affordances.ts`,
      # `applications/_shared/**` and one bridge server, each added the day something shipped
      # past the lint from it. The comment that used to sit here said the shared mount "was not
      # covered — so a new undeclared term shipped from it without this lint ever running", and
      # then covered only that one mount. Every other vertical stayed exactly as exposed:
      # measured, `applications/organizational-working-memory/affordances.ts` was emitting
      # `nist-rmf:MG-1.1`, which is declared nowhere, and no commit confined to that file would
      # have started this job. The lint scans the directory; the trigger now matches it, and
      # tests/workflow-trigger-covers-the-suite.test.ts fails if the two drift apart again.
      - 'applications/**'
      # ★★ `integrations/**` IS IN SCAN_PATHS AND WAS NOT IN THIS FILTER, which is the same
      # wiring bug the tools/** glob above was written for. The lint was extended to scan
      # integrations/ precisely because two undeclared control IRIs shipped from
      # integrations/compliance-overlay and survived every CI run; leaving it out here means a
      # commit confined to that directory still never starts the job that would catch it. The
      # scan reaching a directory and the job STARTING are two separate facts.
      - 'integrations/**'
      - '.github/workflows/ontology-lint.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/**'
      - 'deploy/identity/**'
      - 'deploy/mcp-relay/**'
      - 'mcp-server/**'
      - 'docs/ns/**'
      - 'docs/applications/**'
      # One glob rather than four named files: this job now runs four tools/ linters, and
      # naming them individually is how `tools/security-txt-expiry-check.mjs` came to be
      # wired into nothing at all.
      - 'tools/**'
      # The grounding count is stated in prose in spec/LAYERS.md and is now verified by
      # tools/derivation-lint.mjs. Without this entry a commit that only edits the number
      # never runs the gate that checks it — which is how it reached 41/41 against 97.
      - 'spec/LAYERS.md'
      # This job runs tools/docs-drift-lint.mjs and tools/docs-claim-lint.mjs over the
      # top-level documents. A markdown-only commit that breaks a link would otherwise skip
      # the job that exists to check markdown.
      - 'README.md'
      - 'STATUS.md'
      - 'CLAUDE.md'
      - 'RELEASING.md'
      - 'SECURITY.md'
      # ★★ THE WHOLE DIRECTORY, because SCAN_PATHS says 'applications' — not three named files.
      #
      # This listed `applications/foxxi-content-intelligence/affordances.ts`,
      # `applications/_shared/**` and one bridge server, each added the day something shipped
      # past the lint from it. The comment that used to sit here said the shared mount "was not
      # covered — so a new undeclared term shipped from it without this lint ever running", and
      # then covered only that one mount. Every other vertical stayed exactly as exposed:
      # measured, `applications/organizational-working-memory/affordances.ts` was emitting
      # `nist-rmf:MG-1.1`, which is declared nowhere, and no commit confined to that file would
      # have started this job. The lint scans the directory; the trigger now matches it, and
      # tests/workflow-trigger-covers-the-suite.test.ts fails if the two drift apart again.
      - 'applications/**'
      # ★★ `integrations/**` IS IN SCAN_PATHS AND WAS NOT IN THIS FILTER, which is the same
      # wiring bug the tools/** glob above was written for. The lint was extended to scan
      # integrations/ precisely because two undeclared control IRIs shipped from
      # integrations/compliance-overlay and survived every CI run; leaving it out here means a
      # commit confined to that directory still never starts the job that would catch it. The
      # scan reaching a directory and the job STARTING are two separate facts.
      - 'integrations/**'

permissions:
  contents: read

jobs:
  lint:
    # ★ NO ENUMERATION. This read "(cg cgh pgsl ie align hyprcat hypragent hela sat cts olke
    # amta)" — twelve prefixes, two of them DEPRECATED aliases, omitting `iep` and `ieh`
    # (the current names after the rename) and eleven others OWNED_NAMESPACES actually
    # covers. A hand-maintained list in a check NAME is drift with a green tick next to it;
    # the authoritative list is OWNED_NAMESPACES in tools/ontology-lint.mjs, which the job
    # prints. Same argument that deleted the "47 files pinned" literal from the ESLint job.
    name: "Owned-namespace consistency (every prefix in OWNED_NAMESPACES)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Run ontology lint
        run: node tools/ontology-lint.mjs
      - name: Check Foxxi /agent/* routes are discoverable affordances
        run: node tools/check-foxxi-affordances.mjs
      # Every L2/L3 class must ground into L1 or a W3C vocabulary, or declare itself
      # primitive. This lint existed but ran in NO workflow, and had been failing at
      # 45/97 since the cg:->iep: rename left its prefix list behind — a guard nobody
      # could see was broken is indistinguishable from no guard at all.
      - name: Every vertical class grounds into L1 (derivation discipline)
        run: node tools/derivation-lint.mjs
      # ★ RAN IN NO WORKFLOW AND EXITED 2 ON A CLEAN TREE. It read a path the
      # security-txt helper moved away from, so it never once evaluated the RFC 9116
      # Expires value — and `npm run lint:all`, which chains it, was therefore red at
      # HEAD while CI ran the narrower `npm run lint` and saw nothing. Both halves are
      # fixed; this step is the half that keeps it visible.
      - name: security.txt Expires is not within the refresh window (RFC 9116)
        run: node tools/security-txt-expiry-check.mjs
      # ★ The Azure→Railway doc sweep was done twice and left residue both times: STATUS.md
      # asserted three services "live on Azure" with `contextgraphsacr` image pins twenty
      # lines above its own paragraph explaining that registry was deleted. A claim that has
      # to be re-checked by hand gets re-checked once.
      - name: Docs describe the live fleet, not a dead one
        run: node tools/docs-drift-lint.mjs
      # ★ THE OTHER HALF OF THE SAME CLASS NOW RUNS IN lint.yml, NOT HERE.
      #
      # `tools/docs-claim-lint.mjs` asserts that every relative link and every named
      # workflow in the top-level documents resolves ON DISK. That makes its subject the
      # LINK TARGETS, not the linking documents — 82 targets, of which 64 matched no
      # pattern in this job's `paths:` list. Deleting `docs/ARCHITECTURAL-FOUNDATIONS.md`
      # breaks two links and matches none of `docs/ns/**`, `docs/applications/**`,
      # `tools/**`, `packages/**`, `applications/_shared/**` or the five named markdown
      # files, so the gate that catches it would never have started. Verified by deleting
      # that file: the linter reports both breaks correctly — it simply was not run.
      #
      # A link gate cannot live behind a path filter over the linking side, so it moved to
      # `lint.yml`, the one push/PR workflow with no `paths:` at all — beside the
      # conformance runner, which is there for the same reason.
