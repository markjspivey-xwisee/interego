name: Client signature live check

# Explicitly isolated synthetic accounts. No real release or user key is used.
on:
  workflow_dispatch:
    inputs:
      expected_build:
        description: Optional exact relay build SHA to require
        type: string
        required: false
  # Called after auto-deploy succeeds. Running a new live test before its server
  # code is deployed would test the old build and deadlock the pre-deploy CI gate.
  workflow_call:
    inputs:
      expected_build:
        description: Optional exact relay build SHA to require
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  live-client-signatures:
    name: Submitter and two reviewer processes complete a synthetic approval test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
      - name: Verify registered keys, signatures, CAS and replay on the live services
        env:
          INTEREGO_LIVE_CANARY: '1'
          EXPECTED_RELAY_BUILD: ${{ inputs.expected_build || '' }}
        run: node --import tsx tools/client-signature-canary.mjs
      - name: Install Chromium for live passkey signing
        run: npx playwright install --with-deps chromium
      - name: Verify the deployed passkey page and OAuth identity renewal
        working-directory: deploy/mcp-relay
        env:
          BASE_URL: ${{ vars.RELAY_PUBLIC_URL || 'https://relay.interego.xwisee.com' }}
          IDENTITY_URL: ${{ vars.IDENTITY_PUBLIC_URL || 'https://identity.interego.xwisee.com' }}
          CI: '1'
        run: npx playwright test --reporter=list --retries=0
      - name: Preserve live browser failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-signature-browser-failure-context
          path: deploy/mcp-relay/test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve the public synthetic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-signature-live-result
          path: ${{ runner.temp }}/client-signature-live.json
          if-no-files-found: warn
