name: pgsl-store PostgreSQL integration

# Proves the ENTIRE PGSL store stack runs over the Postgres FdbLike adapter — the
# budget-fitting managed backend (Azure Postgres Burstable ~$12-25/mo or free
# Neon/Supabase; runs on the existing ACA topology, no AKS). node-postgres is
# pure JS, so a Postgres service container is all that's needed (no native FDB).

on:
  push:
    paths:
      - 'packages/pgsl-store/**'
      - 'tests/pgsl-store-pg-integration.test.ts'
      - '.github/workflows/pgsl-store-pg.yml'
      # The engagement compare-and-swap is pinned in the test above and its SUBJECT lives
      # here. Without this line a change to engagement-store.ts would not run the only job
      # that can observe a Postgres isolation level, and the guard would be checked only
      # when some unrelated pgsl-store file happened to move.
      - 'deploy/mcp-relay/engagement-store.ts'
  workflow_dispatch:

jobs:
  pg-integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgsl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install workspace + build the @interego deps the barrel imports
        run: |
          npm ci
          # ★ FULL workspace build, not a two-package subset. The typecheck gate now runs
          # from vitest's globalSetup, so it runs in THIS job too — and it typechecks the
          # whole `tsconfig.check.json` program, which reaches `@interego/solid` through
          # `applications/_shared`. Building only core+abac left that unresolvable and the
          # gate failed with `TS2307: Cannot find module '@interego/solid'` — a real gap in
          # the job, not in the code: a typecheck that cannot resolve workspace packages is
          # not a typecheck. Cheaper to build everything than to teach the gate to be
          # partially blind, which is how a gate stops meaning anything.
          npm run build
      - name: Install node-postgres (pure JS)
        run: npm install --no-save pg@8
      - name: Run the FULL pgsl-store stack against real Postgres
        env:
          PGSL_PG_IT: '1'
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pgsl
        run: npx vitest run tests/pgsl-store-pg-integration.test.ts
