name: Delegation subject binding

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/mcp-relay/delegation-subject.ts'
      - 'deploy/mcp-relay/session-actor.ts'
      - 'deploy/mcp-relay/server.ts'
      - 'deploy/mcp-relay/tests/delegation-subject.test.ts'
      - '.github/workflows/delegation-subject.yml'
permissions:
  contents: read
jobs:
  verified-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx tsx deploy/mcp-relay/tests/delegation-subject.test.ts
