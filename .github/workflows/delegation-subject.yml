name: Delegation subject binding

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/mcp-relay/delegation-subject.ts'
      - 'deploy/mcp-relay/session-actor.ts'
      - 'deploy/mcp-relay/server.ts'
      - 'deploy/mcp-relay/tests/delegation-subject.test.ts'
      - '.github/workflows/delegation-subject.yml'
permissions:
  contents: read
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verified-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx tsx deploy/mcp-relay/tests/delegation-subject.test.ts
