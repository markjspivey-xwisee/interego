# Build & push service images to GitHub Container Registry.
#
# REPLACES the retired Azure pipeline (deploy-azure.yml). The stack moved to
# Railway and the Azure Container Registry `contextgraphsacr` was DELETED, so
# that workflow can no longer push anywhere. Images now live at
# ghcr.io/<owner>/<image> and Railway pulls them from there with a read:packages
# token.
#
# Auth is the workflow's own GITHUB_TOKEN (packages: write) — no PAT, nothing to
# rotate, nothing to leak.
#
# ★ THAT SENTENCE WAS FALSE FOR MONTHS BEFORE IT WAS TRUE, so it is worth saying
# how it became true rather than leaving a reassuring line nobody can check.
#
# It sat here while the login step forty lines down said the opposite in its own
# comment. The two disagreed, and the reassuring one was at the top — so it was
# the one people read. On 2026-08-11 the PAT it denied the existence of expired
# and took the entire deploy path down: no image could be pushed, and Railway,
# which stores its own per-service copy of the same credential, could not PULL
# either.
#
# What made it true is a one-time grant OUTSIDE this repository: all sixteen
# `interego-*` packages now give this repo the Write role under their own
# "Manage Actions access". Verified by pushing with no PAT present — see the
# login step for the run ids and for what to do if a NEW package 403s.
#
# Note the packages still report `repository: null` over the API; that field is
# the "Connect repository" association, which is a DIFFERENT setting from the
# Actions-access grant and is not evidence either way.
#
# Usage:
#   gh workflow run build-ghcr.yml -f image=interego-relay     # one image
#   gh workflow run build-ghcr.yml                             # all images
name: Build & push to GHCR

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (leave blank to build all)'
        required: false
        default: ''
  # Callable so auto-deploy.yml can build exactly the legs it is about to deploy, through THIS
  # workflow rather than a copy of it. A second build path is where two build recipes drift, and
  # the one that drifts is always the one nobody dispatches by hand.
  workflow_call:
    inputs:
      image:
        description: 'Single image to build (leave blank to build all)'
        required: false
        default: ''
        type: string

jobs:
  # A build that matched no image reported SUCCESS having built nothing.
  # `-f image=foxxi-bridge` (the service name) instead of `interego-foxxi-bridge`
  # (the image name) skipped all thirteen legs and went green, so the next step —
  # pinning Railway to the "new" tag — would have deployed the previous image
  # while every signal said the build had succeeded. A dispatch that does nothing
  # must fail, and it must say what the valid names are.
  validate-input:
    name: "Requested image must exist (a no-op build must not report success)"
    runs-on: ubuntu-latest
    outputs:
      # ★ THE LEGS TO RUN, not just a yes/no. See the note on the step below.
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the requested image, and compute the legs to run
        # ── ★★ WHY THIS EMITS A MATRIX AND NOT ONLY A VERDICT ──────────────────
        #
        # The per-leg skip further down is a step-level `if:`, and GitHub downloads a job's actions
        # during "Set up job" — BEFORE any step runs. So a dispatch for ONE image still started
        # sixteen runners and pulled docker/setup-buildx-action sixteen times, then skipped fifteen
        # builds. MEASURED: repeated single-service deploys in one session earned 429 Too Many
        # Requests from codeload and failed five builds that had nothing wrong with them.
        #
        # A job-level `if:` cannot fix it — the `matrix` context is not available there, and trying
        # made the workflow unparseable. Computing the matrix here is what works: one requested
        # image expands to ONE leg, so no other runner starts and no other download happens.
        #
        # ★ AND THE LIST LIVES IN deploy/images.json, read by one script. This step used to parse
        # THIS FILE with sed to check a name against the matrix below it — a guard whose own
        # matcher had already failed once (an unanchored grep let `.*` validate and every leg then
        # skipped, green, having built nothing). One file, one reader, nothing to drift.
        id: plan
        # Through the environment and then as a single argv, never interpolated into a script body:
        # the dispatch input is arbitrary text.
        env:
          REQ: ${{ inputs.image }}
        run: |
          legs=$(node tools/ci-image-matrix.mjs "$REQ") || exit 1
          echo "matrix=$legs" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: validate-input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Where a `seed: i2idlx-upper` leg fills the verified sources that it pushes as the seed image,
      # or passes as the `upper-seed` build context when it cannot (see "seed: i2idlx-upper" below).
      # It is inside the i2idlx .cache, which /.dockerignore excludes, so the main context never
      # carries it into bridge-base.
      UPPER_SEED_DIR: applications/foxxi-content-intelligence/i2idlx/.cache/upper-seed
    strategy:
      fail-fast: false
      # ★ FROM deploy/images.json VIA validate-input — see the note there. An inline list here
      # would be a second copy of the same facts, and a dispatch filter could not shrink it.
      matrix:
        include: ${{ fromJSON(needs.validate-input.outputs.matrix) }}
    steps:
      - name: Should this matrix leg run?
        id: gate
        # Same reason as validate-input: the dispatch input reaches the script as data.
        # (`matrix.image` is read out of this file, so it is not untrusted the same way.)
        env:
          REQ: ${{ inputs.image }}
        run: |
          req="$REQ"
          if [ -n "$req" ] && [ "$req" != '${{ matrix.image }}' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.image }} (only building $req)"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.skip != 'true'

      # Only interego-css-pgsl needs this. Its Dockerfile COPYs
      # `packages/pgsl-store/dist` straight out of the context instead of compiling
      # it in a build stage, because the accessor has to be assembled in a tree with
      # no monorepo root above it: the repo-root node_modules carries componentsjs@6
      # (via @comunica) and CSS 7.1.9 needs componentsjs@5, so a build stage that ran
      # `npm ci` at the repo root inside the image would load the wrong one at
      # runtime. `dist` is gitignored, so a fresh checkout does not have it.
      #
      # The three builds are exactly the recipe pgsl-css-server.yml already proves
      # green against a real Postgres — @interego/pgsl-store's own build needs core
      # and abac compiled first. Kept in step with that workflow deliberately: two
      # different recipes for the same artifact is how a CI-green image turns out not
      # to be the image the tests exercised.
      # ── prebuild: dist ─────────────────────────────────────────────────────────────────────
      # The bridges' recipes build @interego/* inside the image, a minute that the pull request's
      # job had already spent on the same sources. The built packages are restored here from the
      # cache that job saved (a master run reads the default branch's caches) and travel into the
      # context, where the Dockerfile skips its build when PREBUILT=1 finds them. A change under
      # packages/ misses the cache and builds once here, for every leg, and is then cached.
      - name: Restore the built packages, or build them once
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'dist'
        uses: actions/setup-node@v6
        with: { node-version: '20', cache: npm }
      - uses: actions/cache@v5
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'dist'
        id: dist
        with:
          path: packages/*/dist
          key: dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
      # Name first, then the gate: tools/deploy-bundle-scope.ts reads a gated step by its `if:`
      # line and follows `npm run build` through the root scripts to the workspaces it chains.
      - name: Build the packages when nothing is cached
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'dist' && steps.dist.outputs.cache-hit != 'true'
        run: npm ci && npm run build
      - name: Pre-build the workspace dist this image's Dockerfile expects in the context
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Build @interego/pgsl-store dist
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        run: |
          npm ci
          npm run build --workspace @interego/core
          npm run build --workspace @interego/abac
          npm run build --workspace @interego/pgsl-store
          # A missing dist would otherwise surface as an opaque COPY failure inside
          # buildx. Say which artifact is absent, here, where the recipe is.
          test -d packages/pgsl-store/dist \
            || { echo "::error::packages/pgsl-store/dist was not produced — the CSS image cannot be built without it"; exit 1; }
          # The dist existing on the RUNNER is not the same as it reaching the build
          # CONTEXT. The root .dockerignore lists `dist`, and Docker matches a
          # separator-free pattern against the whole relative path — `dist` is the
          # top-level directory only, which is why that same file has to spell
          # `node_modules` and `**/node_modules` separately. So this should arrive.
          # If it does not, the leg dies on `COPY packages/pgsl-store/dist` with "no
          # source files", and the fix is one line in /.dockerignore:
          #   !packages/pgsl-store/dist
          # Recorded here rather than pre-emptively applied: changing the root
          # ignore file changes the context of all fourteen images, and that is not
          # a thing to do on a hunch about a pattern-matcher.

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      # ★ NO PAT. The repository pushes as ITSELF, with a token minted per run that cannot expire.
      #
      # ── HOW THIS GOT HERE, BECAUSE THE HISTORY IS THE WARNING ────────────────────
      #
      # GITHUB_TOKEN can only write packages that GRANT this repository access. These were created
      # by `crane` during the ACR->GHCR migration, outside any repo, so it got a 403 on push and a
      # `write:packages` PAT (GHCR_TOKEN) was used instead. This comment then claimed the
      # `org.opencontainers.image.source` label "connects each package on first push, after which
      # GITHUB_TOKEN suffices and the secret can be deleted" — and nobody acted on it for months.
      #
      # MEASURED 2026-08-11, all three claims, in order:
      #
      #   1. The PAT (set 2026-07-12) EXPIRED and took the whole deploy path down. Every build
      #      failed here with `Get "https://ghcr.io/v2/": denied: denied`, before a layer was built.
      #      Worse, it gates TWO things: Railway stores its own per-service copy to PULL with, so
      #      redeploys failed separately with "never resolved to a digest" and empty logs.
      #   2. The label claim was FALSE. Switching to GITHUB_TOKEN (run 31509074883) got past login
      #      — the build reached `[build 33/38] RUN npm ci` — and then died on the push with
      #      `403 Forbidden`. The label does not retroactively grant a repository access to a
      #      package created outside it, however many times it is pushed.
      #   3. Granting it explicitly DOES work. All sixteen `interego-*` packages were given this
      #      repository the Write role under "Manage Actions access", and run 31531305564 pushed
      #      `interego-discord:d5cc893f…` as the repository with no PAT in the workflow at all.
      #
      # ── WHY THE PAT IS NOT KEPT AS A FALLBACK ────────────────────────────────────
      #
      # It cannot act as one. `secrets.X || secrets.Y` picks whichever is NON-EMPTY, not whichever
      # still works — so a stale PAT does not fall back to anything, it just fails, which is
      # precisely what happened. A credential that can only ever mask this one is worse than none.
      #
      # ★ IF A NEW PACKAGE 403s ON ITS FIRST PUSH, that is this same story starting again: a
      # package created outside the repo has no grant. Add the repo under its "Manage Actions
      # access" with the Write role. Do NOT reintroduce a PAT — that is how this became a
      # scheduled outage nobody was watching.
      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── seed: i2idlx-upper ─────────────────────────────────────────────────────────────────────
      # The Foxxi image's i2idlx-builder stage restores the 21 sources (upper ontologies, Interego
      # namespace files, JSON-LD contexts) that its evidence/upper/manifest.json pins by SHA-256, and
      # until now it fetched every one from its publisher every time the stage ran, which is every
      # build that changed what the bridge copies (the registry layer cache serves the others):
      # purl.obolibrary.org, ontologydesignpatterns.org, w3.org, dublincore.org, purl.org,
      # data.europa.eu, purl.imsglobal.org, GitHub Pages and raw.githubusercontent.com. On
      # 2026-10-27 data.europa.eu timed out on ESCO (four attempts in under a minute), this leg
      # failed, and auto-deploy, which is all-or-nothing, deployed no service; a re-run of the failed
      # jobs succeeded. On 2026-10-26 gUFO's persistent URL changing its bytes had held back every
      # deploy the same way.
      #
      # So the leg hands the Dockerfile the verified sources as its `upper-seed` stage. MEASURED
      # 2026-10-27, off a runner: all 21 verified, 6.6 MB (6,632,249 bytes), and with them in
      # .cache/upper, prepare-build-inputs.ts ran in a network namespace whose only interface is a
      # loopback that is down (unshare -n; the ROBOT jar it also checks comes earlier, from
      # prepare-source.ts).
      #
      # ★ THE SEED'S DURABLE COPY IS AN IMAGE IN THIS LEG'S OWN PACKAGE, BESIDE :buildcache. The
      # Dockerfile's COPY of the seed makes its bytes part of the layer-cache key of every step
      # after it in i2idlx-builder: the seed step, prepare-build-inputs.ts, build.ts (which reads
      # gate.interego.xwisee.com) and the output check. Before the seed, a build whose bridge-base
      # had not changed (a change to this file beyond its comments rebuilds every leg, and so does a
      # dispatch of every image) took that whole stage from the layer cache and fetched nothing.
      # Kept only in the Actions cache, the seed would make that build worse than no seed: after an
      # eviction (seven days unused) or a cache-service outage it is filled from the publishers
      # again, and with one of them down it differs from the cached build's, so the steps after the
      # COPY run again, fetch that source live from the host that has just failed, and fail the leg
      # where the layer cache used to pass it (measured below). The registry is as durable as the
      # layer cache the seed has to agree with, and a build cannot push or read its layer cache
      # without the registry anyway.
      #
      # So a complete seed is pushed once as a FROM scratch image of just those files, tagged
      # upper-seed-<hashFiles of the manifest>, since the manifest's keys and pins alone decide its
      # bytes. A build that finds the tag passes it as docker-image://, the same bytes for those pins
      # every time, and fetches nothing from a publisher. A build that does not find it (the first
      # build of new pins, whose bridge-base changes anyway because the manifest is in it) fills the
      # directory, starting from the newest seed in the Actions cache so that a re-pin fetches only
      # what changed, pushes the image when every pin verified, and passes the image, or the
      # directory when the set is incomplete. The Actions cache is restored on every build, image
      # or not, only so that its entry is not evicted between re-pins.
      #
      # MEASURED 2026-10-27 with docker buildx 0.38 against a local registry (docker-container
      # driver, registry cache at mode=max, the builder pruned before every build so that only the
      # registry cache carried over, and these steps' own run blocks taken from this file). With the
      # image as the context, a second build reported every step of the stage CACHED, including when
      # the directory beside it held 20 of the 21 files. With that directory as the context and no
      # image, the COPY and every step after it ran again, and the prepare-build-inputs.ts stand-in,
      # under --network=none, stopped at "would fetch esco live". A directory and an image with the
      # same bytes are not the same cache key: switching from one to the other re-ran the COPY and
      # the steps after it, though not the clone. That is why a build that has just pushed the image
      # passes the image and not the directory it pushed from. The pushed image was one OCI manifest
      # with one layer holding exactly the 21 files, each 0644 and root-owned.
      #
      # The seed never fails the leg: every step continues on error. A source the script cannot
      # get, or whose bytes are not the pin, is named in a warning and left out, and the image build
      # fetches it live as it always did. Neither the image nor the Actions cache is written from a
      # partial set. And nothing is trusted for having been kept: refresh-upper.ts checks each file
      # against the manifest's SHA-256 inside the build, as it checks a fresh fetch.
      - name: Look for the seed image of these pins
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper'
        id: upper-seed-image
        continue-on-error: true
        timeout-minutes: 2
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:upper-seed-${{ hashFiles('applications/foxxi-content-intelligence/i2idlx/evidence/upper/manifest.json') }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$REF is in the registry; the build reads the seed from it"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "$REF is not in the registry, or could not be read; the seed is filled on this runner"
          fi
      - name: Restore the verified upper-ontology sources the Foxxi build reads
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper'
        id: upper-seed
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.UPPER_SEED_DIR }}
          key: i2idlx-upper-seed-${{ hashFiles('applications/foxxi-content-intelligence/i2idlx/evidence/upper/manifest.json', 'applications/foxxi-content-intelligence/i2idlx/typescript/refresh-upper-data.json', 'applications/foxxi-content-intelligence/i2idlx/tools/seed-pinned-upper.mjs') }}
          restore-keys: i2idlx-upper-seed-
      - name: Fetch and verify every pinned source the cache does not hold
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper' && steps.upper-seed-image.outputs.found != 'true'
        id: upper-seed-fill
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$UPPER_SEED_DIR"
          node applications/foxxi-content-intelligence/i2idlx/tools/seed-pinned-upper.mjs \
            applications/foxxi-content-intelligence/i2idlx --all "$UPPER_SEED_DIR"
      # FROM scratch with the directory as its one layer: the image holds the seed's files and
      # nothing else, which is what replaces the Dockerfile's empty upper-seed stage. No provenance
      # attestation, so the tag is one image manifest and not an index.
      - name: Push the seed as an image, only when every pinned source verified
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper' && steps.upper-seed-image.outputs.found != 'true' && steps.upper-seed-fill.outputs.complete == 'true'
        id: upper-seed-push
        continue-on-error: true
        timeout-minutes: 5
        env:
          REF: ${{ steps.upper-seed-image.outputs.ref }}
        run: |
          printf 'FROM scratch\nCOPY . /\n' | docker buildx build --provenance=false --push -t "$REF" -f - "$UPPER_SEED_DIR"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Save the seed, only when every pinned source verified
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper' && steps.upper-seed-image.outputs.found != 'true' && steps.upper-seed.outputs.cache-hit != 'true' && steps.upper-seed-fill.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.UPPER_SEED_DIR }}
          key: ${{ steps.upper-seed.outputs.cache-primary-key }}
      # The image whenever the registry has it, the directory only when it does not. mkdir: buildx
      # refuses a named context that does not exist, so the directory must be there even when the
      # fill never ran.
      - name: Choose what the build reads as its upper-seed stage
        if: steps.gate.outputs.skip != 'true' && matrix.seed == 'i2idlx-upper'
        id: upper-seed-context
        continue-on-error: true
        env:
          REF: ${{ steps.upper-seed-image.outputs.ref }}
          IN_REGISTRY: ${{ steps.upper-seed-image.outputs.found == 'true' || steps.upper-seed-push.outputs.pushed == 'true' }}
        run: |
          if [ "$IN_REGISTRY" = true ] && [ -n "$REF" ]; then
            echo "context=upper-seed=docker-image://$REF" >> "$GITHUB_OUTPUT"
            echo "the build reads the seed from $REF"
          else
            mkdir -p "$UPPER_SEED_DIR"
            echo "context=upper-seed=$UPPER_SEED_DIR" >> "$GITHUB_OUTPUT"
            echo "the build reads the seed from $UPPER_SEED_DIR: $(find "$UPPER_SEED_DIR" -name '*.source' | wc -l) files"
          fi

      - name: Build & push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          # Repo root for every image, including interego-css-pgsl, whose Dockerfile
          # header describes a "deployment-shaped tree assembled by the deploy
          # script". That constraint is about the shape of the IMAGE, not of the
          # context: its COPYs name three context paths (plus `docker-entrypoint.sh`,
          # which sits inside the third), and the build stage
          # writes its own root package.json, so the tree inside the image is the same
          # clean one either way. The root .dockerignore already drops node_modules at
          # every level, which is the part that would actually poison it.
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # A named context only for a `seed: i2idlx-upper` leg: `upper-seed=` the seed image or
          # the directory, as the step that chooses it says, which replaces the Foxxi Dockerfile's
          # empty `upper-seed` stage. That step runs on no other leg, so every other leg gets an
          # empty value, which build-push-action treats as none, and its build is unchanged.
          build-contexts: ${{ steps.upper-seed-context.outputs.context }}
          push: true
          # Empty for images without a build_args field; docker/build-push-action
          # treats an empty build-args as none.
          # GIT_SHA is appended to every image's build-args so the runtime can
          # report which commit it is running (relay surfaces it at /health).
          # That is what lets a deploy be VERIFIED instead of assumed — see
          # tools/railway-redeploy.mjs. Dockerfiles that ignore the arg are
          # unaffected; an unused ARG is not an error.
          build-args: |
            ${{ matrix.build_args }}
            GIT_SHA=${{ github.sha }}
            PREBUILT=${{ matrix.prebuild == 'dist' && '1' || '0' }}
          # Immutable sha tag is what Railway pins to; :latest is for humans.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          # image.source is what connects the package to the repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layers cached in the registry as well as in the Actions cache: eighteen images at
          # mode=max blow through the ten-gigabyte Actions cache and the npm ci layer missed on
          # every build (a minute each, measured 2026-09-22). The registry keeps each image's
          # cache beside it with no such limit.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      - name: Image pushed
        if: steps.gate.outputs.skip != 'true'
        run: echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
