# Build & push service images to GitHub Container Registry.
#
# REPLACES the retired Azure pipeline (deploy-azure.yml). The stack moved to
# Railway and the Azure Container Registry `contextgraphsacr` was DELETED, so
# that workflow can no longer push anywhere. Images now live at
# ghcr.io/<owner>/<image> and Railway pulls them from there with a read:packages
# token.
#
# Auth is the workflow's own GITHUB_TOKEN (packages: write) — no PAT, nothing to
# rotate, nothing to leak.
#
# ★ THAT SENTENCE WAS FALSE FOR MONTHS BEFORE IT WAS TRUE, so it is worth saying
# how it became true rather than leaving a reassuring line nobody can check.
#
# It sat here while the login step forty lines down said the opposite in its own
# comment. The two disagreed, and the reassuring one was at the top — so it was
# the one people read. On 2026-08-11 the PAT it denied the existence of expired
# and took the entire deploy path down: no image could be pushed, and Railway,
# which stores its own per-service copy of the same credential, could not PULL
# either.
#
# What made it true is a one-time grant OUTSIDE this repository: all sixteen
# `interego-*` packages now give this repo the Write role under their own
# "Manage Actions access". Verified by pushing with no PAT present — see the
# login step for the run ids and for what to do if a NEW package 403s.
#
# Note the packages still report `repository: null` over the API; that field is
# the "Connect repository" association, which is a DIFFERENT setting from the
# Actions-access grant and is not evidence either way.
#
# Usage:
#   gh workflow run build-ghcr.yml -f image=interego-relay     # one image
#   gh workflow run build-ghcr.yml                             # all images
name: Build & push to GHCR

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (leave blank to build all)'
        required: false
        default: ''

jobs:
  # A build that matched no image reported SUCCESS having built nothing.
  # `-f image=foxxi-bridge` (the service name) instead of `interego-foxxi-bridge`
  # (the image name) skipped all thirteen legs and went green, so the next step —
  # pinning Railway to the "new" tag — would have deployed the previous image
  # while every signal said the build had succeeded. A dispatch that does nothing
  # must fail, and it must say what the valid names are.
  validate-input:
    name: "Requested image must exist (a no-op build must not report success)"
    runs-on: ubuntu-latest
    outputs:
      # ★ THE LEGS TO RUN, not just a yes/no. See the note on the step below.
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the requested image, and compute the legs to run
        # ── ★★ WHY THIS EMITS A MATRIX AND NOT ONLY A VERDICT ──────────────────
        #
        # The per-leg skip further down is a step-level `if:`, and GitHub downloads a job's actions
        # during "Set up job" — BEFORE any step runs. So a dispatch for ONE image still started
        # sixteen runners and pulled docker/setup-buildx-action sixteen times, then skipped fifteen
        # builds. MEASURED: repeated single-service deploys in one session earned 429 Too Many
        # Requests from codeload and failed five builds that had nothing wrong with them.
        #
        # A job-level `if:` cannot fix it — the `matrix` context is not available there, and trying
        # made the workflow unparseable. Computing the matrix here is what works: one requested
        # image expands to ONE leg, so no other runner starts and no other download happens.
        #
        # ★ AND THE LIST LIVES IN deploy/images.json, read by one script. This step used to parse
        # THIS FILE with sed to check a name against the matrix below it — a guard whose own
        # matcher had already failed once (an unanchored grep let `.*` validate and every leg then
        # skipped, green, having built nothing). One file, one reader, nothing to drift.
        id: plan
        # Through the environment and then as a single argv, never interpolated into a script body:
        # the dispatch input is arbitrary text.
        env:
          REQ: ${{ inputs.image }}
        run: |
          legs=$(node tools/ci-image-matrix.mjs "$REQ") || exit 1
          echo "matrix=$legs" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: validate-input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ★ FROM deploy/images.json VIA validate-input — see the note there. An inline list here
      # would be a second copy of the same facts, and a dispatch filter could not shrink it.
      matrix:
        include: ${{ fromJSON(needs.validate-input.outputs.matrix) }}
    steps:
      - name: Should this matrix leg run?
        id: gate
        # Same reason as validate-input: the dispatch input reaches the script as data.
        # (`matrix.image` is read out of this file, so it is not untrusted the same way.)
        env:
          REQ: ${{ inputs.image }}
        run: |
          req="$REQ"
          if [ -n "$req" ] && [ "$req" != '${{ matrix.image }}' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.image }} (only building $req)"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      # Only interego-css-pgsl needs this. Its Dockerfile COPYs
      # `packages/pgsl-store/dist` straight out of the context instead of compiling
      # it in a build stage, because the accessor has to be assembled in a tree with
      # no monorepo root above it: the repo-root node_modules carries componentsjs@6
      # (via @comunica) and CSS 7.1.9 needs componentsjs@5, so a build stage that ran
      # `npm ci` at the repo root inside the image would load the wrong one at
      # runtime. `dist` is gitignored, so a fresh checkout does not have it.
      #
      # The three builds are exactly the recipe pgsl-css-server.yml already proves
      # green against a real Postgres — @interego/pgsl-store's own build needs core
      # and abac compiled first. Kept in step with that workflow deliberately: two
      # different recipes for the same artifact is how a CI-green image turns out not
      # to be the image the tests exercised.
      - name: Pre-build the workspace dist this image's Dockerfile expects in the context
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build @interego/pgsl-store dist
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        run: |
          npm ci
          npm run build --workspace @interego/core
          npm run build --workspace @interego/abac
          npm run build --workspace @interego/pgsl-store
          # A missing dist would otherwise surface as an opaque COPY failure inside
          # buildx. Say which artifact is absent, here, where the recipe is.
          test -d packages/pgsl-store/dist \
            || { echo "::error::packages/pgsl-store/dist was not produced — the CSS image cannot be built without it"; exit 1; }
          # The dist existing on the RUNNER is not the same as it reaching the build
          # CONTEXT. The root .dockerignore lists `dist`, and Docker matches a
          # separator-free pattern against the whole relative path — `dist` is the
          # top-level directory only, which is why that same file has to spell
          # `node_modules` and `**/node_modules` separately. So this should arrive.
          # If it does not, the leg dies on `COPY packages/pgsl-store/dist` with "no
          # source files", and the fix is one line in /.dockerignore:
          #   !packages/pgsl-store/dist
          # Recorded here rather than pre-emptively applied: changing the root
          # ignore file changes the context of all fourteen images, and that is not
          # a thing to do on a hunch about a pattern-matcher.

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      # ★ NO PAT. The repository pushes as ITSELF, with a token minted per run that cannot expire.
      #
      # ── HOW THIS GOT HERE, BECAUSE THE HISTORY IS THE WARNING ────────────────────
      #
      # GITHUB_TOKEN can only write packages that GRANT this repository access. These were created
      # by `crane` during the ACR->GHCR migration, outside any repo, so it got a 403 on push and a
      # `write:packages` PAT (GHCR_TOKEN) was used instead. This comment then claimed the
      # `org.opencontainers.image.source` label "connects each package on first push, after which
      # GITHUB_TOKEN suffices and the secret can be deleted" — and nobody acted on it for months.
      #
      # MEASURED 2026-08-11, all three claims, in order:
      #
      #   1. The PAT (set 2026-07-12) EXPIRED and took the whole deploy path down. Every build
      #      failed here with `Get "https://ghcr.io/v2/": denied: denied`, before a layer was built.
      #      Worse, it gates TWO things: Railway stores its own per-service copy to PULL with, so
      #      redeploys failed separately with "never resolved to a digest" and empty logs.
      #   2. The label claim was FALSE. Switching to GITHUB_TOKEN (run 31509074883) got past login
      #      — the build reached `[build 33/38] RUN npm ci` — and then died on the push with
      #      `403 Forbidden`. The label does not retroactively grant a repository access to a
      #      package created outside it, however many times it is pushed.
      #   3. Granting it explicitly DOES work. All sixteen `interego-*` packages were given this
      #      repository the Write role under "Manage Actions access", and run 31531305564 pushed
      #      `interego-discord:d5cc893f…` as the repository with no PAT in the workflow at all.
      #
      # ── WHY THE PAT IS NOT KEPT AS A FALLBACK ────────────────────────────────────
      #
      # It cannot act as one. `secrets.X || secrets.Y` picks whichever is NON-EMPTY, not whichever
      # still works — so a stale PAT does not fall back to anything, it just fails, which is
      # precisely what happened. A credential that can only ever mask this one is worse than none.
      #
      # ★ IF A NEW PACKAGE 403s ON ITS FIRST PUSH, that is this same story starting again: a
      # package created outside the repo has no grant. Add the repo under its "Manage Actions
      # access" with the Write role. Do NOT reintroduce a PAT — that is how this became a
      # scheduled outage nobody was watching.
      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          # Repo root for every image, including interego-css-pgsl, whose Dockerfile
          # header describes a "deployment-shaped tree assembled by the deploy
          # script". That constraint is about the shape of the IMAGE, not of the
          # context: its COPYs name three context paths (plus `docker-entrypoint.sh`,
          # which sits inside the third), and the build stage
          # writes its own root package.json, so the tree inside the image is the same
          # clean one either way. The root .dockerignore already drops node_modules at
          # every level, which is the part that would actually poison it.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Empty for images without a build_args field; docker/build-push-action
          # treats an empty build-args as none.
          # GIT_SHA is appended to every image's build-args so the runtime can
          # report which commit it is running (relay surfaces it at /health).
          # That is what lets a deploy be VERIFIED instead of assumed — see
          # tools/railway-redeploy.mjs. Dockerfiles that ignore the arg are
          # unaffected; an unused ARG is not an error.
          build-args: |
            ${{ matrix.build_args }}
            GIT_SHA=${{ github.sha }}
          # Immutable sha tag is what Railway pins to; :latest is for humans.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          # image.source is what connects the package to the repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        if: steps.gate.outputs.skip != 'true'
        run: echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
