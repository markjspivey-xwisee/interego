# Build & push service images to GitHub Container Registry.
#
# REPLACES the retired Azure pipeline (deploy-azure.yml). The stack moved to
# Railway and the Azure Container Registry `contextgraphsacr` was DELETED, so
# that workflow can no longer push anywhere. Images now live at
# ghcr.io/<owner>/<image> and Railway pulls them from there with a read:packages
# token.
#
# Auth is the workflow's own GITHUB_TOKEN (packages: write) — no PAT, nothing to
# rotate, nothing to leak.
#
# Usage:
#   gh workflow run build-ghcr.yml -f image=interego-relay     # one image
#   gh workflow run build-ghcr.yml                             # all images
name: Build & push to GHCR

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Single image to build (leave blank to build all)'
        required: false
        default: ''

jobs:
  # A build that matched no image reported SUCCESS having built nothing.
  # `-f image=foxxi-bridge` (the service name) instead of `interego-foxxi-bridge`
  # (the image name) skipped all thirteen legs and went green, so the next step —
  # pinning Railway to the "new" tag — would have deployed the previous image
  # while every signal said the build had succeeded. A dispatch that does nothing
  # must fail, and it must say what the valid names are.
  validate-input:
    name: "Requested image must exist (a no-op build must not report success)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the requested image against the matrix
        # Through the environment, not `${{ }}` interpolated into the script body.
        # The dispatch input is arbitrary text; pasted straight into `req='…'` a value
        # containing a single quote closes the string and the rest runs as shell.
        env:
          REQ: ${{ inputs.image }}
        run: |
          req="$REQ"
          [ -z "$req" ] && { echo "no image requested — building all"; exit 0; }
          # Read the names out of this file so the check cannot drift from the matrix.
          # sed, not `grep -oP`: PCRE mode aborts under a non-UTF-8 locale, and a
          # guard that errors out is a guard that silently stops guarding.
          known=$(sed -n 's/^[[:space:]]*- {[[:space:]]*image:[[:space:]]*\([a-z0-9-]*\).*/\1/p' .github/workflows/build-ghcr.yml)
          [ -n "$known" ] || { echo "::error::could not read the image matrix"; exit 1; }
          # -F, because without it this guard did not hold. `grep -qx "$req"` treats the
          # request as a REGULAR EXPRESSION, so `-f image='.*'` matched every line of the
          # list and passed validation — and the per-leg gate below is a literal `!=`
          # string comparison, so all fourteen legs then skipped and the run went green
          # having built nothing. That is precisely the failure this job was added to
          # prevent, reintroduced by the matcher underneath it. The request must be
          # compared as the literal image name it is.
          if printf '%s\n' "$known" | grep -qxF "$req"; then
            echo "ok — '$req' is a known image"
          else
            echo "::error::unknown image '$req' — nothing would be built. Valid images:"
            printf '  %s\n' $known
            exit 1
          fi

  build:
    name: ${{ matrix.image }}
    needs: validate-input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `build_args` (optional): the Vite SPAs bake their bridge's PUBLIC URL
          # at build time via a REQUIRED build-arg (the Dockerfile `test -n` guards
          # it), so a build with no arg hard-fails. The retired deploy-azure.yml
          # resolved these from Azure; now the custom domains are stable, so they
          # are pinned here. They are public browser-facing URLs, not secrets.
          - { image: interego-relay,              dockerfile: deploy/Dockerfile.relay }
          - { image: interego-identity,           dockerfile: deploy/Dockerfile.identity }
          - { image: interego-css-gate,           dockerfile: deploy/Dockerfile.css-gate }
          - { image: interego-foxxi-bridge,       dockerfile: deploy/Dockerfile.foxxi-bridge }
          - { image: interego-wsp-bridge,         dockerfile: deploy/Dockerfile.wsp-bridge }
          - { image: interego-bridge,             dockerfile: deploy/Dockerfile.interego-bridge }
          - { image: interego-dashboard,          dockerfile: deploy/Dockerfile.dashboard }
          - { image: interego-pgsl-browser,       dockerfile: deploy/Dockerfile.pgsl-browser }
          - { image: interego-microsite,          dockerfile: deploy/Dockerfile.interego-microsite, build_args: "VITE_INTEREGO_BRIDGE_URL=https://bridge.interego.xwisee.com" }
          - { image: interego-main,               dockerfile: deploy/Dockerfile.interego-main }
          - { image: interego-acme-id,            dockerfile: deploy/Dockerfile.acme-id }
          - { image: interego-foxxi-dashboard,    dockerfile: deploy/Dockerfile.foxxi-dashboard, build_args: "VITE_FOXXI_BRIDGE_URL=https://foxxi-bridge.interego.xwisee.com" }
          - { image: interego-foxxi-microsite,    dockerfile: deploy/Dockerfile.foxxi-microsite, build_args: "VITE_FOXXI_BRIDGE_URL=https://foxxi-bridge.interego.xwisee.com" }
          - { image: interego-foxxi-scorm-player, dockerfile: deploy/Dockerfile.foxxi-scorm-player }
          # The shared-workspace Discord bot. A worker, not a server — it dials out to the
          # Discord gateway and the relay and holds no inbound port, so its Railway service has
          # no public domain and `tools/railway-services.mjs` records `health: null` for it.
          - { image: interego-discord,            dockerfile: deploy/Dockerfile.discord }
          # ★ THE ONE SERVICE THAT HAD NO BUILD PATH AT ALL.
          #
          # CSS ran `interego-css-pgsl:redis6` — a genuinely mutable tag. It was
          # "managed out-of-band", which in practice meant no sha-tagged image of it
          # had ever been built by anything, so the running code was identified by a
          # name that could be repointed and a rollback had nothing to roll back TO.
          # Every other service in the fleet was pinned to an immutable sha; this one
          # was pinned to a promise. This leg is what ended that, and css was pinned to
          # a commit sha on 2026-08-03 — the live pin is Railway's to state, so ask
          # `node tools/railway-pins.mjs` rather than believing this comment.
          #
          # The image name is `interego-css-pgsl`, NOT `interego-css`, while the Railway
          # service is named `css`. tools/railway-redeploy.mjs used to derive
          # `interego-${service}` and so could not deploy this service at all; the
          # mapping is now enumerated in tools/railway-services.mjs and `css` redeploys
          # like anything else. Renaming the IMAGE to match the service would orphan the
          # package that is actually deployed, so the names stay different on purpose.
          #
          # ★ A SKIPPED LEG REPORTS SUCCESS, AND FOR THIS IMAGE THAT WAS THE ONLY SIGNAL
          # ANYONE HAD. The first attempt to pin css to a sha failed because the tag had
          # never been pushed — the run it was taken from had been dispatched with
          # `-f image=interego-relay`, so the gate below skipped this leg in a step-level
          # `if` and the job still went green. Railway then failed the deploy in two
          # seconds with empty logs, which reads like a broken image rather than a
          # missing one. Before pinning ANY service, check that its leg actually built:
          # seconds of runtime means it skipped.
          #
          # `prebuild` names a workspace artifact the Dockerfile expects to ALREADY
          # EXIST in the build context: it COPYs `packages/pgsl-store/dist`, which is
          # gitignored and therefore absent from a fresh checkout. Without the step
          # below the COPY fails and the leg is red — loudly, which is the point.
          - { image: interego-css-pgsl,           dockerfile: integrations/pgsl-css-accessor/Dockerfile, prebuild: pgsl-store }

    steps:
      - name: Should this matrix leg run?
        id: gate
        # Same reason as validate-input: the dispatch input reaches the script as data.
        # (`matrix.image` is read out of this file, so it is not untrusted the same way.)
        env:
          REQ: ${{ inputs.image }}
        run: |
          req="$REQ"
          if [ -n "$req" ] && [ "$req" != '${{ matrix.image }}' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.image }} (only building $req)"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      # Only interego-css-pgsl needs this. Its Dockerfile COPYs
      # `packages/pgsl-store/dist` straight out of the context instead of compiling
      # it in a build stage, because the accessor has to be assembled in a tree with
      # no monorepo root above it: the repo-root node_modules carries componentsjs@6
      # (via @comunica) and CSS 7.1.9 needs componentsjs@5, so a build stage that ran
      # `npm ci` at the repo root inside the image would load the wrong one at
      # runtime. `dist` is gitignored, so a fresh checkout does not have it.
      #
      # The three builds are exactly the recipe pgsl-css-server.yml already proves
      # green against a real Postgres — @interego/pgsl-store's own build needs core
      # and abac compiled first. Kept in step with that workflow deliberately: two
      # different recipes for the same artifact is how a CI-green image turns out not
      # to be the image the tests exercised.
      - name: Pre-build the workspace dist this image's Dockerfile expects in the context
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build @interego/pgsl-store dist
        if: steps.gate.outputs.skip != 'true' && matrix.prebuild == 'pgsl-store'
        run: |
          npm ci
          npm run build --workspace @interego/core
          npm run build --workspace @interego/abac
          npm run build --workspace @interego/pgsl-store
          # A missing dist would otherwise surface as an opaque COPY failure inside
          # buildx. Say which artifact is absent, here, where the recipe is.
          test -d packages/pgsl-store/dist \
            || { echo "::error::packages/pgsl-store/dist was not produced — the CSS image cannot be built without it"; exit 1; }
          # The dist existing on the RUNNER is not the same as it reaching the build
          # CONTEXT. The root .dockerignore lists `dist`, and Docker matches a
          # separator-free pattern against the whole relative path — `dist` is the
          # top-level directory only, which is why that same file has to spell
          # `node_modules` and `**/node_modules` separately. So this should arrive.
          # If it does not, the leg dies on `COPY packages/pgsl-store/dist` with "no
          # source files", and the fix is one line in /.dockerignore:
          #   !packages/pgsl-store/dist
          # Recorded here rather than pre-emptively applied: changing the root
          # ignore file changes the context of all fourteen images, and that is not
          # a thing to do on a hunch about a pattern-matcher.

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      # GITHUB_TOKEN can only write packages that are CONNECTED to this repo. The images were first
      # pushed by `crane` during the ACR->GHCR migration, which created them unconnected, so
      # GITHUB_TOKEN gets a 403 on push. GHCR_TOKEN (a write:packages PAT) is the credential that
      # works.
      #
      # ★ THIS COMMENT USED TO END "the source label below connects each package on first push,
      # after which GITHUB_TOKEN suffices and the secret can be deleted". THAT IS FALSE, and it is
      # corrected here rather than deleted, because it is the kind of false that costs a deploy.
      #
      # MEASURED 2026-08-11, on this workflow, on this repo. GHCR_TOKEN (set 2026-07-12) expired;
      # every build failed at the login step with `Get "https://ghcr.io/v2/": denied: denied`. On
      # the strength of the sentence above, the login was switched to GITHUB_TOKEN and dispatched
      # for `interego-discord` (run 31509074883). The result separates the two claims cleanly:
      #
      #   · LOGIN SUCCEEDED — the build ran all the way to `[build 33/38] RUN npm ci`.
      #   · THE PUSH DID NOT: `failed to push ghcr.io/markjspivey-xwisee/interego-discord:...
      #     403 Forbidden` on the blob HEAD.
      #
      # So the packages are STILL not connected, years of pushes carrying
      # `org.opencontainers.image.source` notwithstanding — the label does not retroactively grant
      # a repository write access to a package that was created outside it. Connecting them is a
      # one-time action in each package's own settings ("Manage Actions access" -> add this
      # repository with the Write role), and only after that can this fall back to GITHUB_TOKEN and
      # the secret be deleted.
      #
      # ★ UNTIL THEN THIS DEPLOY PATH HAS AN EXPIRY DATE NOBODY IS WATCHING, which is worth saying
      # plainly: a PAT here is not a credential choice, it is a scheduled outage. `secrets.X || Y`
      # picks whichever secret is NON-EMPTY, not whichever still works, so an expired PAT does not
      # fall back — it just fails.
      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          # Repo root for every image, including interego-css-pgsl, whose Dockerfile
          # header describes a "deployment-shaped tree assembled by the deploy
          # script". That constraint is about the shape of the IMAGE, not of the
          # context: its COPYs name three context paths (plus `docker-entrypoint.sh`,
          # which sits inside the third), and the build stage
          # writes its own root package.json, so the tree inside the image is the same
          # clean one either way. The root .dockerignore already drops node_modules at
          # every level, which is the part that would actually poison it.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Empty for images without a build_args field; docker/build-push-action
          # treats an empty build-args as none.
          # GIT_SHA is appended to every image's build-args so the runtime can
          # report which commit it is running (relay surfaces it at /health).
          # That is what lets a deploy be VERIFIED instead of assumed — see
          # tools/railway-redeploy.mjs. Dockerfiles that ignore the arg are
          # unaffected; an unused ARG is not an error.
          build-args: |
            ${{ matrix.build_args }}
            GIT_SHA=${{ github.sha }}
          # Immutable sha tag is what Railway pins to; :latest is for humans.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          # image.source is what connects the package to the repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        if: steps.gate.outputs.skip != 'true'
        run: echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
