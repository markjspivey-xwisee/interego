name: PGSL sweep token handoff fixture
on:
  push:
    branches: ['fix/pgsl-private-sweep-*']
    paths:
      - 'tools/pgsl-sweep-provision.mjs'
      - 'tests/pgsl-sweep-provision.test.mjs'
      - '.github/workflows/pgsl-sweep-provision.yml'
      - '.github/workflows/pgsl-sweep-provision-test.yml'
  pull_request:
    paths:
      - 'tools/pgsl-sweep-provision.mjs'
      - 'tests/pgsl-sweep-provision.test.mjs'
      - '.github/workflows/pgsl-sweep-provision.yml'
      - '.github/workflows/pgsl-sweep-provision-test.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handoff-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: node --test tests/pgsl-sweep-provision.test.mjs
