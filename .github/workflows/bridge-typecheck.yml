name: Bridge Typecheck

# Every bridge runs under tsx (transpile-only) — deploy/Dockerfile.foxxi-bridge ends
# in `CMD ["npx","tsx", ... server.ts]` — so NOTHING typechecks it on the way to
# production. A missing import is not a build failure there; it is a runtime
# ReferenceError. That is not hypothetical: `latticeArtifacts is not defined` shipped
# to production and was swallowed by a try/catch, which made a durable course catalog
# silently report zero courses.
#
# tsc IS the only guard. This job is it.
#
# ★ SCOPE. This workflow used to typecheck ONE of the seven bridges and trigger on
# three of the eight application directories. The other five bridge servers, plus
# mcp-server and examples/personal-bridge, gated nothing at all — editing them could
# not red a pull request. That was not theoretical either: a `string | string[]`
# error in the SHARED applications/_shared/ontology-serve module broke five of the
# seven bridges' typecheck simultaneously and had never been seen, because the two
# bridges that were covered are the two whose tsconfigs do not include that file.
# Adding a path to one workflow is not the fix — the fix is that every bridge is
# typechecked and every directory that feeds one triggers the job.
#
# `npm run build` is required before tsc: each bridge tsconfig resolves @interego/*
# through the workspace symlinks, so those packages' emitted .d.ts must exist for the
# program to typecheck at all.

# NOTE: the two `paths` lists below are duplicated on purpose. GitHub Actions does
# not officially support YAML anchors in workflow files, and a trigger that silently
# fails to fire is the exact failure mode this workflow exists to prevent — so this
# stays explicit rather than clever. Keep the two lists identical.
on:
  push:
    branches: [master]
    paths:
      - 'applications/**'
      - 'mcp-server/**'
      - 'examples/**'
      - 'packages/**'
      - 'tests/**'
      # ★ THE WHOLE deploy/ TREE, NOT JUST deploy/mcp-relay/**.
      #
      # tests/static-sites-404-and-hsts.test.ts and tests/build-sha-is-verifiable.test.ts
      # assert against deploy/Dockerfile.* and the nginx configs beside them — whether each
      # public surface registers HSTS before its body parser, and whether each image takes
      # the GIT_SHA build-arg it is deployed by. This job is the ONLY workflow that runs
      # `npx vitest run`, so while this entry read `deploy/mcp-relay/**` a Dockerfile-only
      # change could not re-run the gate that reads it: the assertions existed and the
      # trigger did not fire.
      - 'deploy/**'
      # ★ THE WHOLE docs/ AND spec/ TREES, NOT `docs/ns/**` AND `spec/conformance/**`.
      # tests/docs-*.test.ts and tests/spec-*.test.ts read prose files across both trees
      # (spec/LAYERS.md, spec/AGGREGATE-PRIVACY.md, spec/CRDT-OFFLINE-MERGE.md,
      # docs/ARCHITECTURAL-FOUNDATIONS.md, docs/AGGREGATE-PRIVACY-MODES.md,
      # docs/applications/**/*.ttl). Under the narrow globs a commit deleting or
      # rewriting one of those merged with the assertion about it never executed.
      - 'docs/**'
      - 'spec/**'
      - 'demos/**'
      - 'integrations/**'
      - 'tsconfig.base.json'
      - 'tsconfig.check.json'
      # ★ NOT just `tools/typecheck-gate.mjs`. This job is the ONLY workflow that runs
      # `npx vitest run`, and vitest.config.ts holds the `include` globs, the `globalSetup`
      # typecheck hook AND the `reporters` wiring for tools/vitest-run-integrity.mjs — the
      # run-integrity floor that was ratcheted 175 -> 179 precisely so a glob that stopped
      # matching a directory could not report a green whole-tree run. Neither file was in
      # this list. The only push/PR workflow with no `paths` filter is lint.yml, whose gate
      # targets do not read either. So a PR editing ONLY vitest.config.ts, or only
      # vitest-run-integrity.mjs, got exactly one check — ESLint — and setting
      # MIN_TEST_MODULES back to 3, or deleting the reporter, merged green.
      - 'vitest.config.ts'
      - 'tools/**'
      # ★ THE WHOLE WORKFLOW DIRECTORY, NOT THREE FILES BY NAME.
      #
      # This list used to name `security-txt-expiry.yml` and this file, because those were
      # the two workflows someone remembered a test reads. The root suite reads four more —
      # deploy-railway.yml (tests/build-sha-is-verifiable.test.ts), build-ghcr.yml
      # (tests/static-sites-404-and-hsts.test.ts), lint.yml (tests/lint-gate-ci-claim.test.ts)
      # and the whole directory (tests/workflow-header-matches-triggers.test.ts). Every
      # other workflow is path-filtered and none listed `.github/workflows/**`, so a pull
      # request confined to one of those files ran ESLint and nothing else. MEASURED: the
      # `verify_url` input this repo deliberately removed from deploy-railway.yml can be
      # re-added and `npx vitest run tests/build-sha-is-verifiable.test.ts` goes red — the
      # assertion existed, and no job would have executed it.
      #
      # The class is "a gate cannot re-run for the file it guards", so the fix is the
      # DIRECTORY. Naming a seventh file would leave the eighth.
      - '.github/workflows/**'
      # Root documents the suite reads byte-for-byte: ENGAGEMENT-REPORT.html is compared
      # against ENGAGEMENT-REPORT.md, and README/STATUS/CLAUDE carry pinned claims.
      - 'CLAUDE.md'
      - 'README.md'
      - 'STATUS.md'
      - 'ENGAGEMENT-REPORT.md'
      - 'ENGAGEMENT-REPORT.html'
      - 'REFLEXIVE-DOGFOOD.md'
      # ★ ADDED BY tests/workflow-trigger-covers-the-suite.test.ts, not by anyone noticing.
      # tests/changelog-lint.test.ts reads CHANGELOG.md and asserts its preamble no longer
      # claims that its 78 cited commit hashes resolve — none of them do. Without this entry
      # a commit restoring that sentence, which touches only CHANGELOG.md, would merge with
      # the assertion about it never executed: exactly the "a gate cannot re-run for the file
      # it guards" class the `.github/workflows/**` entry above was widened for.
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
  pull_request:
    branches: [master]
    paths:
      - 'applications/**'
      - 'mcp-server/**'
      - 'examples/**'
      - 'packages/**'
      - 'tests/**'
      # ★ THE WHOLE deploy/ TREE, NOT JUST deploy/mcp-relay/**.
      #
      # tests/static-sites-404-and-hsts.test.ts and tests/build-sha-is-verifiable.test.ts
      # assert against deploy/Dockerfile.* and the nginx configs beside them — whether each
      # public surface registers HSTS before its body parser, and whether each image takes
      # the GIT_SHA build-arg it is deployed by. This job is the ONLY workflow that runs
      # `npx vitest run`, so while this entry read `deploy/mcp-relay/**` a Dockerfile-only
      # change could not re-run the gate that reads it: the assertions existed and the
      # trigger did not fire.
      - 'deploy/**'
      # ★ THE WHOLE docs/ AND spec/ TREES, NOT `docs/ns/**` AND `spec/conformance/**`.
      # tests/docs-*.test.ts and tests/spec-*.test.ts read prose files across both trees
      # (spec/LAYERS.md, spec/AGGREGATE-PRIVACY.md, spec/CRDT-OFFLINE-MERGE.md,
      # docs/ARCHITECTURAL-FOUNDATIONS.md, docs/AGGREGATE-PRIVACY-MODES.md,
      # docs/applications/**/*.ttl). Under the narrow globs a commit deleting or
      # rewriting one of those merged with the assertion about it never executed.
      - 'docs/**'
      - 'spec/**'
      - 'demos/**'
      - 'integrations/**'
      - 'tsconfig.base.json'
      - 'tsconfig.check.json'
      # ★ NOT just `tools/typecheck-gate.mjs`. This job is the ONLY workflow that runs
      # `npx vitest run`, and vitest.config.ts holds the `include` globs, the `globalSetup`
      # typecheck hook AND the `reporters` wiring for tools/vitest-run-integrity.mjs — the
      # run-integrity floor that was ratcheted 175 -> 179 precisely so a glob that stopped
      # matching a directory could not report a green whole-tree run. Neither file was in
      # this list. The only push/PR workflow with no `paths` filter is lint.yml, whose gate
      # targets do not read either. So a PR editing ONLY vitest.config.ts, or only
      # vitest-run-integrity.mjs, got exactly one check — ESLint — and setting
      # MIN_TEST_MODULES back to 3, or deleting the reporter, merged green.
      - 'vitest.config.ts'
      - 'tools/**'
      # ★ THE WHOLE WORKFLOW DIRECTORY, NOT THREE FILES BY NAME.
      #
      # This list used to name `security-txt-expiry.yml` and this file, because those were
      # the two workflows someone remembered a test reads. The root suite reads four more —
      # deploy-railway.yml (tests/build-sha-is-verifiable.test.ts), build-ghcr.yml
      # (tests/static-sites-404-and-hsts.test.ts), lint.yml (tests/lint-gate-ci-claim.test.ts)
      # and the whole directory (tests/workflow-header-matches-triggers.test.ts). Every
      # other workflow is path-filtered and none listed `.github/workflows/**`, so a pull
      # request confined to one of those files ran ESLint and nothing else. MEASURED: the
      # `verify_url` input this repo deliberately removed from deploy-railway.yml can be
      # re-added and `npx vitest run tests/build-sha-is-verifiable.test.ts` goes red — the
      # assertion existed, and no job would have executed it.
      #
