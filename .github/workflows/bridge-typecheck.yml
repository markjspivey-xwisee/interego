name: Bridge Typecheck

# The Foxxi bridge runs under tsx (transpile-only) — deploy/Dockerfile.foxxi-bridge
# ends in `CMD ["npx","tsx", ... server.ts]` — so NOTHING typechecks it on the way
# to production. A missing import is not a build failure there; it is a runtime
# ReferenceError. That is not hypothetical: `latticeArtifacts is not defined`
# shipped to production and was swallowed by a try/catch, which made a durable
# course catalog silently report zero courses.
#
# tsc IS the only guard. This job is it.
#
# `npm run build` is required before tsc: the bridge tsconfig resolves @interego/*
# through the workspace symlinks, so those packages' emitted .d.ts must exist for
# the program to typecheck at all.

on:
  push:
    branches: [master]
    paths:
      - 'applications/foxxi-content-intelligence/**'
      - 'applications/agentic-performance-practice/src/**'
      - 'applications/lrs-adapter/src/**'
      - 'packages/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bridge-typecheck.yml'
  pull_request:
    branches: [master]
    paths:
      - 'applications/foxxi-content-intelligence/**'
      - 'applications/agentic-performance-practice/src/**'
      - 'applications/lrs-adapter/src/**'
      - 'packages/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bridge-typecheck.yml'

permissions:
  contents: read

jobs:
  typecheck:
    name: "Foxxi bridge typecheck (tsx never typechecks it — this is the only guard)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build @interego/* packages
        # Not for the artifacts — for the .d.ts the bridge's tsconfig resolves.
        run: npm run build
      - name: Typecheck the bridge
        run: npx tsc --noEmit -p applications/foxxi-content-intelligence/bridge/tsconfig.json
      # Guard the public-memory commons invariant: a PUBLIC (node-addressable) lattice
      # label must be backed by a resource disjoint from the private `shared-lattice`,
      # else resolvePublicNode becomes a cross-tenant existence oracle. Network-free
      # (fake pod + test seed), so it runs here rather than in the pod-touching suite.
      - name: Guard the public-memory commons isolation invariant + action-identity dual-read
        run: npx vitest run applications/foxxi-content-intelligence/tests/public-memory-commons.test.ts applications/foxxi-content-intelligence/tests/affordances-are-invocable.test.ts tests/action-identity.test.ts tests/competency-identity.test.ts tests/activity-identity.test.ts
      # A credential is a statement BY an issuer. /agent/prove-competency derived its
      # BBS+ issuer seed from a caller-supplied issuer_did, so two unrelated holders
      # naming the same authority got credentials signed by the SAME key — anyone
      # could mint one that verifies against the key a named authority signs with.
      # Source-level, so it gates the pull request that would reintroduce it rather
      # than reporting after deploy.
      - name: Guard credential issuer binding (the issuer is the signer)
        run: npx tsx applications/foxxi-content-intelligence/tests/credential-issuer-binding.test.ts
      # A learner record advertised rawDataLocation = /xapi/statements?statementId=<id>
      # for a statement the LRS had REFUSED — record_performance returned the id anyway,
      # so the refusal was invisible and the credential's evidence pointer 404'd.
      - name: Guard evidence pointers (a record may not cite what a verifier cannot fetch)
        run: npx tsx applications/foxxi-content-intelligence/tests/evidence-pointers-resolve.test.ts
      # The `more` IRL is opaque to the client, so the query context has to live in the
      # token. It carried only {offset, ts}, so following a continuation re-ran an
      # UNFILTERED query with the offset applied — page 2 held rows the filter excluded
      # and rows page 1 had already returned.
      - name: Guard xAPI pagination (a continuation resumes the same query)
        run: npx tsx applications/foxxi-content-intelligence/tests/statement-pagination.test.ts
