permissions:
  contents: read

jobs:
  typecheck:
    name: "MCP surface typecheck (tsx never typechecks it — this is the only guard)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build @interego/* packages
        # Not for the artifacts — for the .d.ts each bridge tsconfig resolves.
        run: npm run build

      # ── Every bridge, not just the one that happened to be covered ──────────
      # Iterating the glob rather than listing seven paths means a NEW vertical is
      # covered the day its bridge lands, instead of the day someone remembers to
      # add it here.
      - name: Typecheck every vertical bridge
        run: |
          set -euo pipefail
          failed=0
          for cfg in applications/*/bridge/tsconfig.json; do
            printf '\n=== %s ===\n' "$cfg"
            npx tsc --noEmit -p "$cfg" || failed=1
          done
          exit "$failed"

      # Published as @interego/mcp. Its own `npm run build` runs tsc, but only inside
      # publish-npm.yml on a v* tag — so a type error here used to merge green and red
      # the RELEASE instead of the pull request.
      - name: Typecheck mcp-server (the stdio server; only tsc-checked on a tag before)
        run: npx tsc --noEmit -p mcp-server/tsconfig.json

      - name: Typecheck examples/personal-bridge (no workflow covered examples/ at all)
        run: npx tsc --noEmit -p examples/personal-bridge/tsconfig.json

      # ── The two programs NO tsconfig in the repo reached ─────────────────────
      #
      # `tests/**` and `applications/shared-workspace/**`. Every other application's src is
      # pulled into its own `bridge/tsconfig.json` by that config's `"../src/**/*.ts"`
      # include; shared-workspace is the one vertical with no bridge/ directory, so nothing
      # compiled it. And vitest transpiles with esbuild, so `npx vitest run tests/` stripped
      # the types and ran the JavaScript underneath.
      #
      # Measured: deleting a required bail-out from `readAcceptanceRecord` left all 237 tests
      # GREEN while tsc caught it in one pass.
      #
      # The gate also runs in vitest's globalSetup, so a local run cannot miss it. It is a
      # NAMED STEP here as well because a gate whose only home is a setup hook is one config
      # edit away from being invisible — and because a CI log should say which guard failed,
      # not "vitest exited 1".
      - name: Typecheck tests/ and applications/shared-workspace/ (ratcheted)
        run: node tools/typecheck-gate.mjs

      # examples/holodeck/lib/mcp-shim.mjs is plain JS, signs with a per-agent wallet
      # and POSTs to the PRODUCTION relay. When the v1 SDK was removed its imports
      # stopped resolving and it would have crashed at startup — `node --check` cannot
      # see that (the syntax was fine, the module graph was not), so this BOOTS it.
      - name: The holodeck MCP shim actually boots and serves
        run: node examples/holodeck/mcp-shim-boots.test.mjs

      # Typechecking the stdio server does not prove it SERVES. This spawns the real
      # binary and drives a real MCP client down real stdio in both protocol eras,
      # including the `server/discover` -> `initialize` fallback that makes serveStdio
      # discard a probe instance. mcp-server/tests/** otherwise runs only on a v* tag,
      # so without this step the test would gate nothing before merge.
      - name: The stdio server actually serves a client (both eras, real subprocess)
        run: npx vitest run --root mcp-server tests/stdio-serves-both-eras.test.ts

      # ★ THE WHOLE SUITE, NOT A HAND-PICKED LIST.
      #
      # This step used to name 13 test files explicitly. That made it an INCLUSION list,
      # and an inclusion list fails silently: 98 of the 111 files in tests/ ran in no
      # workflow at all. Locally green, gating nothing. It was found the fifth time in
      # one session that a newly written test turned out not to run in CI — that time
      # the test pinning a security fix (the caller-reachable entailment bypass, #217),
      # which had already merged with its guard inert.
      #
      # The header of this very workflow already says it: "Adding a path to one workflow
      # is not the fix." Naming one more file would have repeated the mistake in the same
      # shape. So the default is inverted, from opt-in to opt-out: run everything, and
      # let an exclusion be a visible, argued deletion rather than an omission nobody sees.
      #
      # Affordable: the full root suite is ~3m24s and only 12 of 111 files touch the
      # network — several of which (action-identity, competency-identity,
      # activity-identity) were already running here, so network access in CI is proven,
      # not assumed.
      - name: The whole root test suite
        run: npx vitest run
      # A credential is a statement BY an issuer. /agent/prove-competency derived its
      # BBS+ issuer seed from a caller-supplied issuer_did, so two unrelated holders
      # naming the same authority got credentials signed by the SAME key — anyone
      # could mint one that verifies against the key a named authority signs with.
      # Source-level, so it gates the pull request that would reintroduce it rather
      # than reporting after deploy.
      - name: Guard credential issuer binding (the issuer is the signer)
        run: npx tsx applications/foxxi-content-intelligence/checks/credential-issuer-binding.check.ts
      # A learner record advertised rawDataLocation = /xapi/statements?statementId=<id>
      # for a statement the LRS had REFUSED — record_performance returned the id anyway,
      # so the refusal was invisible and the credential's evidence pointer 404'd.
      - name: Guard evidence pointers (a record may not cite what a verifier cannot fetch)
        run: npx tsx applications/foxxi-content-intelligence/checks/evidence-pointers-resolve.check.ts
      # The `more` IRL is opaque to the client, so the query context has to live in the
      # token. It carried only {offset, ts}, so following a continuation re-ran an
      # UNFILTERED query with the offset applied — page 2 held rows the filter excluded
      # and rows page 1 had already returned.
      - name: Guard xAPI pagination (a continuation resumes the same query)
        run: npx tsx applications/foxxi-content-intelligence/checks/statement-pagination.check.ts
      # GET /affordances is the route an agent is told to walk to learn what a vertical
      # can do, and it answered Turtle no matter what was asked for. The mount is shared,
      # so this guards every vertical at once — including that the entry point and the
      # manifest keep projecting an affordance identically.
      - name: Guard the shared affordance manifest (negotiation + no projection drift)
        run: npx tsx applications/_shared/vertical-bridge/affordance-manifest.test.ts
      # POST /mcp on the shared mount is hand-rolled JSON-RPC parsed by four deployed
      # clients that turn an envelope change into silence rather than an error. This
      # pins the envelope so a change to it has to be deliberate and visible in a diff.
      - name: Guard the shared MCP wire contract (the envelope four deployed clients parse)
        run: npx tsx applications/_shared/vertical-bridge/mcp-wire-contract.test.ts
      # ★ THE CONFORMANCE RUNNER RAN IN NO WORKFLOW AT ALL, and its verdict disagreed with
      # the shipped validator's: it reported `self-reference-violation.ttl — expected
      # violations fired ✓` for a fixture `validateAgainstShape` accepts. It now cross-checks
      # every fixture against @interego/core and counts a rule the engine cannot evaluate as
      # UNVERIFIABLE rather than passed. It lives in THIS job because it needs `npm run build`
      # above — CONFORMANCE_REQUIRE_ENGINE=1 makes a missing engine a hard failure rather than
      # a silent fall back to the regex-only verdict.
      - name: Spec conformance fixtures, cross-checked against the shipped validator
        env:
          CONFORMANCE_REQUIRE_ENGINE: '1'
        run: node spec/conformance/runner.mjs
