name: Mutation Gate

# Every refusal gate is made to FAIL before it is believed.
#
# Gates in this tree have passed, at some point, on the exact defect they were written to
# catch. That was found four times, by four adversarial audits, each costing roughly 30M
# subagent tokens and hours of wall-clock. `tools/mutation-gate.mjs` applies each known defect
# mechanically and requires the gate that names it to go red. It takes a few minutes.
#
# ★ NO COUNT HERE, AND NO LIST OF GATES. This comment said "the three gates this job mutates",
# named them, and said "those seventeen defects" — all three numbers went stale within a day of
# being written, because the table is meant to grow. MUTANTS in tools/mutation-gate.data.mjs is
# the authority, and the harness prints its size on every run. Same argument as the check name
# below, and as the prefix list in ontology-lint.yml.
#
# ── WHY THERE IS NO `paths:` FILTER ──────────────────────────────────────────
#
# This job's subject is a RELATIONSHIP between files, not a directory: every gate the table
# names, every source file its mutants edit, `tools/mutation-gate.data.mjs`, the harness itself,
# `applications/_shared/vertical-bridge/**` (which derives the status and `isError` the gates
# assert on), `tests/return-object-scan.ts` (the parser the censuses are built on),
# `vitest.config.ts` and the typecheck globalSetup. Any filter narrower than that set writes a
# false all-clear, and the repo has now paid for that lesson twice:
# `applications/organizational-working-memory/affordances.ts` shipped an undeclared control IRI
# because ontology-lint.yml named three files where its own SCAN_PATHS said a directory, and
# tools/docs-claim-lint.mjs could not live behind a filter at all because its subject is the
# LINK TARGET. A lint's coverage and its trigger are independent facts; widening one reads like
# widening both.
#
# So this runs on every pull request with no path filter, like lint.yml and the conformance
# runner, which are here for the same reason. It was six minutes when that was written and thirty
# by 2026-11-17, as the table grew; the job below is cut across runners for that, not filtered.
#
# ── WHY NOT ON MASTER PUSHES (since 2026-09-21) ────────────────────────────────────────────
#
# Measured at 19-21 minutes, the longest run on every master commit, and the auto-deploy gate
# waits for every run before it ships: this job alone held every rollout for twenty minutes
# after the pull request's own run of it had passed on the merge ref minutes earlier. The
# gates it exercises are meta-checks with tests of their own; two pull requests merged in
# quick succession do not change whether a gate fails on its known defect. Bridge Typecheck
# still runs the whole unit suite on every master push, so master is never untested; this
# job is where a pull request proves the gates, and that proof is not repeated on merge.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  mutation-gate:
    # ★ NO COUNT IN THE NAME. "17 defects" would be a hand-maintained number in a check name —
    # drift with a green tick beside it, the same argument that removed "47 files pinned" from
    # the ESLint job. The authoritative list is MUTANTS in tools/mutation-gate.data.mjs, which
    # the harness prints on every run.
    #
    # ★ FIVE RUNNERS SINCE 2026-11-17. One job applied every mutant in turn: 30.0 minutes on average
    # over 20 runs, the longest check on a pull request and so the one the gated auto-merge waits
    # for. Mutants are independent (each starts from the pristine tree), so the table is dealt
    # across runners by position: `--shard=i/n` applies every n-th mutant. Every mutant still runs
    # on every pull request; nothing is filtered. tools/mutation-gate.shard.mjs is the cut, and
    # tests/mutation-gate-shards.test.ts refuses a list here that is not 1/n … n/n once each or
    # that leaves a shard empty. The shard is in the name so a red one says which.
    name: "Every refusal gate fails on its own defect (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard's red says nothing about the others' mutants: let them finish and report.
      fail-fast: false
      matrix:
        shard: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20', cache: npm }
      - run: npm ci
      # The gates import built packages, not source — @interego/* export ./dist only. A mutant
      # in packages/*/src would otherwise be invisible to the gate that should catch it, which
      # has already produced false survivors in this tree.
      - run: npm run build
      - name: Apply each known defect and require its gate to go red
        run: npm run mutation-gate -- --shard=${{ matrix.shard }}
      # The harness restores every file it touched from an in-memory copy, in a `finally`. If
      # that ever stops working, the next job on this runner would silently test mutated source
      # — so prove the tree came back rather than assuming it.
      - name: The harness left the tree exactly as it found it
        run: git diff --exit-code
