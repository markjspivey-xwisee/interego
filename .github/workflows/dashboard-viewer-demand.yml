name: Dashboard viewer demand
on:
  pull_request:
    paths:
      - 'examples/dashboard/**'
      - 'deploy/Dockerfile.dashboard'
      - 'tests/dashboard-viewer-demand.test.mjs'
      - '.github/workflows/dashboard-viewer-demand.yml'
  push:
    branches: [master]
    paths:
      - 'examples/dashboard/**'
      - 'deploy/Dockerfile.dashboard'
      - 'tests/dashboard-viewer-demand.test.mjs'
      - '.github/workflows/dashboard-viewer-demand.yml'
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dashboard-viewer-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: node --test tests/dashboard-viewer-demand.test.mjs
