name: Dashboard viewer demand
on:
  pull_request:
    paths:
      - 'examples/dashboard/**'
      - 'deploy/Dockerfile.dashboard'
      - 'tests/dashboard-viewer-demand.test.mjs'
      - '.github/workflows/dashboard-viewer-demand.yml'
  push:
    branches: [master]
    paths:
      - 'examples/dashboard/**'
      - 'deploy/Dockerfile.dashboard'
      - 'tests/dashboard-viewer-demand.test.mjs'
      - '.github/workflows/dashboard-viewer-demand.yml'
jobs:
  dashboard-viewer-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: node --test tests/dashboard-viewer-demand.test.mjs
