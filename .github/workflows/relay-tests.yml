name: Relay Tests

# The relay's test suite guards the substrate's SECURITY BOUNDARY, and until now
# nothing ran it except a human remembering to.
#
# The suite is where the adversarial-audit remediations live as executable
# invariants: caller attribution cannot be forged from a request body, an
# engagement id is not authority over the engagement, a caller cannot write
# outside its own pod, reserved wire fields are stripped on every transport, the
# publish scope gate refuses an agent that is not registered ReadWrite. Those are
# not properties you re-derive by reading a diff — they are properties that hold
# only while their tests keep passing.
#
# Adding this found a concrete instance of the problem it exists to prevent:
# tests/publish-gates.test.ts (30 assertions over the publish scope gate) was
# written, committed, and then silently left out of the `test` script, so it had
# stopped running entirely while still looking like coverage.
#
# The suite is pure in-process — it boots Express on an ephemeral port and speaks
# to itself. No network, no secrets, no live pod. That is what makes it safe to
# run on every pull request from anyone.

on:
  push:
    branches: [master]
    paths:
      - 'deploy/mcp-relay/**'
      - 'packages/**'
      - '.github/workflows/relay-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'deploy/mcp-relay/**'
      - 'packages/**'
      - '.github/workflows/relay-tests.yml'

permissions:
  contents: read

jobs:
  relay-tests:
    name: "Relay invariants (attribution, scope, engagement, publish gates)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }

      # The relay imports workspace packages by their published names, so they
      # must be BUILT before the suite can resolve them.
      #
      # `npm run build`, not `build:leaves`: the leaves import @interego/core, so
      # building only the leaves fails on a clean checkout. It appears to work
      # locally purely because a previous build left core's dist/ on disk — which
      # is precisely the class of "works on my machine" this job exists to catch,
      # and it caught it here on the first run.
      - name: Install workspace
        run: npm ci --ignore-scripts
      - name: Build workspace packages (core, then leaves)
        run: npm run build

      # Typecheck first: tsx strips types without checking them, so a type error
      # would otherwise sail through the whole suite unnoticed.
      #
      # TWO programs, because there are two. `tsconfig.json` is the EMITTING build config
      # Dockerfile.relay runs, so its include is the 11 production entry points and cannot
      # carry tests. `tsconfig.tests.json` is the no-emit program for the test files that
      # were in NO program until it existed — and that landed with 15 pre-existing errors,
      # including a `_amep-seed-test.ts` line that had been printing `currentHead=undefined`
      # on every run. Both are named here as their own step as well as inside `npm test`,
      # so neither is reachable only through the other.
      - name: Typecheck the relay (build program)
        working-directory: deploy/mcp-relay
        run: npx tsc --noEmit -p tsconfig.json
      - name: Typecheck the relay TESTS (the program that did not exist)
        working-directory: deploy/mcp-relay
        run: npx tsc --noEmit -p tsconfig.tests.json

      - name: Run relay test suite
        working-directory: deploy/mcp-relay
        run: npm test
