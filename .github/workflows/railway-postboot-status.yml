name: Railway post-boot status regressions
on:
  push:
    branches: [master]
    paths:
      - 'tools/railway-redeploy.mjs'
      - 'tools/railway-services.mjs'
      - 'tools/railway-deploy-trigger.mjs'
      - 'tests/railway-postboot-status.test.mjs'
      - '.github/workflows/railway-postboot-status.yml'
  pull_request:
    paths:
      - 'tools/railway-redeploy.mjs'
      - 'tools/railway-services.mjs'
      - 'tools/railway-deploy-trigger.mjs'
      - 'tests/railway-postboot-status.test.mjs'
      - '.github/workflows/railway-postboot-status.yml'
permissions:
  contents: read
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  postboot-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: node --test tests/railway-postboot-status.test.mjs
