name: jev-harness (System One judgments)

# Copy to .github/workflows/ in the monorepo with the vertical at applications/jev-harness.
#
# One job on every pull request (three until 2026-09-22; see the job's own note), in order:
#   select-tests     follow select-tests → run the selection → triage the log (only when the run failed) → score the selection
#   review-gate      follow review-gate on the PR diff; the job fails for block (a secret in the
#                    diff, exit 3) and, only when the repository variable JEV_REQUIRE_HUMAN_REVIEW
#                    is true, for needs-human-review (exit 1); otherwise that verdict is advisory
#   artifacts        every judgment's JSON, payload Turtle, descriptor TriG and HyperMarkdown
#   gated auto-merge merges when every condition holds (armed by the JEV_AUTO_MERGE variable and
#                    the JEV_MERGE_TOKEN secret; the policy is applications/jev-harness/src/auto-merge.ts),
#                    after waiting for the whole-suite run (bridge-typecheck.yml) on the same head:
#                    a red suite never merges (JEV_MERGE_WAITS_FOR_SUITE=false makes it advisory);
#                    unarmed, it prints the decision it would have taken
#
# Secrets: TYPESAFE_API_KEY (required). INTEREGO_AGENT_KEY_JSON (optional) makes the runner's bridge the
# harness's delegate agent, so every judgment and outcome is published to the owner's pod through the
# relay, attributed to the agent on behalf of the owner, and each job leaves one comment on the pull
# request with its verdict or selection and links to the descriptors.

on:
  pull_request:
    branches: [master]
    # closed is what records outcomes: the merge, or the close without one, is the human
    # decision the review verdict is scored against.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # two comments per pull request, edited in place on later runs

# A new push to the same pull request makes the run in flight moot: its judgments are of a diff
# that no longer exists and its decision would merge a head it did not test. Cancel it. The
# close-time run is grouped apart so a merge never cancels the scoring of its own judgments.
concurrency:
  group: jev-harness-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'closed' && 'close' || 'judge' }}
  cancel-in-progress: true

env:
  HARNESS_DIR: applications/jev-harness
  BRIDGE_PORT: '6090'
  # The pod the delegate publishes to, the agent it is registered there as, and the owner it acts for.
  # ★ ONE POD. Until 2026-09-21 the harness published to u-pk-33d42e6b33dc while the fleet's own
  # evidence (deploys, incidents, reviews) landed on u-pk-f2a9c751075a, the pod the operator's live
  # connector owns — and the harness's payloads could not be read from that connector at all. An
  # agent can only be registered from a session on the pod it is registered on, so everything
  # moved to the pod the operator can reach; the history on the old pod stays readable there.
  INTEREGO_POD_NAME: u-pk-f2a9c751075a
  JEV_HARNESS_AGENT_ID: did:web:identity.interego.xwisee.com:agents:jev-harness-bridge-u-did-6de86e8ba294
  JEV_HARNESS_OWNER_WEBID: https://identity.interego.xwisee.com/users/u-pk-f2a9c751075a/profile#me
  INTEREGO_POD_PUBLIC_ORIGIN: https://gate.interego.xwisee.com
  # A CI bridge serves its judgments at localhost, which no reader can follow; its executable
  # controls name the deployed bridge instead, which answers the same verbs and reads any
  # judgment back from the pod. The judgment's own URL stays local and is left out of comments.
  JEV_HARNESS_CONTROL_BASE: https://jev-harness-bridge-production.up.railway.app
  # ★ NO PERSON IS REQUIRED unless this repository variable is `true`. The gate still judges
  # every diff and records its verdict, and a secret in the diff (block) still fails the job;
  # needs-human-review is advisory — the operator said so on 2026-09-21 — so the check stays
  # green and the gated auto-merge, once armed, waits for nobody.
  JEV_REQUIRE_HUMAN_REVIEW: ${{ vars.JEV_REQUIRE_HUMAN_REVIEW }}
  # Unset or anything but `false`: the decision waits for the whole-suite run on the head and
  # refuses over a red one. `false`: the suite's word is printed, not gating.
  JEV_MERGE_WAITS_FOR_SUITE: ${{ vars.JEV_MERGE_WAITS_FOR_SUITE }}

jobs:
  # ── One machine for the whole pull request ────────────────────────────────────────────────
  # Until 2026-09-22 this was three jobs: the selection, the gate and the merge decision, each
  # on its own runner with its own install and build, the decision waiting for both. Measured
  # on a one-file change, the three runner starts and the repeated installs cost more than every
  # judgment and test combined. One bridge, started once, now answers the selection and the gate
  # in turn, and the decision reads the gate's verdict from the same workspace, not an artifact.
  judge:
    name: "select tests → run → gate → decide"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      # node_modules keyed by the lockfile: a hit skips npm ci (about a minute). Workspace links
      # inside it are symlinks, which the cache tar keeps.
      - uses: actions/cache@v5
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # The built packages keyed by their sources: a hit skips the whole build (two to three
      # minutes). Saved here; auto-deploy restores the same key on master, where a change outside
      # packages/ then ships prebuilt into the images.
      - uses: actions/cache@v5
        id: dist
        with:
          path: packages/*/dist
          key: dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
      - if: steps.dist.outputs.cache-hit != 'true'
        run: npm run build
      - name: Start the bridge bound to this checkout
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          INTEREGO_AGENT_KEY_JSON: ${{ secrets.INTEREGO_AGENT_KEY_JSON }}
          INTEREGO_POD_NAME: ${{ env.INTEREGO_POD_NAME }}
          JEV_HARNESS_AGENT_ID: ${{ env.JEV_HARNESS_AGENT_ID }}
          JEV_HARNESS_OWNER_WEBID: ${{ env.JEV_HARNESS_OWNER_WEBID }}
          JEV_HARNESS_CONTROL_BASE: ${{ env.JEV_HARNESS_CONTROL_BASE }}
          JEV_HARNESS_REPO: ${{ github.workspace }}
          BRIDGE_DEPLOYMENT_URL: http://localhost:6090
          PORT: ${{ env.BRIDGE_PORT }}
        run: |
          (cd "$HARNESS_DIR" && npx tsx bridge/server.ts > bridge.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:$BRIDGE_PORT/health" && break; sleep 1; done
          curl -sf "http://localhost:$BRIDGE_PORT/health"
      # The selection may fail (a red test); the gate and the decision still run, and the decision
      # reads this step's outcome as the selection result it used to read from a job. ★ It CAN fail
      # since 2026-09-22: bin/follow.ts ended 0 whatever the run did, so this outcome was always
      # success and "the selected tests passed" was read from a step that could not say otherwise
      # (#454 ran the whole suite to exit 1 and merged on it). --skip-full-run leaves a full-mode
      # selection (a sensitive path changed) to bridge-typecheck.yml, which runs the whole suite on
      # this same head and which the decision waits for, instead of running it here a second time
      # (eight minutes on #454, calibrating nothing).
      - name: Follow the selection chain
        id: selection
        continue-on-error: true
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/follow.ts "http://localhost:$BRIDGE_PORT/affordances" select-tests \
            --arg base_ref="origin/${{ github.base_ref }}" --arg head_ref=HEAD \
            --then run-selected-tests --run --skip-full-run --then triage --outcome \
            --repo "${{ github.workspace }}"
      - name: Comment the selection on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/pr-comment.ts selection --dir "${{ github.workspace }}/.jev-harness/follower" \
            --pod "$INTEREGO_POD_NAME" --pod-public-origin "$INTEREGO_POD_PUBLIC_ORIGIN" > comment.md
          node tools/upsert-pr-comment.mjs "$PR" comment.md "<!-- jev-harness:selection -->"
      - name: Gate the diff
        id: gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cd "$HARNESS_DIR"
          printf '%s' "$PR_BODY" > pr-body.md
          GATE_FLAG=--gate-blocks-only
          if [ "$JEV_REQUIRE_HUMAN_REVIEW" = "true" ]; then GATE_FLAG=--gate; fi
          npx tsx bin/follow.ts "http://localhost:$BRIDGE_PORT/affordances" review-gate \
            --arg base_ref="origin/${{ github.base_ref }}" --arg head_ref=HEAD \
            --arg title="$PR_TITLE" --file description=pr-body.md "$GATE_FLAG" \
            --repo "${{ github.workspace }}"
      - name: Comment the gate on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/pr-comment.ts gate --dir "${{ github.workspace }}/.jev-harness/follower" \
            --pod "$INTEREGO_POD_NAME" --pod-public-origin "$INTEREGO_POD_PUBLIC_ORIGIN" > comment.md
          node tools/upsert-pr-comment.mjs "$PR" comment.md "<!-- jev-harness:review-gate -->"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jev-harness-judgments
          include-hidden-files: true # the store is the dot-directory .jev-harness/
          path: |
            .jev-harness/
            ${{ env.HARNESS_DIR }}/bridge.log
      # ── The whole suite, before the decision ────────────────────────────────────────────────
      # bridge-typecheck.yml runs the whole root suite on this same head, ten minutes, and until
      # 2026-09-22 nothing here read its result: the decision merged on the selected tests while
      # the suite ran on. From 02:24Z to 16:31Z that day the suite was red on every pull request
      # (two tests about that workflow's own trigger, never selected) and seven merged over it.
      # tools/wait-for-workflow-run.mjs polls the runs listed for the head until the suite has
      # concluded and writes one word for the decision (success, absent, failure, timeout, ...).
      - name: Wait for the whole suite on this head (Bridge Typecheck)
        id: suite
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SELF_WORKFLOW: jev-harness (System One judgments)
          SUITE_WORKFLOW: Bridge Typecheck
          SUITE_WAIT_MS: '1200000'
        run: node tools/wait-for-workflow-run.mjs "${{ github.event.pull_request.head.sha }}"
      # ── Gated auto-merge ──────────────────────────────────────────────────────────────────
      # Merges without a person once the operator armed it (repository variable JEV_AUTO_MERGE=true)
      # and a token that triggers auto-deploy is present (secret JEV_MERGE_TOKEN — a merge made with
      # GITHUB_TOKEN starts no workflows, so it would land the commit and ship nothing), the
      # selection ran green, the gate found no secret (block), GitHub reports the branch mergeable
      # and master has not moved since this run's merge ref (a moved base is updated instead). With
      # JEV_REQUIRE_HUMAN_REVIEW=true the bar rises: auto-ok and an earned calibration
      # (applications/jev-harness/src/auto-merge.ts is the policy, with its tests). Unarmed, it
      # prints the decision it would have taken. An automatic merge is labelled
      # jev-harness:auto-merged first, so the close-time job never scores it as a person's approval.
      # It runs whatever the gate concluded: a block is a printed refusal, not a skipped decision.
      - name: Decide, and merge only when every condition holds
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.JEV_MERGE_TOKEN }}
          ARMED: ${{ vars.JEV_AUTO_MERGE }}
          TOKEN_PRESENT: ${{ secrets.JEV_MERGE_TOKEN != '' }}
          SELECTION_RESULT: ${{ steps.selection.outcome }}
          CALIBRATION_URL: https://jev-harness-bridge-production.up.railway.app/jev-harness/calibration
          REPUTATION_URL: https://jev-harness-bridge-production.up.railway.app/jev-harness/reputation
          SUITE_RESULT: ${{ steps.suite.outputs.result }}
          SUITE_URL: ${{ steps.suite.outputs.url }}
          SUITE_GATES: ${{ env.JEV_MERGE_WAITS_FOR_SUITE != 'false' }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/auto-merge.ts --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --dir "${{ github.workspace }}/.jev-harness/follower" --calibration-url "$CALIBRATION_URL" \
            --armed "$ARMED" --token-present "$TOKEN_PRESENT" --selection-result "$SELECTION_RESULT" \
            --require-human-review "$JEV_REQUIRE_HUMAN_REVIEW" --reputation-url "$REPUTATION_URL" \
            --suite-result "$SUITE_RESULT" --suite-gates "$SUITE_GATES" --suite-url "$SUITE_URL"
  outcomes-on-close:
    name: "score the judgments when the pull request closes"
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      # node_modules keyed by the lockfile: a hit skips npm ci (about a minute per job). Workspace
      # links inside it are symlinks, which the cache tar keeps.
      - uses: actions/cache@v5
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache/restore@v5
        id: dist
        with:
          path: packages/*/dist
          key: dist-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'tsconfig.base.json') }}
      # The vertical's IRI guard and descriptor code import @interego/core, which resolves to its
      # built dist/, so the kernel package is built before anything runs.
      # @interego/registry aggregates the attestations the reputation view reads; it builds on core.
      - if: steps.dist.outputs.cache-hit != 'true'
        run: npm run build:core && npm run build --workspace @interego/registry
      # The bridge that made this pull request's judgments is gone with its run; this one reads
      # them back from the pod (the comments carry their graph IRIs) and publishes each outcome
      # as the Asserted head of the judgment's chain, as the same delegate agent.
      - name: Start the bridge
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          INTEREGO_AGENT_KEY_JSON: ${{ secrets.INTEREGO_AGENT_KEY_JSON }}
          INTEREGO_POD_NAME: ${{ env.INTEREGO_POD_NAME }}
          JEV_HARNESS_AGENT_ID: ${{ env.JEV_HARNESS_AGENT_ID }}
          JEV_HARNESS_OWNER_WEBID: ${{ env.JEV_HARNESS_OWNER_WEBID }}
          JEV_HARNESS_CONTROL_BASE: ${{ env.JEV_HARNESS_CONTROL_BASE }}
          JEV_HARNESS_REPO: ${{ github.workspace }}
          BRIDGE_DEPLOYMENT_URL: http://localhost:6090
          PORT: ${{ env.BRIDGE_PORT }}
        run: |
          (cd "$HARNESS_DIR" && npx tsx bridge/server.ts > bridge.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:$BRIDGE_PORT/health" && break; sleep 1; done
      - name: Record the outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/outcomes-on-close.ts --pr "$PR" --repo "$GITHUB_REPOSITORY" --bridge "http://localhost:$BRIDGE_PORT"             --merged "$MERGED" --base "$BASE" --head "$HEAD" --workspace "${{ github.workspace }}"
