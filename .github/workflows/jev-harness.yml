name: jev-harness (System One judgments)

# Copy to .github/workflows/ in the monorepo with the vertical at applications/jev-harness.
#
# Three jobs on every pull request:
#   select-and-run   follow select-tests → run the selection → triage the log (only when the run failed) → score the selection
#   review-gate      follow review-gate on the PR diff; the job fails for needs-human-review (exit 1)
#                    and block (exit 3), so branch protection can require a person only when the
#                    gate asks for one
#   artifacts        every judgment's JSON, payload Turtle, descriptor TriG and HyperMarkdown
#
# Secrets: TYPESAFE_API_KEY (required). INTEREGO_AGENT_KEY_JSON (optional) makes the runner's bridge the
# harness's delegate agent, so every judgment and outcome is published to the owner's pod through the
# relay, attributed to the agent on behalf of the owner, and each job leaves one comment on the pull
# request with its verdict or selection and links to the descriptors.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # one comment per job, edited in place on later runs

env:
  HARNESS_DIR: applications/jev-harness
  BRIDGE_PORT: '6090'
  # The pod the delegate publishes to, the agent it is registered there as, and the owner it acts for.
  INTEREGO_POD_NAME: u-pk-33d42e6b33dc
  JEV_HARNESS_AGENT_ID: did:web:identity.interego.xwisee.com:agents:jev-harness-bridge-u-did-6de86e8ba294
  JEV_HARNESS_OWNER_WEBID: https://identity.interego.xwisee.com/users/u-pk-33d42e6b33dc/profile#me
  INTEREGO_POD_PUBLIC_ORIGIN: https://gate.interego.xwisee.com

jobs:
  select-and-run:
    name: "select tests → run → triage → outcome"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the bridge bound to this checkout
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          INTEREGO_AGENT_KEY_JSON: ${{ secrets.INTEREGO_AGENT_KEY_JSON }}
          INTEREGO_POD_NAME: ${{ env.INTEREGO_POD_NAME }}
          JEV_HARNESS_AGENT_ID: ${{ env.JEV_HARNESS_AGENT_ID }}
          JEV_HARNESS_OWNER_WEBID: ${{ env.JEV_HARNESS_OWNER_WEBID }}
          JEV_HARNESS_REPO: ${{ github.workspace }}
          BRIDGE_DEPLOYMENT_URL: http://localhost:6090
          PORT: ${{ env.BRIDGE_PORT }}
        run: |
          (cd "$HARNESS_DIR" && npx tsx bridge/server.ts > bridge.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:$BRIDGE_PORT/health" && break; sleep 1; done
          curl -sf "http://localhost:$BRIDGE_PORT/health"
      - name: Follow the selection chain
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/follow.ts "http://localhost:$BRIDGE_PORT/affordances" select-tests \
            --arg base_ref="origin/${{ github.base_ref }}" --arg head_ref=HEAD \
            --then run-selected-tests --run --then triage --outcome \
            --repo "${{ github.workspace }}"
      - name: Comment the selection on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/pr-comment.ts selection --dir "${{ github.workspace }}/.jev-harness/follower" \n            --pod "$INTEREGO_POD_NAME" --pod-public-origin "$INTEREGO_POD_PUBLIC_ORIGIN" > comment.md
          node tools/upsert-pr-comment.mjs "$PR" comment.md "<!-- jev-harness:selection -->"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-harness-judgments
          include-hidden-files: true # the store is the dot-directory .jev-harness/
          path: |
            .jev-harness/
            ${{ env.HARNESS_DIR }}/bridge.log

  review-gate:
    name: "review gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The vertical's IRI guard and descriptor code import @interego/core, which resolves to its
      # built dist/, so the kernel package is built before anything runs.
      - run: npm run build:core
      - name: Start the bridge
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          INTEREGO_AGENT_KEY_JSON: ${{ secrets.INTEREGO_AGENT_KEY_JSON }}
          INTEREGO_POD_NAME: ${{ env.INTEREGO_POD_NAME }}
          JEV_HARNESS_AGENT_ID: ${{ env.JEV_HARNESS_AGENT_ID }}
          JEV_HARNESS_OWNER_WEBID: ${{ env.JEV_HARNESS_OWNER_WEBID }}
          JEV_HARNESS_REPO: ${{ github.workspace }}
          BRIDGE_DEPLOYMENT_URL: http://localhost:6090
          PORT: ${{ env.BRIDGE_PORT }}
        run: |
          (cd "$HARNESS_DIR" && npx tsx bridge/server.ts > bridge.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:$BRIDGE_PORT/health" && break; sleep 1; done
      - name: Gate the diff
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cd "$HARNESS_DIR"
          printf '%s' "$PR_BODY" > pr-body.md
          npx tsx bin/follow.ts "http://localhost:$BRIDGE_PORT/affordances" review-gate \
            --arg base_ref="origin/${{ github.base_ref }}" --arg head_ref=HEAD \
            --arg title="$PR_TITLE" --file description=pr-body.md --gate \
            --repo "${{ github.workspace }}"
      - name: Comment the gate on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd "$HARNESS_DIR"
          npx tsx bin/pr-comment.ts gate --dir "${{ github.workspace }}/.jev-harness/follower" \n            --pod "$INTEREGO_POD_NAME" --pod-public-origin "$INTEREGO_POD_PUBLIC_ORIGIN" > comment.md
          node tools/upsert-pr-comment.mjs "$PR" comment.md "<!-- jev-harness:review-gate -->"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-harness-review
          include-hidden-files: true
          path: .jev-harness/
