name: Verify and build relay publisher credential fix

# Isolated from master and from the deployment workflows. The reusable build
# tags and labels the image with this exact verified candidate commit.
on:
  push:
    branches: [fix/bootstrap-initial-surface-vc-20261017]

permissions:
  contents: read

jobs:
  verify:
    name: Relay production, test and authority invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: Install workspace
        run: npm ci --ignore-scripts
      - name: Build workspace packages (core, then leaves)
        run: npm run build
      - name: Typecheck the relay (build program)
        working-directory: deploy/mcp-relay
        run: npx tsc --noEmit -p tsconfig.json
      - name: Typecheck the relay tests
        working-directory: deploy/mcp-relay
        run: npx tsc --noEmit -p tsconfig.tests.json
      - name: Run the complete relay test suite
        working-directory: deploy/mcp-relay
        run: npm test
      - name: Typecheck optional resource compositions
        run: |
          npx tsc --noEmit -p integrations/application-runtime/tsconfig.json
          npx tsc --noEmit -p integrations/affordance-surface/tsconfig.json

  build:
    name: Build the verified relay candidate
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-ghcr.yml
    with: { image: interego-relay }
