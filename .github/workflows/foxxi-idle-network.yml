name: Foxxi idle network regressions
on:
  pull_request:
    paths:
      - 'applications/foxxi-content-intelligence/src/gateway-transport.ts'
      - 'applications/foxxi-content-intelligence/src/on-demand-work.ts'
      - 'applications/foxxi-content-intelligence/src/directory-demand.ts'
      - 'applications/foxxi-content-intelligence/tests/directory-demand.test.ts'
      - 'applications/foxxi-content-intelligence/src/tenant-fetcher.ts'
      - 'applications/foxxi-content-intelligence/src/admin-payload-read.ts'
      - 'applications/foxxi-content-intelligence/tests/a-request-read-keeps-the-shared-directory.test.ts'
      - 'applications/foxxi-content-intelligence/bridge/server.ts'
      - 'applications/agentic-performance-practice/compatibility/foxxi-performance-routes.ts'
      - 'tests/foxxi-idle-network.test.mjs'
      - '.github/workflows/foxxi-idle-network.yml'
      - 'packages/pgsl/src/**'
      - 'tests/immutable-artifact-cache.test.ts'
      - 'tests/native-commit-store.test.ts'
      - 'tests/pgsl-cas-persistence.test.ts'
      - 'applications/foxxi-content-intelligence/src/statement-store.ts'
      - 'applications/foxxi-content-intelligence/src/foundation-shared-lattice.ts'
      - 'applications/foxxi-content-intelligence/src/lattice-checkpoint.ts'
      - 'applications/foxxi-content-intelligence/tests/lattice-checkpoint.test.ts'
      - 'applications/foxxi-content-intelligence/tests/public-memory-commons.test.ts'
  push:
    branches: [master]
    paths:
      - 'applications/foxxi-content-intelligence/src/gateway-transport.ts'
      - 'applications/foxxi-content-intelligence/src/on-demand-work.ts'
      - 'applications/foxxi-content-intelligence/src/directory-demand.ts'
      - 'applications/foxxi-content-intelligence/tests/directory-demand.test.ts'
      - 'applications/foxxi-content-intelligence/src/tenant-fetcher.ts'
      - 'applications/foxxi-content-intelligence/src/admin-payload-read.ts'
      - 'applications/foxxi-content-intelligence/tests/a-request-read-keeps-the-shared-directory.test.ts'
      - 'applications/foxxi-content-intelligence/bridge/server.ts'
      - 'tests/foxxi-idle-network.test.mjs'
permissions:
  contents: read
jobs:
  idle-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm ci
      # After install: the bridge guard parses server.ts with the TypeScript compiler.
      - run: node --test tests/foxxi-idle-network.test.mjs
      - run: npm run build
      - name: Verify directory demand and existing credential gates
        run: npx vitest run applications/foxxi-content-intelligence/tests/directory-demand.test.ts applications/foxxi-content-intelligence/tests/a-request-read-keeps-the-shared-directory.test.ts applications/foxxi-content-intelligence/tests/nrps-consumer-is-operator-only.test.ts applications/foxxi-content-intelligence/tests/cmi5-signed-launch.test.ts applications/foxxi-content-intelligence/tests/a-learner-reads-their-own-profile.test.ts
      - name: Verify native cache, exact write receipts and duplicate snapshot handling
        run: npx vitest run tests/immutable-artifact-cache.test.ts tests/native-commit-store.test.ts tests/pgsl-cas-persistence.test.ts applications/foxxi-content-intelligence/tests/public-memory-commons.test.ts applications/foxxi-content-intelligence/tests/lattice-checkpoint.test.ts
