name: Linked procedure runner

on:
  pull_request:
    paths:
      - 'integrations/procedure-runner/**'
      - 'examples/procedures/**'
      - 'packages/core/**'
      - 'docs/ns/procedure*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/procedure-runner.yml'
  push:
    branches: [master]
    paths:
      - 'integrations/procedure-runner/**'
      - 'examples/procedures/**'
      - 'packages/core/**'
      - 'docs/ns/procedure*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/procedure-runner.yml'

permissions:
  contents: read

# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linked-procedure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - name: Validate execution boundaries and HMD semantic projection
        run: node --test integrations/procedure-runner/*.test.mjs
