name: Pod store collector

# Every week, measure how much of the pod store's Postgres table is unreferenced history, and
# on demand rebuild the table from its live set or drop the previous table.
#
# ── WHY THIS RUNS ON A SCHEDULE ────────────────────────────────────────────────────────────
#
# The store is grow-only and content-addressed; every overwrite leaves the old nodes behind
# (packages/pgsl-store/src/gc.ts says what "live" means). On 2026-09-20 that history reached
# 45 GB against 666 MB of live data, the volume filled, and every pod answered 500. The dry run
# reads only and prints the live set beside the table's size, so the gap is visible weekly
# instead of discovered by an outage. The rebuild holds an ACCESS EXCLUSIVE lock for the
# minutes it takes (readers and writers wait), so it is dispatched by a person, never scheduled.
#
# The database is reachable only on Railway's private network; tools/pgsl-store-gc-remote.mjs
# opens a temporary TCP route with the project token for the run and deletes it afterwards.

on:
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (reads only), rebuild (swap the live rows in; the previous table stays for drop), drop (drop the table named below), tune (autovacuum thresholds)'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, rebuild, drop, tune]
      drop_table:
        description: 'For mode=drop: the previous table to drop, e.g. pgsl_kv_old_20260920'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pgsl-store-gc
  cancel-in-progress: false

jobs:
  collect:
    name: "${{ github.event.inputs.mode || 'dry-run' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the collector through a temporary route
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          DROP_TABLE: ${{ github.event.inputs.drop_table }}
        run: |
          case "$MODE" in
            dry-run) node tools/pgsl-store-gc-remote.mjs ;;
            rebuild) node tools/pgsl-store-gc-remote.mjs --rebuild ;;
            tune)    node tools/pgsl-store-gc-remote.mjs --tune ;;
            drop)
              if [ -z "$DROP_TABLE" ]; then echo "mode=drop needs drop_table" >&2; exit 2; fi
              node tools/pgsl-store-gc-remote.mjs --drop "$DROP_TABLE" ;;
            *) echo "unknown mode $MODE" >&2; exit 2 ;;
          esac
