name: Pod store collector

# Every week, measure how much of the pod store's Postgres table is unreferenced history, rebuild
# the table from its live set when that share has crossed a line, and drop the copy a rebuild
# left behind once the store has run on the new table for a week. Any mode can still be
# dispatched by hand.
#
# ── WHY THIS RUNS ON A SCHEDULE ────────────────────────────────────────────────────────────
#
# The store is grow-only and content-addressed; every overwrite leaves the old nodes behind
# (packages/pgsl-store/src/gc.ts says what "live" means). On 2026-09-20 that history reached
# 45 GB against 666 MB of live data, the volume filled, and every pod answered 500. The dry run
# reads only and prints the live set beside the table's size, so the gap is visible weekly
# instead of discovered by an outage. The rebuild holds an ACCESS EXCLUSIVE lock for the
# minutes it takes (readers and writers wait), so the weekly run takes it only above a line —
# at least half of a table of at least two million rows unreferenced, the outage's shape and not
# a normal week's — and at the quietest hour. Since compose stopped rewriting the projection
# rows of existing nodes (2026-09-21) a normal week stays far below that line, so most Sundays
# this is a measurement and nothing else. `rebuildDecision` in tools/pgsl-store-gc.ts is the
# line, with its tests; the log says which way it went and why.
#
# The database is reachable only on Railway's private network; tools/pgsl-store-gc-remote.mjs
# opens a temporary TCP route with the project token for the run and deletes it afterwards.

on:
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly (what the schedule runs: drop last week''s copy, measure, rebuild above the line), dry-run (reads only), rebuild (swap the live rows in; the previous table stays for drop), drop (drop the table named below), tune (autovacuum thresholds)'
        type: choice
        required: true
        default: weekly
        options: [weekly, dry-run, rebuild, drop, tune]
      drop_table:
        description: 'For mode=drop: the previous table to drop, e.g. pgsl_kv_old_20260920'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pgsl-store-gc
  cancel-in-progress: false

jobs:
  collect:
    name: "${{ github.event.inputs.mode || 'weekly' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the collector through a temporary route
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'weekly' }}
          DROP_TABLE: ${{ github.event.inputs.drop_table }}
        run: |
          set -o pipefail
          case "$MODE" in
            weekly)  node tools/pgsl-store-gc-remote.mjs --drop-previous-older-than 7 --rebuild-above 0.5 --min-rows 2000000 2>&1 | tee collector.log ;;
            dry-run) node tools/pgsl-store-gc-remote.mjs 2>&1 | tee collector.log ;;
            rebuild) node tools/pgsl-store-gc-remote.mjs --rebuild ;;
            tune)    node tools/pgsl-store-gc-remote.mjs --tune ;;
            drop)
              if [ -z "$DROP_TABLE" ]; then echo "mode=drop needs drop_table" >&2; exit 2; fi
              node tools/pgsl-store-gc-remote.mjs --drop "$DROP_TABLE" ;;
            *) echo "unknown mode $MODE" >&2; exit 2 ;;
          esac

      # ★ THE WEEKLY MEASUREMENT IS THE QUARTER'S MONITORING REVIEW. What the dry run measured —
      # live keys against table rows, what a rebuild would keep — lands on the operator's pod as
      # this quarter's soc2:QuarterlyReviewEvent of kind monitoring, published by the fleet's
      # delegate agent (tools/fleet-event.ts). The graph IRI is the quarter's, so each week's run
      # supersedes the last and the review is always the latest reading with the earlier ones
      # behind it in the chain. Only after a run that succeeded: a failed run measured nothing. The
      # weekly run's log carries the rebuild decision and any rebuild, so the review says so too.
      - name: Record the measurement as this quarter's monitoring review
        if: ${{ contains(fromJSON('["weekly","dry-run"]'), github.event.inputs.mode || 'weekly') }}
        env:
          INTEREGO_FLEET_AGENT_KEY_JSON: ${{ secrets.INTEREGO_FLEET_AGENT_KEY_JSON }}
          INTEREGO_FLEET_POD_NAME: ${{ vars.INTEREGO_FLEET_POD_NAME }}
        run: |
          npm run build:core && npm run build --workspace @interego/compliance && npm run build --workspace @interego/ops
          npx tsx tools/fleet-event.ts review --kind monitoring --summary-file collector.log
