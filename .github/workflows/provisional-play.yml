name: Provisional native play
on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/identity/**'
      - 'deploy/css-gate/**'
      - 'deploy/mcp-relay/provisional-play*.ts'
      - 'deploy/Dockerfile.identity'
      - 'deploy/Dockerfile.css-gate'
      - '.github/workflows/provisional-play.yml'
  push:
    branches: [master]
    paths:
      - 'deploy/identity/**'
      - 'deploy/css-gate/**'
      - '.github/workflows/provisional-play.yml'
permissions:
  contents: read
# A new push to the same pull request makes the run in flight moot: it tests a head that is no
# longer the pull request's, and it holds runners the new head's checks are queued behind. Cancel
# it. Any other event (a master push, a dispatch, a schedule) is grouped by its own run id, so
# nothing there is ever cancelled or held: auto-deploy reads every master run to its conclusion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  identity-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint provisional native ports
        run: npx eslint deploy/identity/provisional-play*.ts deploy/identity/provisional-general-guest*.ts deploy/mcp-relay/provisional-play*.ts deploy/identity/tests/provisional-play*.ts deploy/identity/tests/provisional-general-guest*.ts deploy/mcp-relay/tests/provisional-play*.ts
      - run: npx tsc --noEmit -p deploy/identity/tsconfig.json
      - run: npm test --workspace @interego/identity
  guest-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix deploy/css-gate --no-audit --no-fund
      - run: node --test deploy/css-gate/tests/*.test.mjs

