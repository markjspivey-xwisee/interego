name: Recovery credential audit
on:
  workflow_dispatch:
    inputs:
      service:
        description: Read-only audit; no service is deployed
        required: true
        default: css
      tag:
        description: Audit is pinned to the approved 4d419800 recovery images
        required: false
        default: '4d41980040f08123bf787523938596d304a77e35'
      set_registry_credentials:
        description: Ignored; this incident-branch audit makes no production changes
        type: boolean
        required: false
        default: false
permissions: {}
concurrency:
  group: pgsl-recovery-credential-audit
  cancel-in-progress: false
jobs:
  credential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing credentials without exposing or changing them
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const project="b88ceabb-7461-4949-81d7-3d29132e7806",environment="449996a2-3533-462f-98c6-4ab4c05dd777";
          const tag="4d41980040f08123bf787523938596d304a77e35";
          let failed=false;
          const say=x=>console.log(JSON.stringify(x));
          try{
           const token=process.env.RAILWAY_PROJECT_TOKEN;
           if(!token)throw Error("missing");
           const response=await fetch("https://backboard.railway.com/graphql/v2",{method:"POST",headers:{"Content-Type":"application/json","Project-Access-Token":token},body:JSON.stringify({query:"{projectToken{projectId environmentId}}"}),signal:AbortSignal.timeout(15000)});
           const body=await response.json(),scope=body.data?.projectToken;
           const valid=response.ok&&!body.errors?.length&&scope?.projectId===project&&scope?.environmentId===environment;
           say({check:"railway-project-token",valid,http:response.status,scopeMatches:scope?.projectId===project&&scope?.environmentId===environment,apiErrors:Boolean(body.errors?.length)});if(!valid)failed=true;
          }catch{say({check:"railway-project-token",valid:false,reason:"unavailable-or-unconfigured"});failed=true;}
          for(const image of ["interego-css-pgsl","interego-relay"]){
           try{
            const secret=process.env.GHCR_TOKEN;if(!secret)throw Error("missing");
            const path="markjspivey-xwisee/"+image;
            const auth=await fetch("https://ghcr.io/token?service=ghcr.io&scope="+encodeURIComponent("repository:"+path+":pull"),{headers:{Authorization:"Basic "+Buffer.from("markjspivey-xwisee:"+secret).toString("base64")},signal:AbortSignal.timeout(15000)});
            if(!auth.ok){say({check:"ghcr-pull",image,valid:false,stage:"authentication",http:auth.status});failed=true;continue;}
            const bearer=(await auth.json()).token;if(!bearer)throw Error("no-token");
            const manifest=await fetch("https://ghcr.io/v2/"+path+"/manifests/"+tag,{method:"HEAD",headers:{Authorization:"Bearer "+bearer,Accept:"application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"},signal:AbortSignal.timeout(15000)});
            say({check:"ghcr-pull",image,tag,valid:manifest.ok,http:manifest.status,digest:manifest.headers.get("docker-content-digest")});if(!manifest.ok)failed=true;
           }catch{say({check:"ghcr-pull",image,valid:false,reason:"unavailable-or-unconfigured"});failed=true;}
          }
          process.exitCode=failed?1:0;
          NODE
