name: Register WorldCraft meetup guest access
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the WorldCraft registration (unchecked previews the change)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: coached-world-guest-provision
  cancel-in-progress: false
jobs:
  register:
    if: github.repository == 'markjspivey-xwisee/interego' && github.ref == 'refs/heads/codex/worldcraft-guest-registration'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install the existing Interego validation helper's dependencies
        run: npm ci --ignore-scripts
      - name: Check the Interego guest configuration validator
        # This branch runs a WorldCraft-specific job. The master-only assertion
        # applies to the coached-world job that remains unchanged on master.
        run: node --test --test-name-pattern='^(?!the workflow is dispatch-only from master)' tests/coached-world-guest-provision.test.mjs
      - name: Register the WorldCraft meetup origin
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          REQUEST_APPLY: ${{ inputs.apply }}
          WORLDCRAFT_AGENT_DID: 'did:web:identity.interego.xwisee.com:agents:mcp-client-u-eth-0cf912ece9d9'
          WORLDCRAFT_POD_URL: 'https://gate.interego.xwisee.com/u-eth-0cf912ece9d9/'
        run: |
          APPLY=false node tools/worldcraft-guest-registration.mjs
          if [ "$REQUEST_APPLY" = true ]; then
            APPLY=true node tools/worldcraft-guest-registration.mjs
          fi
